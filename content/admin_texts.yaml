# Тексты для администраторов: группа «Лично не публично», тревоги, отчёты, быстрые ответы.
alerts:
  # начало каждой тревоги в теме «🚨 Тревоги»
  prefix: "🚨 "
  # сводка после окна склейки: {count} — сколько раз тревога повторилась после первой,
  # {minutes} — длина окна, {text} — текст первой тревоги
  repeated: |-
    Повторов за {minutes} мин после первой тревоги: {count}
    {text}
  # клиент нажал «🚀 Подключиться», а панель Remnawave не ответила
  remnawave_unavailable: "Remnawave не отвечает: клиенты не могут открыть «Подключиться»."
  # бот запустился, но панель Remnawave не ответила на проверку версии
  remnawave_at_start: "Remnawave не ответила при запуске бота. Меню работает, подписки — нет."
  # клиент выбрал тариф, а платёжка не создала платёж
  payments_unavailable: "Платёжка не отвечает: клиенты не могут получить ссылку на оплату."
  # ошибка в обработчике бота; {error} — тип ошибки, подробности — в логе сервера
  bot_error: "Ошибка в боте: {error}. Подробности — в логе сервера."
  # бот не смог создать тему обращения; {error} — ответ Telegram
  support_topic_failed: |-
    Не получилось создать тему для обращения #{ticket_id}: {error}. Проверьте, что в группе включены темы, а у бота есть право «Управление темами». Клиенту ответили «попробуйте позже».
  # задача 09: вебхук Remnawave с неверной подписью — подделка или разные секреты у панели и бота
  remnawave_webhook_forged: "Отклонён вебхук Remnawave с неверной подписью. Если повторяется — проверьте, что WEBHOOK_SECRET_HEADER панели совпадает с REMNAWAVE_WEBHOOK_SECRET бота."
  # задача 09: сверка с Remnawave не смогла прочитать аккаунты или ноды, панель не отвечает
  reconcile_unavailable: "Сверка с Remnawave не прошла: панель не отвечает. Пропущенные окончания сроков и сбои нод догоним при следующей сверке."
  # задача 09: панель ответила, но сверка не прошла; {error} — тип ошибки, подробности в логе
  reconcile_error: "Сверка с Remnawave не прошла: {error}. Подробности — в логе сервера."
  # задача 09: при сверке упали обработчики; {count} — сколько раз, подробности в логе
  reconcile_failed: "Сверка с Remnawave: ошибок при обработке клиентов — {count}. Подробности — в логе сервера, следующая сверка повторит."
  # задача 09: нода потеряла связь с панелью; {name} — имя ноды, {since} — с какого момента
  node_down: "Нода «{name}» потеряла связь с панелью (с {since}). Клиенты на ней могут быть без доступа."
  # задача 09: связь с нодой восстановилась; {minutes} — длительность простоя в минутах
  node_restored: "Нода «{name}»: связь восстановлена. Простой — {minutes} мин (с {since} по {until})."
  # задача 13: сумма оплаты не совпала с ценой тарифа; {amount} — оплачено, {price} — цена, ₽
  payment_amount_mismatch: "Заказ #{order_id}: оплачено {amount} ₽ вместо {price} ₽. Срок пересчитан пропорционально оплате (+2 часа), клиенту отправлено извинение. Проверьте платёжку."
  # задача 13: платёжка подтвердила оплату, а записать её в базу не вышло и после повторов;
  # {payment_id} — номер платежа у платёжки, {error} — тип ошибки, подробности — в логе
  payment_not_recorded: "Оплата {payment_id} по заказу #{order_id} подтверждена платёжкой, но не записалась в базу ({error}). Проверка оплат попробует ещё раз; если заказ так и не станет оплаченным — засчитайте вручную."
  # задача 13: доступ по оплате не выдан за 30 минут повторов; {error} — ошибка панели
  grant_delayed: "Заказ #{order_id} (клиент {telegram_id}) оплачен, но доступ не выдан уже 30 минут: {error}. Бот повторяет раз в 10 минут до суток."
  # задача 13: повторы выдачи кончились (сутки)
  grant_failed: "Заказ #{order_id} (клиент {telegram_id}) оплачен, но доступ не выдан за сутки: {error}. Повторы остановлены — выдайте доступ вручную."
  # задача 13: панель отклонила выдачу, повтор не поможет
  grant_manual: "Заказ #{order_id} (клиент {telegram_id}) оплачен, но выдать доступ автоматически нельзя: {error}. Выдайте доступ вручную."

# Задача 13: тема «💰 Оплаты» — сообщение о каждой оплате.
# {order_id} — номер заказа, {amount} — оплачено, ₽, {tariff_id} и {days} — тариф и его дни,
# {name}, {username}, {telegram_id} — клиент
payments:
  received: |-
    💰 <b>Оплата по заказу #{order_id}: {amount} ₽</b>
    Тариф {tariff_id} ({days} дн.)
    Клиент: {name}, @username: {username}, Telegram ID: <code>{telegram_id}</code>
  # оплачено не на сумму тарифа; {price} — цена тарифа, ₽
  received_prorated: |-
    💰 <b>Оплата по заказу #{order_id}: {amount} ₽ вместо {price} ₽</b>
    Тариф {tariff_id} ({days} дн.). ⚠️ Сумма не совпала с тарифом — срок пересчитан пропорционально оплате (+2 часа), клиенту отправлено извинение.
    Клиент: {name}, @username: {username}, Telegram ID: <code>{telegram_id}</code>
  # подставляется вместо @username, если его нет
  no_username: нет

# Поддержка: тема на каждое обращение. Сообщение в теме уходит клиенту от «Поддержки»,
# сообщение, начинающееся с //, — внутренняя заметка (клиенту не уходит).
support:
  # название темы, обычный текст без разметки, до 128 символов
  topic_name: "#{ticket_id} {name}"
  # первое сообщение в теме
  topic_header: |-
    <b>Обращение #{ticket_id}</b>
    Клиент: {name}, @username: {username}, Telegram ID: <code>{telegram_id}</code>

    Ответ в этой теме уйдёт клиенту от «Поддержки». Начните сообщение с // — это заметка, клиент её не увидит.
  # подставляется в topic_header, если у клиента нет @username
  no_username: нет
  # администратор прислал в тему то, что клиенту не передаём (стикер, опрос, …)
  reply_unsupported: ⚠️ Такое сообщение клиенту не передаётся. Напишите текстом или пришлите фото, файл или голосовое.
  # Telegram отказался доставить ответ; {error} — ответ Telegram
  reply_failed: "⚠️ Не отправлено клиенту: {error}"
  client_blocked: ⚠️ Клиент заблокировал бота — ответ не доставлен (в переписке сохранён).

# Задача 18: админка — поиск клиента, карточка и действия. Команды работают только
# от администраторов и только в этой группе; каждое действие записывается в журнал.
admin:
  # /client без запроса или с непонятным запросом; {max_days} — предел ручной выдачи
  usage: |-
    <b>Админка</b>
    /client 123456789 или /client @username — карточка клиента: подписка, оплаты, пробный, устройства.
    /give 123456789 30 — выдать или продлить подписку на 30 дней (не больше {max_days} за раз).
    Остальное — кнопками под карточкой. Действия всегда по Telegram ID: @username мог смениться.
  # /give без нужных чисел
  give_usage: "Формат: /give 123456789 30 — Telegram ID клиента и число дней (от 1 до {max_days})."
  days_out_of_range: "Дней должно быть от 1 до {max_days} за раз."
  # {query} — что искали
  not_found: "Среди клиентов бота нет: {query}"
  client_not_found: "Клиента с Telegram ID <code>{telegram_id}</code> нет среди клиентов бота."
  # несколько клиентов с одним @username (старый @username сменил владельца)
  many_found: "С таким @username несколько клиентов — выберите по Telegram ID:"
  many_found_item: "• {name} — /client {telegram_id}"
  panel_unavailable: "⚠️ Панель Remnawave не ответила. Попробуйте ещё раз через минуту."
  cancelled: "Отменено."
  # всплывающий ответ на кнопку админки не от администратора или не в группе (до 200 символов)
  not_admin: "Это могут только администраторы в группе администраторов."
  # подставляется, если у клиента нет имени или @username
  no_value: нет
  card:
    title: |-
      <b>Клиент {name}</b>
      Telegram ID: <code>{telegram_id}</code>, @username: {username}
      В боте с {first_seen_at}
    blocked: "⛔ Заблокировал бота {at}"
    status_trial: "Подписка: пробный до {expire_at}"
    status_trial_traffic_used_up: "Подписка: пробный до {expire_at}, трафик исчерпан"
    status_active: "Подписка: активна до {expire_at}"
    status_grace: "Подписка: льготный период до {expire_at}"
    status_expired: "Подписка: закончилась {expire_at}"
    status_suspended: "Подписка: доступ выключен, срок до {expire_at}"
    no_account: "Подписка: прокси-аккаунта нет"
    panel_unavailable: "Подписка: панель Remnawave не ответила — срок и устройства сейчас неизвестны"
    traffic: "Трафик пробного: {used} из {limit} ГБ"
    devices: "Устройства: {used} из {limit}"
    devices_no_limit: "Устройства: {used}"
    grace: "Льготный период начался {at}"
    trial_none: "Пробный: не брал"
    trial_delivered: "Пробный: выдан {at}, продлений: {extensions}"
    trial_pending: "Пробный: отмечен {at}, ещё не доставлен (панель не ответила)"
    payments_none: "Оплат нет"
    payments: "Оплат: {count} на {total} ₽. Последние:"
    payment_item: "• {paid_at} — {tariff}, {days} дн., {amount} ₽ ({status})"
  # состояние заказа в строке оплаты
  order_status:
    created: создан
    paid: оплачен, доступ выдаётся
    access_granted: доступ выдан
    access_failed: доступ не выдан
    manual_review: ручная проверка
    canceled: отменён
    refunded: возвращён
  buttons:
    extend: "➕ {days} дн."
    devices: "📱 Устройства"
    reset_trial: "🎁 Сбросить пробный"
    revoke: "🔄 Перевыпустить ссылку"
    confirm_extend: "✅ Да, выдать {days} дн."
    confirm_reset: "✅ Да, сбросить"
    confirm_revoke: "✅ Да, перевыпустить"
    cancel: "✖️ Отмена"
    delete_device: "🗑 {number}"
  extend:
    # {current} — нынешний срок или extend.no_account, {new} — новый срок
    preview: |-
      Выдать клиенту {name} (Telegram ID <code>{telegram_id}</code>) {days} дн.?
      Сейчас: {current}
      Станет: до {new}
    no_account: "прокси-аккаунта нет — будет создан"
    done: "✅ Клиенту <code>{telegram_id}</code> выдано {days} дн. Подписка до {expire_at}."
    changed: |-
      ⚠️ Срок клиента <code>{telegram_id}</code> уже изменился (сейчас: {current}) — ничего не сделано. Откройте карточку заново: /client {telegram_id}
  reset:
    ask: |-
      Сбросить пробный клиенту <code>{telegram_id}</code>? Он снова увидит «🎁 Попробовать бесплатно», и нажатие даст 7 дней с нуля на прежнем аккаунте.
    done: "✅ Пробный клиента <code>{telegram_id}</code> сброшен."
    not_used: "Клиент <code>{telegram_id}</code> пробный не брал — сбрасывать нечего."
    has_paid: "Клиент <code>{telegram_id}</code> уже платил — пробный ему не положен, сброс не нужен."
  revoke:
    ask: |-
      Перевыпустить ссылку подписки клиенту <code>{telegram_id}</code>? Старая перестанет работать: на всех устройствах подписку нужно будет добавить заново.
    done: "✅ Ссылка клиента <code>{telegram_id}</code> перевыпущена. Новая — у клиента в «🚀 Подключиться»."
    no_account: "У клиента <code>{telegram_id}</code> нет прокси-аккаунта — перевыпускать нечего."
  devices:
    title: "Устройства клиента <code>{telegram_id}</code>: {used} из {limit}"
    title_no_limit: "Устройства клиента <code>{telegram_id}</code>: {used}"
    item: "{number}. {name} — {system}, подключено {connected_at}"
    unknown: "?"
    empty: "У клиента <code>{telegram_id}</code> нет подключённых устройств."
    no_account: "У клиента <code>{telegram_id}</code> нет прокси-аккаунта."
    deleted: "✅ Устройство удалено."
    not_found: "Этого устройства у клиента уже нет."
