# Тексты для администраторов: группа «Лично не публично», тревоги, отчёты, быстрые ответы.
alerts:
  # начало каждой тревоги в теме «🚨 Тревоги»
  prefix: "🚨 "
  # сводка после окна склейки: {count} — сколько раз тревога повторилась после первой,
  # {minutes} — длина окна, {text} — текст первой тревоги
  repeated: |-
    Повторов за {minutes} мин после первой тревоги: {count}
    {text}
  # клиент нажал «🚀 Подключиться», а панель Remnawave не ответила
  remnawave_unavailable: "Remnawave не отвечает: клиенты не могут открыть «Подключиться»."
  # бот запустился, но панель Remnawave не ответила на проверку версии
  remnawave_at_start: "Remnawave не ответила при запуске бота. Меню работает, подписки — нет."
  # клиент выбрал тариф, а платёжка не создала платёж
  payments_unavailable: "Платёжка не отвечает: клиенты не могут получить ссылку на оплату."
  # задача 29: бот запущен с PAYMENTS_MODE=off — тестовый запуск без платёжки
  payments_off: "Оплата выключена (PAYMENTS_MODE=off): клиенты видят тарифы, но купить не могут — доступен только пробный. Перед открытием продаж подключите платёжку и перезапустите бота."
  # ошибка в обработчике бота; {error} — тип ошибки, подробности — в логе сервера
  bot_error: "Ошибка в боте: {error}. Подробности — в логе сервера."
  # бот не смог создать тему обращения; {error} — ответ Telegram
  support_topic_failed: |-
    Не получилось создать тему для обращения #{ticket_id}: {error}. Проверьте, что в группе включены темы, а у бота есть право «Управление темами». Клиенту ответили «попробуйте позже».
  # задача 09: вебхук Remnawave с неверной подписью — подделка или разные секреты у панели и бота
  remnawave_webhook_forged: "Отклонён вебхук Remnawave с неверной подписью. Если повторяется — проверьте, что WEBHOOK_SECRET_HEADER панели совпадает с REMNAWAVE_WEBHOOK_SECRET бота."
  # задача 09: сверка с Remnawave не смогла прочитать аккаунты или ноды, панель не отвечает
  reconcile_unavailable: "Сверка с Remnawave не прошла: панель не отвечает. Пропущенные окончания сроков и сбои нод догоним при следующей сверке."
  # задача 09: панель ответила, но сверка не прошла; {error} — тип ошибки, подробности в логе
  reconcile_error: "Сверка с Remnawave не прошла: {error}. Подробности — в логе сервера."
  # задача 09: при сверке упали обработчики; {count} — сколько раз, подробности в логе
  reconcile_failed: "Сверка с Remnawave: ошибок при обработке клиентов — {count}. Подробности — в логе сервера, следующая сверка повторит."
  # задача 09: нода потеряла связь с панелью; {name} — имя ноды, {since} — с какого момента
  node_down: "Нода «{name}» потеряла связь с панелью (с {since}). Клиенты на ней могут быть без доступа."
  # задача 09: связь с нодой восстановилась; {minutes} — длительность простоя в минутах
  node_restored: "Нода «{name}»: связь восстановлена. Простой — {minutes} мин (с {since} по {until})."
  # задача 13: сумма оплаты не совпала с ценой тарифа; {amount} — оплачено, {price} — цена, ₽
  payment_amount_mismatch: "Заказ #{order_id}: оплачено {amount} ₽ вместо {price} ₽. Срок пересчитан пропорционально оплате (+2 часа), клиенту отправлено извинение. Проверьте платёжку."
  # задача 13: платёжка подтвердила оплату, а записать её в базу не вышло и после повторов;
  # {payment_id} — номер платежа у платёжки, {error} — тип ошибки, подробности — в логе
  payment_not_recorded: "Оплата {payment_id} по заказу #{order_id} подтверждена платёжкой, но не записалась в базу ({error}). Проверка оплат попробует ещё раз; если заказ так и не станет оплаченным — засчитайте вручную."
  # задача 14: уведомление об оплате с неизвестным номером платежа или неразборчивое.
  # Повторы склеиваются: одна запись в журнале и эта тревога
  payment_notification_forged: "Пришло уведомление об оплате, которому нет заказа (или его не разобрать). К платёжке не обращались, ничего не засчитано — скорее всего, подделка; повторы склеиваются в одну запись журнала. Если это была настоящая оплата, фоновая проверка найдёт её сама."
  # задача 14: платёжка говорит «оплачено», но платёж не сходится с заказом — не засчитан.
  # {payment_id} — номер платежа, {reason} — что не сошлось
  payment_rejected: "Заказ #{order_id}: платёж {payment_id} не засчитан — {reason}. Проверьте платёж в кабинете платёжки и при необходимости выдайте доступ вручную."
  # задача 14: фоновая проверка оплат не достучалась до платёжки
  payment_checks_unavailable: "Проверка оплат: платёжка не отвечает. Оплаты с потерянными уведомлениями засчитаем, когда она ответит."
  # задача 14: ежедневная сверка с платёжкой нашла расхождения; ниже — строки payments.reconcile.*
  payments_reconcile: "Сверка оплат с платёжкой за сутки: расхождений — {count}."
  # задача 14: ежедневная сверка не достучалась до платёжки
  payments_reconcile_unavailable: "Сверка оплат с платёжкой не прошла: платёжка не отвечает. Повторим завтра."
  # задача 13: доступ по оплате не выдан за 30 минут повторов; {error} — ошибка панели
  grant_delayed: "Заказ #{order_id} (клиент {telegram_id}) оплачен, но доступ не выдан уже 30 минут: {error}. Бот повторяет раз в 10 минут до суток."
  # задача 13: повторы выдачи кончились (сутки)
  grant_failed: "Заказ #{order_id} (клиент {telegram_id}) оплачен, но доступ не выдан за сутки: {error}. Повторы остановлены — выдайте доступ вручную."
  # задача 13: панель отклонила выдачу, повтор не поможет
  grant_manual: "Заказ #{order_id} (клиент {telegram_id}) оплачен, но выдать доступ автоматически нельзя: {error}. Выдайте доступ вручную."
  # задача 28: администратор выключил или включил пробные; {admin_id} — его Telegram ID
  trials_disabled: "⏸ Пробные выключены администратором {admin_id}. Новые клиенты не видят «🎁 Попробовать бесплатно»; уже выданные пробные работают. Включить — /trials."
  trials_enabled: "▶️ Пробные снова включены администратором {admin_id}."
  # задача 28: бот выключил пробные сам; {count} — новых пробных за {minutes} мин
  trials_spam: "Похоже на спам: {count} пробных за {minutes} мин. Пробные выключены и сами не включатся. Проверьте новых клиентов; включить — /trials → «▶️ Включить пробные»."
  # задача 20: прогон компенсации упал целиком (например, панель не отдала список аккаунтов);
  # {run_id} — номер компенсации, {error} — тип ошибки, подробности в логе
  compensation_failed: "Компенсация #{run_id} прервалась: {error}. Подробности — в логе сервера. Нажмите «Компенсировать» ещё раз — бот продолжит с того же места и никому не начислит дважды."
  # задача 22: сторож фоновых задач. {name} — имя задачи, {since} — последний успех
  # (или запуск бота), {hint} — job_hint_running либо job_hint_failing
  job_stale: "Фоновая задача «{name}» не отрабатывает: последний успешный запуск — {since}. {hint}"
  job_stale_never: "Фоновая задача «{name}» ни разу не отработала с запуска бота ({since}). {hint}"
  job_hint_running: "Выполняется с {since} — похоже, зависла."
  job_hint_failing: "Падает с ошибкой или не запускается — подробности в логе сервера."
  job_recovered: "Фоновая задача «{name}» снова работает."
  # задача 22: бэкап панели Remnawave (скрипт ops/remnawave-backup на сервере)
  # {since} — время последней копии или panel_backup_never
  panel_backup_stale: "Бэкап панели Remnawave: нет свежей копии больше 26 часов (последняя — {since}). Проверьте cron и журнал скрипта на сервере."
  panel_backup_never: "ни одной копии"
  # {copy} — путь к копии на сервере
  panel_backup_not_sent: "Бэкап панели Remnawave: копия на сервере есть ({copy}), но в Telegram не ушла."
  # журнал или папку копий не прочитать; {error} — ошибка
  panel_backup_unreadable: "Бэкап панели Remnawave: бот не может прочитать журнал или папку копий ({error}). Проверьте права доступа на сервере."

# Задача 22: ежедневный отчёт в 10:00 МСК — за вчерашний день по Москве и «что висит сейчас».
# Каждая строка — отдельный текст. {at} — время копии по Москве, {size} — её размер.
# Подписки, обращения и клиенты «сейчас» — строками admin.stats (задача 19).
report:
  title: "📊 <b>Отчёт за {day}</b>"
  new_clients: "👤 Новых клиентов: {count}"
  trials: "🎁 Пробных выдано: {count}"
  # {amount} — сумма оплат, ₽
  payments: "💰 Оплат: {count} на {amount} ₽"
  # только если такие есть: оплачены, а доступ не выдан (ждут повтора или администратора)
  unfinished_orders: "⚠️ Оплачено, но доступ не выдан: {count} — проверьте «💰 Оплаты» и «🚨 Тревоги»"
  alerts: "🚨 Тревог: {count}"
  # бот перезапускался вчера или сегодня: счёт тревог в памяти, идёт с запуска
  alerts_since_start: "🚨 Тревог: {count} (считаем с запуска бота {since})"
  bot_backup_sent: "💾 База бота: копия {at}, {size}, в Telegram отправлена"
  bot_backup_not_sent: "💾 База бота: ⚠️ копия {at}, {size}, в Telegram не ушла"
  # копию сделал бот до перезапуска — ушла ли она в Telegram, бот не помнит
  bot_backup_sent_unknown: "💾 База бота: копия {at}, {size}"
  bot_backup_stale: "💾 База бота: ⚠️ нет копии моложе 26 часов (последняя — {at})"
  bot_backup_none: "💾 База бота: ⚠️ ни одной копии"
  bot_backup_unreadable: "💾 База бота: ⚠️ бот не может прочитать папку копий — подробности в логе сервера"
  # RUN_MODE=dev: на Mac бэкап базы бота не запускается
  bot_backup_off: "💾 База бота: бэкап не запускается (режим dev)"
  panel_backup_ok: "💾 Панель: копия {at}, {size}, ошибок отправки в Telegram нет"
  panel_backup_not_sent: "💾 Панель: ⚠️ копия {at}, {size}, в Telegram не ушла"
  panel_backup_stale: "💾 Панель: ⚠️ нет копии моложе 26 часов (последняя — {at})"
  panel_backup_none: "💾 Панель: ⚠️ ни одной копии"
  panel_backup_unreadable: "💾 Панель: ⚠️ бот не может прочитать журнал или папку копий — подробности в логе сервера"
  # PANEL_BACKUP_LOG или PANEL_BACKUP_DIR пусты (на Mac)
  panel_backup_off: "💾 Панель: присмотр выключен (PANEL_BACKUP_DIR и PANEL_BACKUP_LOG не заданы)"
  jobs_ok: "⏱ Фоновые задачи: все работают"
  # {names} — имена задач через запятую
  jobs_stale: "⏱ Фоновые задачи: ⚠️ не отрабатывают — {names}"

# Задача 13: тема «💰 Оплаты» — сообщение о каждой оплате.
# {order_id} — номер заказа, {amount} — оплачено, ₽, {tariff_id} и {days} — тариф и его дни,
# {name}, {username}, {telegram_id} — клиент
payments:
  received: |-
    💰 <b>Оплата по заказу #{order_id}: {amount} ₽</b>
    Тариф {tariff_id} ({days} дн.)
    Клиент: {name}, @username: {username}, Telegram ID: <code>{telegram_id}</code>
  # оплачено не на сумму тарифа; {price} — цена тарифа, ₽
  received_prorated: |-
    💰 <b>Оплата по заказу #{order_id}: {amount} ₽ вместо {price} ₽</b>
    Тариф {tariff_id} ({days} дн.). ⚠️ Сумма не совпала с тарифом — срок пересчитан пропорционально оплате (+2 часа), клиенту отправлено извинение.
    Клиент: {name}, @username: {username}, Telegram ID: <code>{telegram_id}</code>
  # подставляется вместо @username, если его нет
  no_username: нет
  # задача 14: строки тревоги ежедневной сверки с платёжкой (обычный текст).
  # {order_id} — номер заказа, {payment_id} — номер платежа у платёжки
  reconcile:
    paid_without_order: "• Платёж {payment_id}: оплачен, а заказа у нас нет. Найдите клиента в кабинете платёжки и выдайте доступ вручную или верните деньги."
    credited_now: "• Заказ #{order_id}: оплачен, но не был засчитан — сверка засчитала его сейчас. Уведомление и проверки этот платёж пропустили."
    not_credited: "• Заказ #{order_id}: оплачен у платёжки ({payment_id}), но засчитать не вышло — проверьте и выдайте доступ вручную."
    credited_not_paid: "• Заказ #{order_id}: засчитан у нас, а у платёжки платёж {payment_id} не оплачен. Проверьте в кабинете платёжки."
    missing_at_provider: "• Заказ #{order_id}: засчитан у нас, а платёжка не знает платёж {payment_id} или он не оплачен. Проверьте в кабинете платёжки."
    refunded_outside_bot: "• Заказ #{order_id}: у платёжки есть возврат по платежу {payment_id}, а в боте его нет. Возвраты делаются только через бота — укоротите подписку вручную."
  # задача 14: другой заказ клиента засчитан уже после создания этого — две ссылки жили
  # одновременно. Строка добавляется к сообщению об оплате. {other_order_id} — первый заказ,
  # {refund_until} — до какого времени клиент может попросить вернуть вторую оплату полностью
  possible_double: "⚠️ Возможна случайная двойная оплата (первая — заказ #{other_order_id}). Дни сложены; клиенту предложен полный возврат этой оплаты до {refund_until}."

# Поддержка: тема на каждое обращение. Сообщение в теме уходит клиенту от «Поддержки»,
# сообщение, начинающееся с //, — внутренняя заметка (клиенту не уходит).
support:
  # название темы, обычный текст без разметки, до 128 символов
  topic_name: "#{ticket_id} {name}"
  # Карточка клиента — первое сообщение в теме (задача 17). Собирается из строк ниже;
  # даты — по Москве, например «10.12.2026, 18:00 МСК».
  card:
    title: "<b>Обращение #{ticket_id}</b>"
    # клиент написал снова в течение суток после закрытия — в теме новая карточка
    title_reopened: "<b>🔄 Обращение #{ticket_id} переоткрыто</b> — клиент написал снова в течение суток после закрытия."
    client: "Клиент: {name}, @username: {username}, Telegram ID: <code>{telegram_id}</code>"
    subscription_none: "Подписка: нет"
    subscription_trial: "Подписка: 🎁 пробный до {expire_at}"
    subscription_trial_traffic_used_up: "Подписка: 🎁 пробный, трафик кончился (срок до {expire_at})"
    subscription_active: "Подписка: ✅ активна до {expire_at}"
    subscription_grace: "Подписка: ⏳ льготный период, доступ до {expire_at}"
    subscription_expired: "Подписка: ❌ закончилась {expire_at}"
    subscription_suspended: "Подписка: ⛔️ доступ выключен (срок до {expire_at})"
    # панель Remnawave не ответила — подписку и устройства не узнать
    subscription_unknown: "Подписка: ⚠️ панель не ответила, срок и устройства неизвестны"
    devices: "Устройства: {used} из {limit}"
    devices_no_limit: "Устройства: {used}"
    # {total} — сумма в рублях, {last_paid_at} — когда последняя оплата
    payments: "Оплаты: {count} на {total} ₽, последняя {last_paid_at}"
    payments_none: "Оплаты: нет"
    trial: "Пробный: выдан {granted_at}"
    trial_none: "Пробный: не брал"
    hint: Ответ в этой теме уйдёт клиенту от «Поддержки». Начните сообщение с // — это заметка, клиент её не увидит.
  # подставляется в карточку, если у клиента нет @username
  no_username: нет
  # кнопки под карточкой
  buttons:
    extend: ➕ Продлить на N дней
    devices: 📱 Устройства
    take: 🙋 Беру
    close: ✅ Закрыть
    quick_replies: 💬 Быстрые ответы
    hide: ✖️ Скрыть
  # {admin} — имя администратора в Telegram
  taken: 🙋 Обращение ведёт {admin}.
  closed: ✅ {admin} закрыл(а) обращение. Клиент напишет в течение суток — переоткроется здесь же, позже — откроется новое.
  # всплывают над кнопкой; не длиннее 200 символов
  already_yours: Обращение уже у вас.
  already_closed: Обращение уже закрыто.
  take_closed: Обращение закрыто. Если клиент напишет в течение суток, оно переоткроется само.
  ticket_not_found: Обращение не найдено — кнопка устарела.
  quick_reply_not_found: Такой заготовки больше нет — откройте «💬 Быстрые ответы» заново.
  # Нет ответа клиенту дольше часа; {since} — с какого времени клиент ждёт
  reminder: ⏰ Клиент ждёт ответа больше часа — с {since}.
  # то же, если обращение кто-то взял; {admin_id} — Telegram ID, упоминание придёт ему уведомлением
  reminder_assignee: ⏰ Клиент ждёт ответа больше часа — с {since}. Ведёт <a href="tg://user?id={admin_id}">администратор</a>.
  # меню заготовок; под заголовком — список заготовок (группа quick_replies ниже)
  quick_replies_title: <b>💬 Быстрые ответы</b> — нажмите заготовку, и она сразу уйдёт клиенту от «Поддержки».
  # заготовка отправлена; ниже — её текст
  quick_reply_sent: "💬 {admin} отправил(а) клиенту быстрый ответ:"
  # администратор прислал в тему то, что клиенту не передаём (стикер, опрос, …)
  reply_unsupported: ⚠️ Такое сообщение клиенту не передаётся. Напишите текстом или пришлите фото, файл или голосовое.
  # Telegram отказался доставить ответ; {error} — ответ Telegram
  reply_failed: "⚠️ Не отправлено клиенту: {error}"
  client_blocked: ⚠️ Клиент заблокировал бота — ответ не доставлен (в переписке сохранён).

# Быстрые ответы (задача 17): кнопки с заготовками в теме обращения, уходят клиенту
# от «Поддержки». Добавлять и менять можно свободно: имя заготовки — латиница, цифры и _
# (до 32 символов); button — надпись на кнопке, text — что получит клиент (разметка <b>, <a>).
quick_replies:
  greeting:
    button: 👋 Смотрим
    text: Здравствуйте! Уже смотрим ваш вопрос, скоро ответим здесь.
  refresh:
    button: 🔄 Обновить подписку
    text: |-
      Попробуйте обновить подписку в приложении (кнопка обновления рядом с ней) и подключиться заново. Если не поможет — удалите подписку из приложения и добавьте снова: «🚀 Подключиться» → «Открыть страницу подключения».
  devices:
    button: 📱 Лимит устройств
    text: |-
      Похоже, подключено максимальное число устройств. Откройте «👤 Мой профиль» → «📱 Мои устройства», удалите то, которым больше не пользуетесь, и подключитесь снова.
  screenshot:
    button: 📸 Нужен скриншот
    text: Пришлите, пожалуйста, скриншот ошибки и напишите, какое у вас устройство и приложение.
  done:
    button: ✅ Готово
    text: Готово! Если что-то ещё понадобится — просто напишите сюда.

# Задача 18: админка — поиск клиента, карточка и действия. Команды работают только
# от администраторов и только в этой группе; каждое действие записывается в журнал.
admin:
  # /client без запроса или с непонятным запросом; {max_days} — предел ручной выдачи
  usage: |-
    <b>Админка</b>
    /client 123456789 или /client @username — карточка клиента: подписка, оплаты, пробный, устройства.
    /give 123456789 30 — выдать или продлить подписку на 30 дней (не больше {max_days} за раз).
    /trials — пробные: включены или выключены, кнопка переключения.
    /stats — статистика: оплаты, подписки, пробный → оплата, обращения, заблокировавшие бота.
    /broadcast текст — рассылка всем клиентам бота: сначала предпросмотр, потом «✅ Отправить».
    /proof 123 — доказательство оказания услуги по заказу 123 (файл для спора с платёжкой).
    Остальное — кнопками под карточкой. Действия всегда по Telegram ID: @username мог смениться.
  # /give без нужных чисел
  give_usage: "Формат: /give 123456789 30 — Telegram ID клиента и число дней (от 1 до {max_days})."
  days_out_of_range: "Дней должно быть от 1 до {max_days} за раз."
  # {query} — что искали
  not_found: "Среди клиентов бота нет: {query}"
  client_not_found: "Клиента с Telegram ID <code>{telegram_id}</code> нет среди клиентов бота."
  # несколько клиентов с одним @username (старый @username сменил владельца)
  many_found: "С таким @username несколько клиентов — выберите по Telegram ID:"
  many_found_item: "• {name} — /client {telegram_id}"
  panel_unavailable: "⚠️ Панель Remnawave не ответила. Попробуйте ещё раз через минуту."
  cancelled: "Отменено."
  # всплывающий ответ на кнопку админки не от администратора или не в группе (до 200 символов)
  not_admin: "Это могут только администраторы в группе администраторов."
  # подставляется, если у клиента нет имени или @username
  no_value: нет
  card:
    title: |-
      <b>Клиент {name}</b>
      Telegram ID: <code>{telegram_id}</code>, @username: {username}
      В боте с {first_seen_at}
    blocked: "⛔ Заблокировал бота {at}"
    status_trial: "Подписка: пробный до {expire_at}"
    status_trial_traffic_used_up: "Подписка: пробный до {expire_at}, трафик исчерпан"
    status_active: "Подписка: активна до {expire_at}"
    status_grace: "Подписка: льготный период до {expire_at}"
    status_expired: "Подписка: закончилась {expire_at}"
    status_suspended: "Подписка: доступ выключен, срок до {expire_at}"
    no_account: "Подписка: прокси-аккаунта нет"
    panel_unavailable: "Подписка: панель Remnawave не ответила — срок и устройства сейчас неизвестны"
    traffic: "Трафик пробного: {used} из {limit} ГБ"
    devices: "Устройства: {used} из {limit}"
    devices_no_limit: "Устройства: {used}"
    grace: "Льготный период начался {at}"
    trial_none: "Пробный: не брал"
    trial_delivered: "Пробный: выдан {at}, продлений: {extensions}"
    trial_pending: "Пробный: отмечен {at}, ещё не доставлен (панель не ответила)"
    payments_none: "Оплат нет"
    payments: "Оплат: {count} на {total} ₽. Последние:"
    payment_item: "• {paid_at} — {tariff}, {days} дн., {amount} ₽ ({status})"
  # состояние заказа в строке оплаты
  order_status:
    created: создан
    paid: оплачен, доступ выдаётся
    access_granted: доступ выдан
    access_failed: доступ не выдан
    manual_review: ручная проверка
    canceled: отменён
    refunded: возвращён
  buttons:
    extend: "➕ {days} дн."
    devices: "📱 Устройства"
    reset_trial: "🎁 Сбросить пробный"
    revoke: "🔄 Перевыпустить ссылку"
    confirm_extend: "✅ Да, выдать {days} дн."
    confirm_reset: "✅ Да, сбросить"
    confirm_revoke: "✅ Да, перевыпустить"
    cancel: "✖️ Отмена"
    delete_device: "🗑 {number}"
    erase: "🗑 Удалить данные клиента"  # задача 24
    confirm_erase: "✅ Да, удалить данные"
  extend:
    # {current} — нынешний срок или extend.no_account, {new} — новый срок
    preview: |-
      Выдать клиенту {name} (Telegram ID <code>{telegram_id}</code>) {days} дн.?
      Сейчас: {current}
      Станет: до {new}
    no_account: "прокси-аккаунта нет — будет создан"
    done: "✅ Клиенту <code>{telegram_id}</code> выдано {days} дн. Подписка до {expire_at}."
    changed: |-
      ⚠️ Срок клиента <code>{telegram_id}</code> уже изменился (сейчас: {current}) — ничего не сделано. Откройте карточку заново: /client {telegram_id}
  reset:
    ask: |-
      Сбросить пробный клиенту <code>{telegram_id}</code>? Он снова увидит «🎁 Попробовать бесплатно», и нажатие даст 7 дней с нуля на прежнем аккаунте.
    done: "✅ Пробный клиента <code>{telegram_id}</code> сброшен."
    not_used: "Клиент <code>{telegram_id}</code> пробный не брал — сбрасывать нечего."
    has_paid: "Клиент <code>{telegram_id}</code> уже платил — пробный ему не положен, сброс не нужен."
  revoke:
    ask: |-
      Перевыпустить ссылку подписки клиенту <code>{telegram_id}</code>? Старая перестанет работать: на всех устройствах подписку нужно будет добавить заново.
    done: "✅ Ссылка клиента <code>{telegram_id}</code> перевыпущена. Новая — у клиента в «🚀 Подключиться»."
    no_account: "У клиента <code>{telegram_id}</code> нет прокси-аккаунта — перевыпускать нечего."
  devices:
    title: "Устройства клиента <code>{telegram_id}</code>: {used} из {limit}"
    title_no_limit: "Устройства клиента <code>{telegram_id}</code>: {used}"
    item: "{number}. {name} — {system}, подключено {connected_at}"
    unknown: "?"
    empty: "У клиента <code>{telegram_id}</code> нет подключённых устройств."
    no_account: "У клиента <code>{telegram_id}</code> нет прокси-аккаунта."
    deleted: "✅ Устройство удалено."
    not_found: "Этого устройства у клиента уже нет."
  # Задача 24: удаление данных клиента по запросу. {name} и {username} — что сейчас в базе
  # (или no_value), {tickets}, {messages}, {topics} — сколько удалится, {orders} — сколько останется
  erase:
    ask: |-
      <b>Удалить данные клиента <code>{telegram_id}</code>?</b>
      Удалится: имя ({name}), @username ({username}), обращений — {tickets}, сообщений переписки — {messages}, тем в группе — {topics}.
      Останутся обезличенными: Telegram ID и отметка пробного (второго пробного не будет), заказы ({orders}) и журнал событий. Прокси-аккаунт не меняется: оплаченный доступ продолжает работать.
      Ответьте клиенту до удаления — темы обращений исчезнут вместе с перепиской. В резервных копиях данные останутся до их ротации (месячные копии хранятся бессрочно); сообщения о его оплатах в «💰 Оплаты» при необходимости удалите вручную.
    done: "✅ Данные клиента <code>{telegram_id}</code> удалены: обращений — {tickets}, сообщений — {messages}, тем — {topics}. Имя и @username стёрты."
    nothing: "У клиента <code>{telegram_id}</code> уже нечего удалять: имени, @username и переписки нет."
    # Telegram не дал удалить тему; {error} — его ответ
    topic_failed: "⚠️ Не получилось удалить тему обращения: {error}. Данные в базе не тронуты. Проверьте у бота право «Управление темами» и нажмите «✅ Да, удалить данные» ещё раз."
  # Задача 28: /trials — выключатель пробных. {limit} и {minutes} — порог автовыключения
  trials:
    enabled: |-
      <b>🎁 Пробные включены.</b>
      Новые клиенты видят «🎁 Попробовать бесплатно». Больше {limit} новых пробных за {minutes} мин — бот выключит их сам и пришлёт тревогу.
    disabled: |-
      <b>⏸ Пробные выключены.</b>
      Новые клиенты не видят «🎁 Попробовать бесплатно», старая кнопка отвечает «временно недоступен». Уже выданные пробные работают, зависшие выдачи бот доделывает. Сами пробные не включатся — только кнопкой ниже.
    # итог нажатия над состоянием: переключено или уже было так (второй администратор успел раньше)
    switched: "✅ Готово."
    unchanged: "Ничего не изменилось: пробные уже были в этом состоянии."
    disable_button: "⏸ Выключить пробные"
    enable_button: "▶️ Включить пробные"
  # Задача 20: компенсация при сбое ноды — в «🚨 Тревоги» после восстановления ноды.
  # {since}, {until} — простой целиком (соседние падения с перерывом до часа склеены),
  # {minutes} — его длительность, {amount} — сколько начислить, например «1 день 3 часа»
  compensation:
    offer: |-
      🎁 <b>Компенсация за сбой</b>
      Простой: с {since} по {until} — {minutes} мин (соседние падения нод склеены в один сбой).
      Начислить {amount} всем клиентам бота с оплаченной подпиской? Тем, кто в льготном периоде, — добавится к сроку при следующей оплате. Пробные и клиенты, заведённые в панели вручную, не затрагиваются.
    button: "🎁 Компенсировать {amount}"
    confirm: "Точно начислить {amount} всем клиентам бота с оплаченной подпиской? Клиенты получат извинение. Отменить начисление нельзя."
    confirm_button: "✅ Да, компенсировать"
    resume_button: "🔁 Продолжить"
    # предложение после нажатия: {run_id} — номер начисления, {amount} — сколько начисляется
    in_progress: |-
      🎁 <b>Компенсация за сбой</b>
      Простой: с {since} по {until} — {minutes} мин.
      Начисление #{run_id}: {amount}. Ход и итог — сообщениями ниже. Если итог не пришёл (например, бот перезапускался), нажмите «🔁 Продолжить» — бот доделает и никому не начислит дважды.
    started: "🎁 Компенсация #{run_id}: начисляю {amount}, клиентов к проверке — {total}."
    progress: "🎁 Компенсация #{run_id}: проверено {done} из {total}…"
    finished: |-
      ✅ <b>Компенсация #{run_id} закончена</b> ({amount})
      Продлено: {extended}
      В льготном периоде, добавится к оплате: {carried}
      Уже было начислено раньше: {already}
      Без оплаченной подписки: {not_eligible}
      Пропущено (аккаунт без клиента в базе): {skipped}
    # что следующее нажатие доделает
    unfinished: "⚠️ Не доделано: {deferred} — идёт выдача доступа по оплате, {failed} — панель не ответила. Нажмите «🔁 Продолжить» позже: бот доделает и никому не начислит дважды."
    # начисление записано, но срок в панели изменился посреди — бот не знает, поставлен ли он
    manual: "⚠️ Проверьте вручную (срок изменился посреди начисления): {telegram_ids}"
    nothing: "Компенсация #{run_id}: этот простой уже покрыт прошлой компенсацией — начислять нечего."
    # всплывающие ответы на кнопку (до 200 символов)
    launched: "Начинаю. Ход — сообщениями в этой теме."
    resumed: "Продолжаю ту же компенсацию — дважды никому не начислю."
    running: "Эта компенсация уже идёт — дождитесь итога."
    not_found: "Сбой не найден."
    still_open: "Нода ещё не восстановилась — компенсировать можно после восстановления."
  # Задача 22: /proof 123 — доказательство оказания услуги по заказу (файл .txt для спора
  # с платёжкой). Строки файла — обычный текст, без разметки.
  proof:
    usage: "Формат: /proof 123 — номер заказа. Бот пришлёт файл с историей заказа: оплата, выдача доступа, подключения, журнал событий."
    not_found: "Заказа #{order_id} нет."
    caption: "📄 Доказательство оказания услуги по заказу #{order_id}"
    header: |-
      Доказательство оказания услуги — заказ #{order_id}
      Сформировано: {at}
    service: "Услуга: доступ к прокси-сервису TS Proxy, тариф {tariff_id} ({days} дн.)"
    client: "Клиент: Telegram ID {telegram_id}, имя: {name}, @username: {username}, в боте с {first_seen_at}"
    order: "Заказ создан: {created_at}, цена {price} ₽, состояние: {status}"
    payment: "Оплата: {paid_at}, {amount} ₽, платёжка: {provider}, номер платежа: {payment_id}"
    payment_none: "Оплата: не поступала"
    grant_target: "Срок подписки по заказу: до {expire_at}"
    # {status} — статус аккаунта в панели, {traffic} — израсходовано, ГБ
    account: "Прокси-аккаунт сейчас: {status}, подписка до {expire_at}, первое подключение: {first_connected}, израсходовано трафика: {traffic} ГБ"
    never_connected: "ни разу не подключался"
    account_none: "Прокси-аккаунта в панели нет"
    panel_unavailable: "Панель Remnawave не ответила — данные о подключениях сейчас недоступны"
    devices_title: "Подключённые устройства: {count}"
    device: "  • {model}, {platform}, подключено {connected_at}"
    events_title: "Журнал событий (события заказа и клиента с момента создания заказа):"
    event: "  • {at} — {kind}: {details}"
    event_admin: "  • {at} — {kind} (администратор {admin_id}): {details}"
    repeated: "    повторялось {count} раз"
    truncated: "  … показаны первые {limit} событий"
    kinds:
      order_created: заказ создан
      payment_created: платёж создан, клиенту выдана ссылка на оплату
      payment_received: оплата получена и засчитана
      access_granted: доступ выдан (подписка продлена)
      access_failed: доступ не выдан
      trial_granted: выдан пробный период
      trial_extended: пробный период продлён
      grace_started: начался льготный период
      grace_ended: льготный период закончился
      refund_requested: запрошен возврат
      refund_approved: возврат одобрен
      refund_rejected: возврат отклонён
      refund_completed: деньги возвращены
      compensation_granted: начислена компенсация за сбой
      admin_action: действие администратора
      fake_payment_notification: отклонено поддельное уведомление об оплате
      subscription_revoked: клиент перевыпустил ссылку подписки
      trials_disabled: пробные выключены
      trials_enabled: пробные включены
  # Задача 19: /stats — статистика. Все даты и «сегодня» / «с 1-го числа» — по Москве
  stats:
    title: "<b>📊 Статистика</b> на {at}"
    # продажи — поступившие оплаты по времени зачёта, возвраты не вычитаются
    sales_today: "💰 Оплаты сегодня: {count} на {amount} ₽"
    sales_month: "💰 Оплаты с 1-го числа: {count} на {amount} ₽"
    subscriptions: "🔑 Подписки сейчас: оплаченных — {paid}, в льготном периоде — {grace}, пробных — {trial}"
    subscriptions_unknown: "🔑 Подписки сейчас: панель Remnawave не ответила — неизвестно"
    trials: "🎁 Пробный → оплата: {converted} из {trials} ({percent}%) за всё время"
    trials_none: "🎁 Пробный → оплата: пробных ещё не было"
    support: "💬 Обращения: открыто — {open_now}, ждут первого ответа — {waiting}; с 1-го числа — {opened}"
    response: "⏱ Первый ответ (обращения с 1-го числа): в среднем {average}, дольше всего {longest}"
    response_none: "⏱ Первый ответ (обращения с 1-го числа): ответов ещё не было"
    clients: "👥 Клиентов бота: {total}, заблокировали бота: {blocked}"
    duration_minutes: "{minutes} мин"
    duration_hours: "{hours} ч {minutes} мин"
    duration_under_minute: "меньше минуты"
  # Задача 19: /broadcast — рассылка всем клиентам бота (кроме заблокировавших бота).
  # Нынешним клиентам панели, заведённым вручную, рассылка не уходит: в базе бота их нет.
  broadcast:
    usage: |-
      Два способа:
      • /broadcast и текст рассылки в том же сообщении. Жирный, курсив и ссылки сохранятся.
      • Пришлите сюда сообщение как есть — фото, видео, файл, голосовое, текст с подписью и разметкой — и ответьте на него командой /broadcast (без текста).
      Бот покажет предпросмотр — отправка только после «✅ Отправить».
    # над предпросмотром; сам предпросмотр — следующим сообщением, ровно как увидят клиенты
    preview_header: |-
      <b>📣 Предпросмотр рассылки</b>
      Получат: {recipients} клиентов бота. Заблокировали бота — {blocked}, им не уйдёт.
      Ниже — сообщение ровно так, как его увидят клиенты (кнопок под ним у клиентов не будет).
    preview_failed: "⚠️ Telegram не принял сообщение для рассылки: {error}"
    # Задача 32: рассылка копией сообщения (ответ /broadcast на сообщение).
    # Под копией-предпросмотром, ответом на неё; клиентам уйдёт копия этой копии
    copy_header: |-
      <b>📣 Предпросмотр рассылки</b>
      Получат: {recipients} клиентов бота. Заблокировали бота — {blocked}, им не уйдёт.
      Выше — сообщение ровно так, как его увидят клиенты: без «переслано от» и без этих кнопок.
    reply_or_text: |-
      ⚠️ Либо текст после /broadcast, либо ответ командой на готовое сообщение — не всё сразу.
      Чтобы разослать сообщение, на которое вы ответили, отправьте /broadcast без текста.
    album: |-
      ⚠️ Альбом (несколько фото или видео одним сообщением) разослать нельзя: Telegram копирует его только по одному файлу, и клиенты получили бы часть альбома.
      Пришлите одно фото или видео с подписью либо файлы по одному — каждый отдельной рассылкой.
    unsupported: |-
      ⚠️ Такое сообщение разослать нельзя. Можно: текст, фото, видео, GIF, файл, аудио, голосовое и видеосообщение — с подписью и разметкой.
      Опросы, стикеры, геопозиции, контакты и прочее не рассылаем.
    has_buttons: |-
      ⚠️ У этого сообщения есть кнопки — такое не рассылаем, чтобы клиенты не получили чужие кнопки.
      Пришлите сообщение заново, без кнопок, и ответьте на него /broadcast.
    # всплывающий ответ на «✅ Отправить» (до 200 символов)
    preview_missing: "Не нашёл предпросмотр — возможно, его удалили. Отправьте /broadcast заново."
    send_button: "✅ Отправить"
    cancel_button: "✖️ Отмена"
    stop_button: "⏹ Остановить"
    # всплывающие ответы на кнопки (до 200 символов)
    already_handled: "Эта рассылка уже отправлена или отменена."
    busy: "Сейчас идёт другая рассылка. Дождитесь её конца или остановите её."
    no_recipients: "Отправлять некому: нет клиентов, которые не заблокировали бота."
    preview_expired: "Предпросмотр устарел. Отправьте /broadcast заново."
    cancelled: "Рассылка отменена."
    stopping: "Останавливаю рассылку."
    not_running: "Рассылка уже не идёт."
    # в тему, где нажали «✅ Отправить»
    started: "📣 Рассылка началась: {total} клиентов. Около {minutes} мин."
    progress: "📣 Рассылка идёт: обработано {processed} из {total}."
    counts: "Доставлено: {delivered} из {total}. Заблокировали бота: {blocked}. Не доставлено: {failed}."
    completed: "✅ Рассылка закончена за {duration}."
    stopped: "⏹ Рассылка остановлена (администратором или перезапуском бота). Остальным клиентам не отправлено."
    aborted: "⚠️ Рассылка прервана: много неудач подряд — Telegram или сеть не отвечают. Остальным клиентам не отправлено, подробности — в логе сервера."
    crashed: "⚠️ Рассылка прервана ошибкой в боте. Остальным клиентам не отправлено, подробности — в логе сервера."
