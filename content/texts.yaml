# Тексты для клиентов. Группы — по экранам. Подстановки — {name}, разметка — <b>, <i>, <a>.
# Править можно руками; после правки бот при запуске проверит, что все тексты на месте.
# Сервис называем «прокси». Не обещаем доступ к заблокированным ресурсам
# (решение владельца, черновик позиционирования — drafts/pozitsionirovanie.md).

# Команды в меню Telegram (кнопка «/» рядом с полем ввода)
commands:
  start: Главное меню
  profile: Мой профиль
  buy: Тарифы и оплата
  support: Написать в поддержку

# Надписи на кнопках
buttons:
  connect: 🚀 Подключиться
  trial: 🎁 Попробовать бесплатно
  tariffs: 💳 Тарифы
  profile: 👤 Мой профиль
  instructions: 📖 Инструкции
  support: 💬 Поддержка
  about: ℹ️ О сервисе
  back: ⬅️ В меню
  instructions_back: ⬅️ Другое устройство
  open_subscription: 🚀 Открыть страницу подключения
  copy_link: 📋 Скопировать ссылку
  platform_ios: 📱 iPhone и iPad
  platform_android: 🤖 Android
  platform_windows: 🖥 Windows
  platform_macos: 💻 macOS
  devices: 📱 Мои устройства
  renew: 💳 Продлить подписку
  profile_back: ⬅️ В профиль
  # {number} — номер устройства в списке «📱 Мои устройства»
  delete_device: 🗑 Удалить {number}

# Главное меню — одно сообщение, экраны меняются в нём же
menu:
  title: |-
    <b>TS Proxy</b> — прокси-сервис с шифрованием трафика.
    Выберите, что нужно:

# «🚀 Подключиться»
connect:
  # {expire_at} — дата окончания подписки по Москве, например «10.12.2026, 18:00 МСК»
  active: |-
    <b>🚀 Подключение</b>

    Подписка активна до <b>{expire_at}</b>.

    Нажмите «Открыть страницу подключения» — там кнопка, которая сама добавит подписку в приложение.
    Если приложения ещё нет, загляните в «📖 Инструкции».

    Ссылка подписки — ваш личный доступ. Не пересылайте её другим.
  inactive: |-
    <b>🚀 Подключение</b>

    Подписка закончилась {expire_at}. Чтобы снова подключиться, продлите её в «💳 Тарифах».

    Ссылка подписки та же — после продления ничего настраивать заново не нужно.
  no_account: |-
    <b>🚀 Подключение</b>

    У вас пока нет подписки. Попробуйте бесплатно — 7 дней, без оплаты и без карты.
    Или сразу выберите тариф.
  unavailable: |-
    Не получилось загрузить вашу подписку — сервис подключения сейчас не отвечает.
    Мы уже знаем и разбираемся. Попробуйте ещё раз через несколько минут.

# «🎁 Попробовать бесплатно»
trial:
  # {expire_at} — дата окончания по Москве, {traffic_gb} — гигабайты, {device_limit} — устройства
  granted: |-
    <b>🎁 Пробный период включён</b>

    Пользуйтесь бесплатно до <b>{expire_at}</b>: {traffic_gb} ГБ трафика, до {device_limit} устройств.

    Нажмите «Открыть страницу подключения» — там кнопка, которая сама добавит подписку в приложение.
    Если приложения ещё нет, загляните в «📖 Инструкции».

    Ссылка подписки — ваш личный доступ. Не пересылайте её другим.
  already_used: |-
    <b>🎁 Пробный период</b>

    Бесплатный пробный период вы уже использовали. Чтобы продолжить, выберите тариф.
  in_progress: |-
    <b>🎁 Пробный период</b>

    Включаем пробный период — это займёт пару минут.
    Потом нажмите «🚀 Подключиться».
  has_subscription: |-
    <b>🎁 Пробный период</b>

    У вас уже есть подписка — пробный период не нужен.
    Подключиться можно кнопкой ниже.

# Заглушки экранов, которые появятся в следующих версиях бота
tariffs:
  soon: |-
    <b>💳 Тарифы</b>

    Скоро здесь можно будет выбрать тариф и оплатить подписку.
support:
  soon: |-
    <b>💬 Поддержка</b>

    Скоро здесь можно будет написать нам прямо в боте.

# «👤 Мой профиль». Подстановки:
# {expire_at} — дата по Москве, например «10.12.2026, 18:00 МСК»;
# {left} — сколько осталось, например «5 дней 3 часа» (слова — в группе units).
# Экран собирается из частей: заголовок, статус, устройства, трафик (только в пробном).
profile:
  title: <b>👤 Мой профиль</b>
  status_trial: |-
    Статус: 🎁 <b>пробный период</b>
    Действует до <b>{expire_at}</b>, осталось {left}.
  status_trial_traffic_used_up: |-
    Статус: ⛔️ <b>пробный трафик закончился</b>
    Чтобы пользоваться прокси дальше, выберите тариф — трафик в подписке без ограничений.
  status_active: |-
    Статус: ✅ <b>подписка активна</b>
    Действует до <b>{expire_at}</b>, осталось {left}.
  status_grace: |-
    Статус: ⏳ <b>подписка закончилась</b>
    Мы сохранили вам доступ до <b>{expire_at}</b> (осталось {left}). Продлите подписку, чтобы не остаться без прокси.
  status_expired: |-
    Статус: ❌ <b>подписка закончилась</b> {expire_at}
    Продлите её — ссылка подписки останется прежней, настраивать ничего не нужно.
  status_suspended: |-
    Статус: ⛔️ <b>доступ приостановлен</b>
    Напишите нам в «💬 Поддержку» — разберёмся.
  # {used} — сколько устройств подключено, {limit} — сколько можно
  devices: "📱 Устройства: {used} из {limit}"
  devices_no_limit: "📱 Устройства: {used}"
  # {used} и {limit} — гигабайты, например «2,3» и «7»
  traffic: "📶 Трафик: {used} из {limit} ГБ"
  no_account: |-
    <b>👤 Мой профиль</b>

    У вас пока нет подписки. Попробуйте бесплатно — 7 дней, без оплаты и без карты.
    Или сразу выберите тариф.

# «📱 Мои устройства». Экран собирается из частей: заголовок, итог удаления, список, подсказка.
devices:
  # {used} — сколько устройств подключено, {limit} — сколько можно
  title: |-
    <b>📱 Мои устройства</b>

    Подключено {used} из {limit}.
  title_no_limit: |-
    <b>📱 Мои устройства</b>

    Подключено: {used}.
  # {number} — номер в списке; {name} — модель; {system} — система и версия;
  # {connected_at} — когда подключено, по Москве
  item: |-
    {number}. <b>{name}</b> — {system}
    подключено {connected_at}
  item_no_system: |-
    {number}. <b>{name}</b>
    подключено {connected_at}
  unknown_model: Устройство без названия
  hint: |-
    Новое устройство не подключается? Удалите то, которым больше не пользуетесь, — место освободится.
  empty: |-
    <b>📱 Мои устройства</b>

    Подключённых устройств пока нет. Нажмите «🚀 Подключиться», чтобы добавить первое.
  deleted: ✅ Устройство удалено.
  not_found: Этого устройства уже нет в списке.

# Слова после чисел: «1 день», «2 дня», «5 дней». {n} — число
units:
  days_one: "{n} день"
  days_few: "{n} дня"
  days_many: "{n} дней"
  hours_one: "{n} час"
  hours_few: "{n} часа"
  hours_many: "{n} часов"
  less_than_hour: меньше часа

# «ℹ️ О сервисе»
about:
  text: |-
    <b>TS Proxy — прокси-сервис с шифрованием трафика.</b>

    Шифруем ваш трафик, скрываем IP-адрес и защищаем данные в публичных Wi-Fi сетях — в кафе, аэропортах, отелях.

    • Скорость до 1 Гбит/с
    • До 3 устройств по одной подписке
    • Приложения для iPhone, Android, Windows и macOS
    • Поддержка прямо в боте

    Используя сервис, вы соглашаетесь с <a href="https://ts-proxy.com/terms">условиями использования</a> и самостоятельно отвечаете за соблюдение законодательства при его использовании.

# «📖 Инструкции»: основное приложение — Happ, запасное — v2RayTun
instructions:
  choose: |-
    <b>📖 Инструкции</b>

    Подключение занимает пару минут. Выберите своё устройство:
  ios: |-
    <b>📱 iPhone и iPad</b>

    1. Установите приложение <b>Happ</b> из App Store.
    2. Вернитесь в бота, нажмите «🚀 Подключиться», затем «Открыть страницу подключения» и на ней — кнопку добавления в Happ.
    3. В Happ нажмите большую кнопку подключения и разрешите добавить конфигурацию.

    Не получилось? Запасной вариант — приложение <b>v2RayTun</b>: те же шаги, на странице подключения выберите v2RayTun.
  android: |-
    <b>🤖 Android</b>

    1. Установите приложение <b>Happ</b> из Google Play.
    2. Вернитесь в бота, нажмите «🚀 Подключиться», затем «Открыть страницу подключения» и на ней — кнопку добавления в Happ.
    3. В Happ нажмите большую кнопку подключения и разрешите приложению работать.

    Не получилось? Запасной вариант — приложение <b>v2RayTun</b>: те же шаги, на странице подключения выберите v2RayTun.
  windows: |-
    <b>🖥 Windows</b>

    1. Скачайте и установите <b>Happ</b> для Windows — ссылка есть на странице подключения.
    2. В боте нажмите «📋 Скопировать ссылку» (раздел «🚀 Подключиться»), в Happ нажмите «+» и вставьте ссылку из буфера.
    3. Нажмите кнопку подключения в Happ.

    Не получилось? Запасной вариант — <b>v2RayTun</b>: те же шаги.
  macos: |-
    <b>💻 macOS</b>

    1. Установите приложение <b>Happ</b> из App Store.
    2. В боте нажмите «📋 Скопировать ссылку» (раздел «🚀 Подключиться»), в Happ нажмите «+» и вставьте ссылку из буфера.
    3. Нажмите кнопку подключения и разрешите добавить конфигурацию.

    Не получилось? Запасной вариант — приложение <b>v2RayTun</b>: те же шаги.

# Ограничение частоты нажатий
throttle:
  # всплывает над кнопкой; не длиннее 200 символов
  callback: Не так быстро 🙂 Подождите пару секунд.
  message: Вы пишете слишком часто. Подождите немного, пожалуйста.

# Ошибки и всё непонятное
errors:
  generic: |-
    Что-то пошло не так. Попробуйте ещё раз через минуту — мы уже получили сигнал об ошибке.
  # всплывает над кнопкой; не длиннее 200 символов
  stale_button: Эта кнопка устарела. Откройте меню командой /start.
fallback:
  unknown_message: |-
    Пока я понимаю только кнопки меню. Скоро здесь можно будет написать вопрос в поддержку.
