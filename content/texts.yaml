# Тексты для клиентов. Группы — по экранам. Подстановки — {name}, разметка — <b>, <i>, <a>.
# Править можно руками; после правки бот при запуске проверит, что все тексты на месте.
# Сервис называем «прокси». Не обещаем доступ к заблокированным ресурсам
# (решение владельца, черновик позиционирования — drafts/pozitsionirovanie.md).

# Команды в меню Telegram (кнопка «/» рядом с полем ввода)
commands:
  start: Главное меню
  profile: Мой профиль
  buy: Тарифы и оплата
  support: Написать в поддержку

# Надписи на кнопках
buttons:
  connect: 🚀 Подключиться
  trial: 🎁 Попробовать бесплатно
  tariffs: 💳 Тарифы
  profile: 👤 Мой профиль
  instructions: 📖 Инструкции
  support: 💬 Поддержка
  about: ℹ️ О сервисе
  back: ⬅️ В меню
  instructions_back: ⬅️ Другое устройство
  open_subscription: 🚀 Открыть страницу подключения
  copy_link: 📋 Скопировать ссылку
  platform_ios: 📱 iPhone и iPad
  platform_android: 🤖 Android
  platform_windows: 🖥 Windows
  platform_macos: 💻 macOS
  devices: 📱 Мои устройства
  renew: 💳 Продлить подписку
  profile_back: ⬅️ В профиль
  # {number} — номер устройства в списке «📱 Мои устройства»
  delete_device: 🗑 Удалить {number}
  # {price} — цена тарифа в рублях
  pay: "💳 Оплатить {price} ₽"
  tariffs_back: ⬅️ К тарифам
  faq_back: ⬅️ К вопросам

# Главное меню — одно сообщение, экраны меняются в нём же
menu:
  title: |-
    <b>TS Proxy</b> — прокси-сервис с шифрованием трафика.
    Выберите, что нужно:

# «🚀 Подключиться»
connect:
  # {expire_at} — дата окончания подписки по Москве, например «10.12.2026, 18:00 МСК»
  active: |-
    <b>🚀 Подключение</b>

    Подписка активна до <b>{expire_at}</b>.

    Нажмите «Открыть страницу подключения» — там кнопка, которая сама добавит подписку в приложение.
    Если приложения ещё нет, загляните в «📖 Инструкции».

    Ссылка подписки — ваш личный доступ. Не пересылайте её другим.
  inactive: |-
    <b>🚀 Подключение</b>

    Подписка закончилась {expire_at}. Чтобы снова подключиться, продлите её в «💳 Тарифах».

    Ссылка подписки та же — после продления ничего настраивать заново не нужно.
  no_account: |-
    <b>🚀 Подключение</b>

    У вас пока нет подписки. Попробуйте бесплатно — 7 дней, без оплаты и без карты.
    Или сразу выберите тариф.
  unavailable: |-
    Не получилось загрузить вашу подписку — сервис подключения сейчас не отвечает.
    Мы уже знаем и разбираемся. Попробуйте ещё раз через несколько минут.

# «🎁 Попробовать бесплатно»
trial:
  # {expire_at} — дата окончания по Москве, {traffic_gb} — гигабайты, {device_limit} — устройства
  granted: |-
    <b>🎁 Пробный период включён</b>

    Пользуйтесь бесплатно до <b>{expire_at}</b>: {traffic_gb} ГБ трафика, до {device_limit} устройств.

    Нажмите «Открыть страницу подключения» — там кнопка, которая сама добавит подписку в приложение.
    Если приложения ещё нет, загляните в «📖 Инструкции».

    Ссылка подписки — ваш личный доступ. Не пересылайте её другим.
  already_used: |-
    <b>🎁 Пробный период</b>

    Бесплатный пробный период вы уже использовали. Чтобы продолжить, выберите тариф.
  # панель подключения не ответила; бот сам пришлёт ссылку, когда она заработает
  pending: |-
    <b>🎁 Пробный период</b>

    Пробный период за вами — сервис подключения сейчас отвечает с задержкой.
    Как только всё заработает, пришлём ссылку сюда. Нажимать ничего не нужно.
  has_subscription: |-
    <b>🎁 Пробный период</b>

    У вас уже есть подписка — пробный период не нужен.
    Подключиться можно кнопкой ниже.

# «💬 Поддержка»: любое обычное сообщение клиента — обращение в поддержку
support:
  # под текстом — кнопки частых вопросов (группа faq ниже)
  intro: |-
    <b>💬 Поддержка</b>

    Ответы на частые вопросы — на кнопках ниже.

    Не нашли ответ — просто напишите вопрос сюда, в этот чат, одним или несколькими сообщениями. Можно приложить скриншоты, файлы и голосовые. Ответим здесь же.
  # первое сообщение открыло обращение; {ticket_id} — номер обращения
  ticket_created: "Обращение #{ticket_id} создано. Ответим здесь, в этом чате, в ближайшее время."
  # больше 10 сообщений в минуту
  flood: |-
    Вы пишете слишком часто — подождите минуту, пожалуйста. Сообщения, отправленные сейчас, до поддержки не дойдут.
  # стикеры, контакты, геолокация, опросы и т. п.
  unsupported: |-
    Такое сообщение не получится передать в поддержку. Напишите текстом или пришлите фото, файл или голосовое.
  # не получилось передать сообщение администраторам (например, не создалась тема)
  not_delivered: |-
    Не получилось передать сообщение в поддержку. Мы уже знаем и разбираемся — попробуйте ещё раз через несколько минут.
  # начало каждого ответа поддержки клиенту (дальше — текст администратора)
  reply_prefix: "<b>💬 Поддержка:</b>\n"

# Частые вопросы на экране «💬 Поддержка» (задача 17): button — надпись на кнопке,
# answer — ответ. Набор вопросов задан в коде (bot/callbacks.py, FaqQuestion).
faq:
  connect:
    button: 🚀 Как подключиться?
    answer: |-
      <b>🚀 Как подключиться?</b>

      1. Установите приложение <b>Happ</b> — ссылки и шаги для вашего устройства в «📖 Инструкциях».
      2. В боте нажмите «🚀 Подключиться», затем «Открыть страницу подключения» — там кнопка, которая сама добавит подписку в приложение.
      3. В Happ нажмите большую кнопку подключения.

      Не получилось — напишите сюда, в этот чат, на каком устройстве подключаетесь.
  not_working:
    button: 🛠 Не работает — что делать?
    answer: |-
      <b>🛠 Не работает — что делать?</b>

      1. Проверьте в «👤 Моём профиле», что подписка активна.
      2. В приложении обновите подписку (кнопка обновления рядом с ней) и подключитесь заново.
      3. Переключите Wi-Fi на мобильный интернет или наоборот.
      4. Перезапустите приложение.

      Не помогло — напишите сюда, в этот чат: какое устройство и приложение, что именно не работает. Скриншот ошибки очень поможет.
  devices:
    button: 📱 Сколько устройств можно подключить?
    answer: |-
      <b>📱 Сколько устройств можно подключить?</b>

      В любом тарифе — до 3 устройств по одной подписке. Сколько подключено сейчас, видно в «👤 Моём профиле».

      Новое устройство не подключается? Откройте «👤 Мой профиль» → «📱 Мои устройства» и удалите то, которым больше не пользуетесь, — место освободится.
  renew:
    button: 💳 Как продлить подписку?
    answer: |-
      <b>💳 Как продлить подписку?</b>

      Выберите срок в «💳 Тарифах» и оплатите. Если подписка ещё идёт, новые дни добавятся к её окончанию.

      Ссылка подписки остаётся прежней — в приложении ничего настраивать заново не нужно.
  payment:
    button: 🧾 Оплатил, а подписка не продлилась
    answer: |-
      <b>🧾 Оплатил, а подписка не продлилась</b>

      Обычно подписка продлевается сама через несколько минут после оплаты, и бот присылает сообщение.

      Сообщения всё нет — напишите сюда, в этот чат, и приложите чек или скриншот оплаты. Разберёмся.

# «👤 Мой профиль». Подстановки:
# {expire_at} — дата по Москве, например «10.12.2026, 18:00 МСК»;
# {left} — сколько осталось, например «5 дней 3 часа» (слова — в группе units).
# Экран собирается из частей: заголовок, статус, устройства, трафик (только в пробном).
profile:
  title: <b>👤 Мой профиль</b>
  status_trial: |-
    Статус: 🎁 <b>пробный период</b>
    Действует до <b>{expire_at}</b>, осталось {left}.
  status_trial_traffic_used_up: |-
    Статус: ⛔️ <b>пробный трафик закончился</b>
    Чтобы пользоваться прокси дальше, выберите тариф — трафик в подписке без ограничений.
  status_active: |-
    Статус: ✅ <b>подписка активна</b>
    Действует до <b>{expire_at}</b>, осталось {left}.
  status_grace: |-
    Статус: ⏳ <b>подписка закончилась</b>
    Мы сохранили вам доступ до <b>{expire_at}</b> (осталось {left}). Продлите подписку, чтобы не остаться без прокси.
  status_expired: |-
    Статус: ❌ <b>подписка закончилась</b> {expire_at}
    Продлите её — ссылка подписки останется прежней, настраивать ничего не нужно.
  status_suspended: |-
    Статус: ⛔️ <b>доступ приостановлен</b>
    Напишите нам в «💬 Поддержку» — разберёмся.
  # {used} — сколько устройств подключено, {limit} — сколько можно
  devices: "📱 Устройства: {used} из {limit}"
  devices_no_limit: "📱 Устройства: {used}"
  # {used} и {limit} — гигабайты, например «2,3» и «7»
  traffic: "📶 Трафик: {used} из {limit} ГБ"
  no_account: |-
    <b>👤 Мой профиль</b>

    У вас пока нет подписки. Попробуйте бесплатно — 7 дней, без оплаты и без карты.
    Или сразу выберите тариф.

# «📱 Мои устройства». Экран собирается из частей: заголовок, итог удаления, список, подсказка.
devices:
  # {used} — сколько устройств подключено, {limit} — сколько можно
  title: |-
    <b>📱 Мои устройства</b>

    Подключено {used} из {limit}.
  title_no_limit: |-
    <b>📱 Мои устройства</b>

    Подключено: {used}.
  # {number} — номер в списке; {name} — модель; {system} — система и версия;
  # {connected_at} — когда подключено, по Москве
  item: |-
    {number}. <b>{name}</b> — {system}
    подключено {connected_at}
  item_no_system: |-
    {number}. <b>{name}</b>
    подключено {connected_at}
  unknown_model: Устройство без названия
  hint: |-
    Новое устройство не подключается? Удалите то, которым больше не пользуетесь, — место освободится.
  empty: |-
    <b>📱 Мои устройства</b>

    Подключённых устройств пока нет. Нажмите «🚀 Подключиться», чтобы добавить первое.
  deleted: ✅ Устройство удалено.
  not_found: Этого устройства уже нет в списке.

# Слова после чисел: «1 день», «2 дня», «5 дней». {n} — число
units:
  days_one: "{n} день"
  days_few: "{n} дня"
  days_many: "{n} дней"
  hours_one: "{n} час"
  hours_few: "{n} часа"
  hours_many: "{n} часов"
  less_than_hour: меньше часа

# «💳 Тарифы» (цены и сроки — в tariffs.yaml, скидку от цены месяца бот считает сам)
tariffs:
  title: |-
    <b>💳 Тарифы</b>

    В любом тарифе — до 3 устройств и трафик без ограничений. Чем дольше срок, тем выгоднее.
    Если подписка ещё идёт, новые дни добавятся к её окончанию.

    Выберите срок:
  # кнопка тарифа: {title} — название из tariffs.yaml, {price} — цена в рублях
  button: "{title} — {price} ₽"
  # тариф со скидкой от цены месяца: {discount} — процент скидки
  button_discount: "{title} — {price} ₽ · выгода {discount}%"
  # скрытый тестовый тариф — эту кнопку видят только администраторы
  button_hidden: "🔒 {title} — {price} ₽ · только для администраторов"
  # всплывает над кнопкой; не длиннее 200 символов
  not_available: Этого тарифа больше нет. Выберите тариф из списка.

# Оплата тарифа
payment:
  # описание платежа: клиент видит его на странице оплаты и в чеке; {title} — название тарифа
  description: "Подписка TS Proxy: {title}"
  # {title} — тариф, {price} — цена в рублях, {expires_at} — до какого времени действует ссылка
  screen: |-
    <b>💳 Оплата: {title}</b>

    К оплате: <b>{price} ₽</b>

    Нажмите «Оплатить» — откроется страница платёжного сервиса. Ссылка действует до <b>{expires_at}</b>; если снова выбрать этот тариф, бот покажет ту же ссылку.

    После оплаты подписка продлится сама, и мы пришлём сообщение. Если подписка ещё идёт, новые дни добавятся к её окончанию.
  too_many: |-
    Вы создали слишком много ссылок на оплату подряд — это защита от случайных повторных платежей. Подождите 10 минут и попробуйте снова — или оплатите по ссылке, которую уже получили.
  unavailable: |-
    Платёжный сервис сейчас не отвечает. Попробуйте через пару минут — мы уже знаем о проблеме.
  # задача 13: оплата засчитана, доступ выдан. {expire_at} — до какого времени подписка
  # (по Москве), {device_limit} — сколько устройств
  paid: |-
    <b>✅ Оплачено, подписка до {expire_at}</b>

    Спасибо! До {device_limit} устройств, трафик без ограничений.

    Если прокси уже настроен в приложении — ничего делать не нужно, всё работает.
    Если нет — нажмите «Открыть страницу подключения»: там кнопка, которая сама добавит подписку в приложение. Приложения ещё нет — загляните в «📖 Инструкции».

    Ссылка подписки — ваш личный доступ. Не пересылайте её другим.
  # оплата прошла не на сумму тарифа (сбой платёжки): срок пересчитан, извиняемся;
  # {amount} — сколько оплачено, {price} — цена тарифа, ₽
  paid_prorated: |-
    <b>✅ Оплачено, подписка до {expire_at}</b>

    Из-за сбоя одного из сервисов оплата прошла не на сумму тарифа: {amount} ₽ вместо {price} ₽. Это произошло не умышленно — простите. Чтобы вы остались довольны, мы рассчитали срок лично для вас: ровно на оплаченную сумму и даже чуть больше.

    До {device_limit} устройств, трафик без ограничений.

    Если прокси уже настроен в приложении — ничего делать не нужно, всё работает.
    Если нет — нажмите «Открыть страницу подключения»: там кнопка, которая сама добавит подписку в приложение. Приложения ещё нет — загляните в «📖 Инструкции».

    Ссылка подписки — ваш личный доступ. Не пересылайте её другим.
  # оплата засчитана, а сервис подключения не ответил; бот сам пришлёт «✅ Оплачено»
  pending: |-
    <b>✅ Оплата получена</b>

    Доступ подключается, это займёт пару минут. Как только всё будет готово, пришлём сообщение сюда — нажимать ничего не нужно.

# Льготный период после окончания платной подписки (задача 11): по одному сообщению в сутки,
# под каждым — кнопка «Продлить». {until} — когда доступ выключится, по Москве,
# например «10.12.2026, 18:00 МСК».
grace:
  # первый день: подписка кончилась, доступ сохранён
  started: |-
    <b>⏳ Подписка закончилась</b>

    Мы сохранили вам доступ к прокси до <b>{until}</b>. Продлите подписку, чтобы не остаться без связи.
    Ссылка подписки останется прежней — настраивать ничего не нужно.
  # следующие дни: напоминание раз в сутки
  reminder: |-
    <b>⏳ Напоминаем: подписка закончилась</b>

    Доступ к прокси сохранён до <b>{until}</b>. Продлите подписку, чтобы он не отключился.
  # «последний день» — очень заметное предупреждение (решение владельца 2026-10-24)
  last_day: |-
    ⚠️⚠️⚠️ <b>ПОСЛЕДНИЙ ДЕНЬ ДОСТУПА</b> ⚠️⚠️⚠️

    Подписка закончилась. <b>Прокси отключится {until}.</b>

    Продлите подписку сейчас — после оплаты всё продолжит работать само, настраивать заново ничего не нужно.
  # одно финальное сообщение: доступ выключен, аккаунт сохранён
  ended: |-
    <b>❌ Доступ к прокси отключён</b>

    Подписка закончилась, льготные дни прошли. Чтобы снова подключиться, продлите подписку — ссылка подписки останется прежней, настраивать ничего не нужно.

# Уведомления по инициативе бота (задача 10): приходят новым сообщением.
# {expire_at} — когда кончается срок, по Москве, например «10.12.2026, 18:00 МСК»
notices:
  trial_day_before: |-
    <b>⏳ Пробный период закончится через день</b>

    Пробный период действует до <b>{expire_at}</b>. Чтобы прокси работал и дальше, выберите тариф — оплаченные дни добавятся к остатку пробного, ссылка подписки останется прежней.
  trial_hour_before: |-
    <b>⏳ Пробный период закончится через час</b>

    В <b>{expire_at}</b> прокси перестанет работать. Чтобы не остаться без него, выберите тариф — ссылка подписки останется прежней, настраивать ничего не нужно.
  paid_day_before: |-
    <b>⏳ Подписка закончится через день</b>

    Подписка действует до <b>{expire_at}</b>. Продлите её заранее — новые дни добавятся к окончанию, ссылка подписки останется прежней.
  paid_hour_before: |-
    <b>⏳ Подписка закончится через час</b>

    Подписка действует до <b>{expire_at}</b>. Продлите её сейчас — ссылка подписки останется прежней, настраивать ничего не нужно.
  # клиент так и не подключился — пробный продлили; {days} — на сколько, например «3 дня»;
  # {expire_at} — новый срок
  trial_extended: |-
    <b>🎁 Мы продлили пробный период</b>

    Пробный период закончился, а вы так и не подключились. Ничего страшного — дарим ещё {days}: пользуйтесь бесплатно до <b>{expire_at}</b>.

    Подключение занимает пару минут: нажмите «🚀 Подключиться» и следуйте подсказкам. Если что-то не получается — напишите нам в «💬 Поддержку».
  # продления пробного кончились, клиент так и не подключился; больше не пишем
  trial_farewell: |-
    <b>👋 Пробный период закончился</b>

    Похоже, прокси вам пока не пригодился — и это нормально. Будем рады, если вы всё-таки вернётесь: тарифы всегда в меню, а ссылка подписки останется прежней.
  # {used} и {limit} — гигабайты, например «5,6» и «7»
  trial_traffic_warning: |-
    <b>📶 Пробный трафик почти закончился</b>

    Израсходовано {used} из {limit} ГБ. Когда трафик закончится, прокси перестанет работать. В подписке трафик без ограничений — выберите тариф, чтобы не прерываться.
  trial_traffic_used_up: |-
    <b>⛔️ Пробный трафик закончился</b>

    Все {limit} ГБ пробного периода израсходованы, и прокси сейчас не работает. Чтобы продолжить, выберите тариф — в подписке трафик без ограничений, а ссылка подписки останется прежней.

# «ℹ️ О сервисе»
about:
  text: |-
    <b>TS Proxy — прокси-сервис с шифрованием трафика.</b>

    Шифруем ваш трафик, скрываем IP-адрес и защищаем данные в публичных Wi-Fi сетях — в кафе, аэропортах, отелях.

    • Скорость до 1 Гбит/с
    • До 3 устройств по одной подписке
    • Приложения для iPhone, Android, Windows и macOS
    • Поддержка прямо в боте

    Используя сервис, вы соглашаетесь с <a href="https://ts-proxy.com/terms">условиями использования</a> и самостоятельно отвечаете за соблюдение законодательства при его использовании.

# «📖 Инструкции»: основное приложение — Happ, запасное — v2RayTun
instructions:
  choose: |-
    <b>📖 Инструкции</b>

    Подключение занимает пару минут. Выберите своё устройство:
  ios: |-
    <b>📱 iPhone и iPad</b>

    1. Установите приложение <b>Happ</b> из App Store.
    2. Вернитесь в бота, нажмите «🚀 Подключиться», затем «Открыть страницу подключения» и на ней — кнопку добавления в Happ.
    3. В Happ нажмите большую кнопку подключения и разрешите добавить конфигурацию.

    Не получилось? Запасной вариант — приложение <b>v2RayTun</b>: те же шаги, на странице подключения выберите v2RayTun.
  android: |-
    <b>🤖 Android</b>

    1. Установите приложение <b>Happ</b> из Google Play.
    2. Вернитесь в бота, нажмите «🚀 Подключиться», затем «Открыть страницу подключения» и на ней — кнопку добавления в Happ.
    3. В Happ нажмите большую кнопку подключения и разрешите приложению работать.

    Не получилось? Запасной вариант — приложение <b>v2RayTun</b>: те же шаги, на странице подключения выберите v2RayTun.
  windows: |-
    <b>🖥 Windows</b>

    1. Скачайте и установите <b>Happ</b> для Windows — ссылка есть на странице подключения.
    2. В боте нажмите «📋 Скопировать ссылку» (раздел «🚀 Подключиться»), в Happ нажмите «+» и вставьте ссылку из буфера.
    3. Нажмите кнопку подключения в Happ.

    Не получилось? Запасной вариант — <b>v2RayTun</b>: те же шаги.
  macos: |-
    <b>💻 macOS</b>

    1. Установите приложение <b>Happ</b> из App Store.
    2. В боте нажмите «📋 Скопировать ссылку» (раздел «🚀 Подключиться»), в Happ нажмите «+» и вставьте ссылку из буфера.
    3. Нажмите кнопку подключения и разрешите добавить конфигурацию.

    Не получилось? Запасной вариант — приложение <b>v2RayTun</b>: те же шаги.

