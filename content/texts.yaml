    Оплатили, а сообщения нет 5 минут — нажмите «🔄 Проверить оплату».
  too_many: |-
    Вы создали слишком много ссылок на оплату подряд — это защита от случайных повторных платежей. Подождите 10 минут и попробуйте снова — или оплатите по ссылке, которую уже получили.
  unavailable: |-
    Платёжный сервис сейчас не отвечает. Попробуйте через пару минут — мы уже знаем о проблеме.
  # задача 13: оплата засчитана, доступ выдан. {expire_at} — до какого времени подписка
  # (по Москве), {device_limit} — сколько устройств
  paid: |-
    <b>✅ Оплачено, подписка до {expire_at}</b>

    Спасибо! До {device_limit} устройств, трафик без ограничений.

    Если прокси уже настроен в приложении — ничего делать не нужно, всё работает.
    Если нет — нажмите «Открыть страницу подключения»: там кнопка, которая сама добавит подписку в приложение. Приложения ещё нет — загляните в «📖 Инструкции».

    Ссылка подписки — ваш личный доступ. Не пересылайте её другим.
  # оплата прошла не на сумму тарифа (сбой платёжки): срок пересчитан, извиняемся;
  # {amount} — сколько оплачено, {price} — цена тарифа, ₽
  paid_prorated: |-
    <b>✅ Оплачено, подписка до {expire_at}</b>

    Из-за сбоя одного из сервисов оплата прошла не на сумму тарифа: {amount} ₽ вместо {price} ₽. Это произошло не умышленно — простите. Чтобы вы остались довольны, мы рассчитали срок лично для вас: ровно на оплаченную сумму и даже чуть больше.

    До {device_limit} устройств, трафик без ограничений.

    Если прокси уже настроен в приложении — ничего делать не нужно, всё работает.
    Если нет — нажмите «Открыть страницу подключения»: там кнопка, которая сама добавит подписку в приложение. Приложения ещё нет — загляните в «📖 Инструкции».

    Ссылка подписки — ваш личный доступ. Не пересылайте её другим.
  # оплата засчитана, а сервис подключения не ответил; бот сам пришлёт «✅ Оплачено»
  pending: |-
