# «Мой профиль»; {expire_at} — дата по Москве, {left} — сколько осталось (слова — units)
profile:
  title: <b>👤 Мой профиль</b>
  status_trial: |-
    Статус: 🎁 <b>пробный период</b>
    Действует до <b>{expire_at}</b>, осталось {left}.
  status_trial_traffic_used_up: |-
    Статус: ⛔️ <b>пробный трафик закончился</b>
    Чтобы пользоваться прокси дальше, выберите тариф — трафик в подписке без ограничений.
  status_active: |-
    Статус: ✅ <b>подписка активна</b>
    Действует до <b>{expire_at}</b>, осталось {left}.
  status_grace: |-
    Статус: ⏳ <b>подписка закончилась</b>
    Мы сохранили вам доступ до <b>{expire_at}</b> (осталось {left}). Продлите подписку, чтобы не остаться без прокси.
  status_expired: |-
    Статус: ❌ <b>подписка закончилась</b> {expire_at}
    Продлите её — ссылка подписки останется прежней, настраивать ничего не нужно.
  status_suspended: |-
    Статус: ⛔️ <b>доступ приостановлен</b>
    Напишите нам в «Поддержку» — разберёмся.
  # {used} — сколько устройств подключено, {limit} — сколько можно
  devices: "📱 Устройства: {used} из {limit}"
  devices_no_limit: "📱 Устройства: {used}"
  # {used} и {limit} — гигабайты, например «2,3» и «7»
  traffic: "📶 Трафик: {used} из {limit} ГБ"
  no_account: |-
    <b>👤 Мой профиль</b>

    У вас пока нет подписки. Попробуйте бесплатно — 7 дней, без оплаты и без карты.
    Или сразу выберите тариф.

# «Мои устройства»: заголовок, итог удаления, список, подсказка
devices:
  # {used} — сколько устройств подключено, {limit} — сколько можно
  title: |-
    <b>📱 Мои устройства</b>

    Подключено {used} из {limit}.
  title_no_limit: |-
    <b>📱 Мои устройства</b>

    Подключено: {used}.
  # {number} — номер, {name} — модель, {system} — система, {connected_at} — когда, по Москве
  item: |-
    {number}. <b>{name}</b> — {system}
    подключено {connected_at}
  item_no_system: |-
    {number}. <b>{name}</b>
    подключено {connected_at}
  unknown_model: Устройство без названия
  hint: |-
    Новое устройство не подключается? Удалите то, которым больше не пользуетесь, — место освободится.

    Удаление только освобождает место: устройство, которое уже получило настройки, может работать и дальше. Чтобы отключить чужое устройство, перевыпустите ссылку.
  empty: |-
    <b>📱 Мои устройства</b>

    Подключённых устройств пока нет. Нажмите «Подключиться», чтобы добавить первое.
  deleted: ✅ Устройство удалено.
  not_found: Этого устройства уже нет в списке.

# «Перевыпустить ссылку»: старая перестаёт работать везде; не чаще раза в сутки
revoke_link:
  ask: |-
    <b>🔄 Перевыпустить ссылку</b>

    Нужно, если ссылка попала к чужим людям: перевыпуск отключит все устройства, которые ею пользуются.

    Старая ссылка перестанет работать на всех устройствах — подписку нужно будет добавить заново. Перевыпустить?
  # всплывашка на старую кнопку раньше суток: до 200 символов, без разметки
  # {available_at} — когда снова можно, по Москве
  too_soon: "Ссылку можно перевыпускать не чаще раза в сутки. Перевыпустить можно будет {available_at}."
  # под серой кнопкой на профиле и устройствах; {available_at} — когда снова можно, по Москве
  available_at: "Перевыпустить ссылку можно будет {available_at}."
  done: |-
    ✅ <b>Ссылка перевыпущена</b>

    Старая ссылка больше не работает. Добавьте подписку заново на каждом своём устройстве: откройте страницу подключения или скопируйте новую ссылку в приложение.
