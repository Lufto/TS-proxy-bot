# Команды в меню Telegram (кнопка «/» рядом с полем ввода)
commands:
  start: Главное меню
  profile: Мой профиль
  buy: Тарифы и оплата
  support: Написать в поддержку
  # обязательна по правилам Telegram для ботов с оплатой — ведёт в поддержку
  paysupport: Вопросы об оплате
  help: Список команд

# /help в личном чате — все команды клиента
help:
  text: |-
    <b>Команды</b>
    /start — главное меню
    /profile — мой профиль: срок подписки и устройства
    /buy — тарифы и оплата
    /support — написать в поддержку
    /paysupport — вопросы об оплате
    /help — этот список

    Вопрос можно просто написать сюда — он уйдёт в поддержку.
