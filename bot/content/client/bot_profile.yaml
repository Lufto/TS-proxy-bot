# Профиль бота в Telegram (задача 29 bot-telegram-ui). Ставит `scripts/set_bot_profile.py`,
# бот при запуске их не трогает. Простой текст, без HTML: ts-proxy.com Telegram сам делает ссылкой.
bot_profile:
  # «Что умеет этот бот?» — в пустом чате до /start, до 512 знаков
  description: |-
    Прокси с шифрованием трафика — для iPhone, Android, Windows, macOS и Linux.

    — шифруем трафик и скрываем IP-адрес, даже в открытом Wi‑Fi
    — подключение за пару минут, без настроек вручную
    — до 3 устройств на одной подписке
    — поддержка отвечает прямо здесь, в чате

    Нажмите «Запустить», чтобы начать. Подробнее — ts-proxy.com
  # «О боте» — в профиле бота и в превью ссылки на него, до 120 знаков
  short_description: Прокси с шифрованием трафика. Подключение за пару минут, до 3 устройств. ts-proxy.com
