# «Подключиться»
connect:
  # {expire_at} — дата окончания подписки по часам клиента (старые Telegram — «10.12.2026, 18:00 МСК»)
  active: |-
    <b>🚀 Подключение</b>

    Подписка активна до <b>{expire_at}</b>.

    Нажмите «Открыть страницу подключения» — там кнопка, которая сама добавит подписку в приложение.
    Если приложения ещё нет, загляните в «Инструкции».

    Ссылка подписки — ваш личный доступ. Не пересылайте её другим.
  inactive: |-
    <b>🚀 Подключение</b>

    Подписка закончилась {expire_at}. Чтобы снова подключиться, продлите её в «Тарифах».

    Ссылка подписки та же — после продления ничего настраивать заново не нужно.
  no_account: |-
    <b>🚀 Подключение</b>

    У вас пока нет подписки. Попробуйте бесплатно — 7 дней, без оплаты и без карты.
    Или сразу выберите тариф.
  unavailable: |-
    Не получилось загрузить вашу подписку — сервис подключения сейчас не отвечает.
    Мы уже знаем и разбираемся. Попробуйте ещё раз через несколько минут.
  # «Подключиться» при сбое панели: бот сам пришлёт ссылку, когда панель ответит (сутки)
  pending: |-
    <b>🚀 Подключение</b>

    Сервису подключения нужно чуть больше времени на ответ. Как только всё будет готово, пришлём ссылку сюда — нажимать ничего не нужно.

# «Инструкции»: самая короткая выжимка, только Happ. Запасные приложения и скриншоты — на сайте,
# ссылка ведёт в раздел устройства (/help/<устройство>/ — отдельные страницы сайта)
instructions:
  # Шаг 2 инструкций, {open_page} (задача 17): есть прокси-аккаунт — личная ссылка подписки
  # нажавшего ({url}); нет аккаунта или панель не ответила — через «Подключиться»
  open_page_link: |-
    Откройте <a href="{url}">вашу страницу подключения</a> и нажмите «Добавить в Happ».
  open_page_connect: |-
    Нажмите «Подключиться» → «Открыть страницу подключения» → «Добавить в Happ».
  choose: |-
    <b>📖 Инструкции</b>

    Подключение занимает пару минут. Выберите своё устройство:
  ios: |-
    <b>📱 iPhone и iPad</b>

    1. Установите <b>Happ</b>. В российском App Store его нет — нужен Apple ID другой страны.
    2. {open_page}
    3. В Happ нажмите кнопку подключения.

    Подробно со скриншотами и запасные приложения — <a href="https://ts-proxy.com/help/ios/">на сайте</a>.
  android: |-
    <b>🤖 Android</b>

    1. Установите <b>Happ</b> файлом: на странице подключения нажмите «Скачать» и разрешите установку.
    2. {open_page}
    3. В Happ нажмите кнопку подключения.

    Подробно со скриншотами и запасные приложения — <a href="https://ts-proxy.com/help/android/">на сайте</a>.
  windows: |-
    <b>🖥 Windows</b>

    1. Установите <b>Happ</b> для Windows — ссылка на странице подключения.
    2. {open_page}
    3. В Happ нажмите кнопку подключения.

    Подробно со скриншотами и запасные приложения — <a href="https://ts-proxy.com/help/windows/">на сайте</a>.
  macos: |-
    <b>💻 macOS</b>

    1. Установите <b>Happ</b> для Mac — ссылка на странице подключения. Перетащите его в «Программы».
    2. {open_page}
    3. В Happ нажмите кнопку подключения.

    Подробно со скриншотами и запасные приложения — <a href="https://ts-proxy.com/help/macos/">на сайте</a>.
  linux: |-
    <b>🐧 Linux</b>

    1. Установите <b>Happ</b> для Linux — пакет на странице подключения.
    2. {open_page}
    3. В Happ нажмите кнопку подключения.

    Подробно со скриншотами и запасные приложения — <a href="https://ts-proxy.com/help/linux/">на сайте</a>.
