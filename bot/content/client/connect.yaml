# «Подключиться»
connect:
  # {expire_at} — дата окончания подписки по Москве, например «10.12.2026, 18:00 МСК»
  active: |-
    <b>🚀 Подключение</b>

    Подписка активна до <b>{expire_at}</b>.

    Нажмите «Открыть страницу подключения» — там кнопка, которая сама добавит подписку в приложение.
    Если приложения ещё нет, загляните в «Инструкции».

    Ссылка подписки — ваш личный доступ. Не пересылайте её другим.
  inactive: |-
    <b>🚀 Подключение</b>

    Подписка закончилась {expire_at}. Чтобы снова подключиться, продлите её в «Тарифах».

    Ссылка подписки та же — после продления ничего настраивать заново не нужно.
  no_account: |-
    <b>🚀 Подключение</b>

    У вас пока нет подписки. Попробуйте бесплатно — 7 дней, без оплаты и без карты.
    Или сразу выберите тариф.
  unavailable: |-
    Не получилось загрузить вашу подписку — сервис подключения сейчас не отвечает.
    Мы уже знаем и разбираемся. Попробуйте ещё раз через несколько минут.
  # «Подключиться» при сбое панели: бот сам пришлёт ссылку, когда панель ответит (сутки)
  pending: |-
    <b>🚀 Подключение</b>

    Сервису подключения нужно чуть больше времени на ответ. Как только всё будет готово, пришлём ссылку сюда — нажимать ничего не нужно.

# «Инструкции»: Happ главный, дальше запасные; тот же список — на сайте (config/site.yaml)
instructions:
  choose: |-
    <b>📖 Инструкции</b>

    Подключение занимает пару минут. Выберите своё устройство:
  ios: |-
    <b>📱 iPhone и iPad</b>

    1. Установите <b>Happ</b>. В российском App Store его сейчас нет: если ставили раньше — App Store → ваше имя → «Покупки»; если нет — нужен отдельный Apple ID другой страны. Подробно — на <a href="https://ts-proxy.com/help/ios/">сайте</a>. Осторожно с подделками: настоящий Happ выпускает Flyfrog LLC.
    2. Вернитесь в бота, нажмите «Подключиться», затем «Открыть страницу подключения», выберите приложение и нажмите «Добавить в …».
    3. В Happ нажмите большую кнопку подключения и разрешите добавить конфигурацию.

    Не получилось? Запасное — <b>OneXray</b>, он есть в российском App Store. Нажмите «Скопировать ссылку», в OneXray — «+» → подписка по ссылке, вставьте ссылку. «Россия напрямую» (российские сайты без прокси) есть только в Happ и v2RayTun; в остальных весь трафик идёт через прокси.
  android: |-
    <b>🤖 Android</b>

    1. Установите <b>Happ</b>: его убрали из Google Play, поэтому ставим файлом. На странице подключения или на <a href="https://ts-proxy.com/help/android/">сайте</a> нажмите «Скачать» — файл сразу загрузится. Откройте его и разрешите установку, когда телефон спросит.
    2. Вернитесь в бота, нажмите «Подключиться», затем «Открыть страницу подключения», выберите приложение и нажмите «Добавить в …».
    3. В Happ нажмите большую кнопку подключения и разрешите приложению работать.

    Не получилось? Запасное — <b>v2RayTun</b> из Google Play: те же шаги. Ещё варианты — <b>Hiddify</b> и <b>OneXray</b>. «Россия напрямую» (российские сайты без прокси) есть только в Happ и v2RayTun; в остальных весь трафик идёт через прокси.
  windows: |-
    <b>🖥 Windows</b>

    1. Скачайте и установите <b>Happ</b> для Windows — ссылка есть на странице подключения и на <a href="https://ts-proxy.com/help/windows/">сайте</a>.
    2. Вернитесь в бота, нажмите «Подключиться», затем «Открыть страницу подключения», выберите приложение и нажмите «Добавить в …». Или нажмите «Скопировать ссылку», в Happ — «+» и вставьте ссылку.
    3. Нажмите кнопку подключения в Happ.

    Не получилось? Запасное — <b>v2RayTun</b>: те же шаги. Ещё варианты — <b>Hiddify</b> и <b>v2rayN</b>. «Россия напрямую» (российские сайты без прокси) есть только в Happ и v2RayTun; в остальных весь трафик идёт через прокси.
  macos: |-
    <b>💻 macOS</b>

    1. Скачайте <b>Happ</b> для Mac — кнопка «Скачать для Mac» на странице подключения или на <a href="https://ts-proxy.com/help/macos/">сайте</a> сразу скачивает установщик. Откройте его и перетащите Happ в «Программы».
    2. Вернитесь в бота, нажмите «Подключиться», затем «Открыть страницу подключения», выберите приложение и нажмите «Добавить в …». Или нажмите «Скопировать ссылку», в Happ — «+» и вставьте ссылку.
    3. Нажмите кнопку подключения и разрешите добавить конфигурацию.

    Не получилось? Запасное — <b>OneXray</b> из Mac App Store: скопируйте ссылку и вставьте её через «+». Ещё варианты — <b>Hiddify</b> и <b>v2rayN</b>. «Россия напрямую» (российские сайты без прокси) есть только в Happ и v2RayTun; в остальных весь трафик идёт через прокси.
  linux: |-
    <b>🐧 Linux</b>

    1. Скачайте <b>Happ</b> для Linux — на странице подключения или на <a href="https://ts-proxy.com/help/linux/">сайте</a> нажмите «Для Ubuntu / Debian» или «Для Fedora», пакет сразу скачается. Установите его двойным щелчком.
    2. Вернитесь в бота, нажмите «Подключиться», затем «Открыть страницу подключения», выберите приложение и нажмите «Добавить в …». Или нажмите «Скопировать ссылку», в Happ — «+» и вставьте ссылку.
    3. Нажмите кнопку подключения в Happ.

    Не получилось? Запасное — <b>Hiddify</b>: те же шаги. Ещё варианты — <b>v2rayN</b> и <b>Throne</b>. «Россия напрямую» (российские сайты без прокси) есть только в Happ и v2RayTun; в остальных весь трафик идёт через прокси.
