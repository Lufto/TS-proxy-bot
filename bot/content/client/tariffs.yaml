# «💳 Тарифы» (цены и сроки — в tariffs.yaml, скидку от цены месяца бот считает сам)
tariffs:
  title: |-
    <b>💳 Тарифы</b>

    В любом тарифе — до 3 устройств и трафик без ограничений. Чем дольше срок, тем выгоднее.
    Если подписка ещё идёт, новые дни добавятся к её окончанию.

    Выберите срок:
  # кнопка тарифа: {title} — название из tariffs.yaml, {price} — цена в рублях
  button: "{title} — {price} ₽"
  # тариф со скидкой от цены месяца: {discount} — процент скидки
  button_discount: "{title} — {price} ₽ · выгода {discount}%"
  # всплывает над кнопкой; не длиннее 200 символов
  not_available: Этого тарифа больше нет. Выберите тариф из списка.
  # экран тарифа — выбор оплаты и ссылка на соглашение; {title} — тариф, {price} — рубли, {stars} — звёзды по курсу
  screen: |-
    <b>💳 {title}</b>

    • СБП — <b>{price} ₽</b>
    • Telegram Stars — <b>{stars} ⭐</b>

    Оплачивая, вы принимаете <a href="https://ts-proxy.com/terms">пользовательское соглашение</a>, в нём же — условия возврата.

    Выберите способ оплаты:
  # оплата выключена: заголовок, список тарифов, под ним off_trial или off_later
  off_title: |-
    <b>💳 Тарифы</b>

    В любом тарифе — до 3 устройств и трафик без ограничений. Чем дольше срок, тем выгоднее.
  # пробный ещё доступен: под текстом кнопка «🎁 Попробовать бесплатно»
  off_trial: Оплата скоро появится. Пока можно бесплатно попробовать — 7 дней.
  # пробный уже брал или платил раньше
  off_later: Оплата скоро появится — загляните сюда чуть позже.

# Оплата звёздами Telegram: счёт отдельным сообщением; {title} — тариф, {stars} — цена в звёздах
stars:
  # заголовок счёта: Telegram — до 32 символов
  invoice_title: "TS Proxy — {title}"
  # описание счёта: Telegram — до 255 символов
  invoice_description: "Подписка TS Proxy на {title}: до 3 устройств, трафик без ограничений. После оплаты бот сам продлит подписку."
  price_label: "Подписка на {title}"
  # кнопка оплаты под счётом: «⭐» Telegram показывает значком звезды. {stars} — цена
  pay_button: "Заплатить ⭐{stars}"
  # заменяет экран тарифа, когда счёт отправлен
  invoice_sent: |-
    <b>⭐ Счёт на {stars} ⭐ — сообщением ниже</b>

    Нажмите в нём «Заплатить». Если звёзд не хватает, Telegram предложит их купить.

    Счёт действует час. После оплаты подписка продлится сама, и мы пришлём сообщение. Если подписка ещё идёт, новые дни добавятся к её окончанию.
  # почему оплатить счёт нельзя — Telegram показывает это в окне оплаты (до 255 символов)
  refused:
    not_found: Этот счёт не найден. Выберите тариф в «💳 Тарифах» ещё раз.
    already_paid: Этот счёт уже оплачен. Подписка продлена — загляните в «👤 Мой профиль».
    expired: Счёт устарел. Выберите тариф в «💳 Тарифах» ещё раз — придёт новый счёт.
    amount_mismatch: Цена изменилась. Выберите тариф в «💳 Тарифах» ещё раз — придёт новый счёт.
    error: Не получилось проверить счёт. Попробуйте через минуту.
  # оплата пришла, а засчитать её некуда (счёт уже оплачен, чужой или устарел) — звёзды вернули
  returned: |-
    ⭐ <b>Звёзды вернулись на ваш баланс</b>

    Эта оплата не подошла ни к одному заказу (например, счёт уже был оплачен), поэтому мы сразу вернули {stars} ⭐. Вопросы — /paysupport.
  # …и вернуть автоматически не получилось
  return_failed: |-
    ⭐ <b>Оплата получена, но не подошла к заказу</b>

    Вернуть {stars} ⭐ автоматически не получилось — мы уже разбираемся и напишем вам. Вопросы — /paysupport.
  # оплата пришла, а записать её не вышло (сбой базы бота) — доступ выдаст администратор
  unrecorded: |-
    ⭐ <b>Оплата получена</b>

    Мы получили {stars} ⭐, но из-за сбоя не успели выдать доступ. Администратор уже знает и выдаст его вручную — звёзды не пропадут. Вопросы — /paysupport.
