# Главное меню — фото (content/images/menu-*.png) с подписью: строка статуса и этот текст.
# Подпись — не длиннее 1024 символов; «TS Proxy — прокси-сервис…» — на картинке (задача 27)
menu:
  title: "Выберите, что нужно:"
  # Строка статуса над меню (задача 19); {expire_at} — дата окончания по часам клиента.
  # Нет прокси-аккаунта или панель не ответила — строки нет
  status_trial: ✅ Пробный период до {expire_at}
  status_trial_traffic_used_up: ⛔ Пробный трафик закончился
  status_active: ✅ Активна до {expire_at}
  status_grace: ⛔ Закончилась, доступ сохранён до {expire_at}
  status_expired: ⛔ Закончилась
  status_suspended: ⛔ Доступ приостановлен

# Сайт и документы — кнопками в «О сервисе». Раньше Platega требовала документы в главном меню
# для банка; владелец убрал их оттуда 2026-11-18 (карта bot-telegram-ui, задача 15)
documents:
  site_url: https://ts-proxy.com
  terms_url: https://ts-proxy.com/terms
  privacy_url: https://ts-proxy.com/privacy

# «О сервисе» — подпись под картинкой about.png (задача 28): до 1024 символов,
# три цифры (устройства, платформы, минуты) — на картинке
about:
  text: Шифруем ваш трафик, скрываем IP-адрес и защищаем данные в публичных Wi-Fi сетях. До 3 устройств на одной подписке.

# Ограничение частоты нажатий
throttle:
  # всплывает над кнопкой; не длиннее 200 символов
  callback: Не так быстро 🙂 Подождите пару секунд.
  message: Вы пишете слишком часто. Подождите немного, пожалуйста.

# Ошибки и всё непонятное
errors:
  generic: |-
    Что-то пошло не так. Попробуйте ещё раз через минуту — мы уже получили сигнал об ошибке.
  # всплывает над кнопкой; не длиннее 200 символов
  stale_button: Эта кнопка устарела. Откройте меню командой /start.

fallback:
  unknown_command: |-
    Такой команды нет. Откройте меню командой /start — или просто напишите вопрос, и он уйдёт в поддержку.
