# «💬 Поддержка»: любое обычное сообщение клиента — обращение в поддержку
support:
  # под текстом — кнопки частых вопросов (группа faq ниже)
  intro: |-
    <b>💬 Поддержка</b>

    Ответы на частые вопросы — на кнопках ниже.

    Не нашли ответ — просто напишите вопрос сюда, в этот чат, одним или несколькими сообщениями. Можно приложить скриншоты, файлы и голосовые. Ответим здесь же.
  # первое сообщение открыло обращение; {ticket_id} — номер обращения
  ticket_created: "Обращение #{ticket_id} создано. Ответим здесь, в этом чате, в ближайшее время."
  # больше 10 сообщений в минуту
  flood: |-
    Вы пишете слишком часто — подождите минуту, пожалуйста. Сообщения, отправленные сейчас, до поддержки не дойдут.
  # стикеры, контакты, геолокация, опросы и т. п.
  unsupported: |-
    Такое сообщение не получится передать в поддержку. Напишите текстом или пришлите фото, файл или голосовое.
  # не получилось передать сообщение администраторам (например, не создалась тема)
  not_delivered: |-
    Не получилось передать сообщение в поддержку. Мы уже знаем и разбираемся — попробуйте ещё раз через несколько минут.
  # начало каждого ответа поддержки клиенту (дальше — текст администратора)
  reply_prefix: "<b>💬 Поддержка:</b>\n"

# Частые вопросы на «💬 Поддержка»: button — кнопка, answer — ответ; набор — в коде (FaqQuestion)
faq:
  connect:
    button: 🚀 Как подключиться?
    answer: |-
      <b>🚀 Как подключиться?</b>

      1. Установите приложение <b>Happ</b> — ссылки и шаги для вашего устройства в «📖 Инструкциях».
      2. В боте нажмите «🚀 Подключиться», затем «Открыть страницу подключения» — там кнопка, которая сама добавит подписку в приложение.
      3. В Happ нажмите большую кнопку подключения.

      Не получилось — напишите сюда, в этот чат, на каком устройстве подключаетесь.
  not_working:
    button: 🛠 Не работает — что делать?
    answer: |-
      <b>🛠 Не работает — что делать?</b>

      1. Проверьте в «👤 Моём профиле», что подписка активна.
      2. В приложении обновите подписку (кнопка обновления рядом с ней) и подключитесь заново.
      3. Переключите Wi-Fi на мобильный интернет или наоборот.
      4. Перезапустите приложение.

      Не помогло — напишите сюда, в этот чат: какое устройство и приложение, что именно не работает. Скриншот ошибки очень поможет.
  devices:
    button: 📱 Сколько устройств можно подключить?
    answer: |-
      <b>📱 Сколько устройств можно подключить?</b>

      В любом тарифе — до 3 устройств по одной подписке. Сколько подключено сейчас, видно в «👤 Моём профиле».

      Новое устройство не подключается? Откройте «👤 Мой профиль» → «📱 Мои устройства» и удалите то, которым больше не пользуетесь, — место освободится.
  renew:
    button: 💳 Как продлить подписку?
    answer: |-
      <b>💳 Как продлить подписку?</b>

      Выберите срок в «💳 Тарифах» и оплатите. Если подписка ещё идёт, новые дни добавятся к её окончанию.

      Ссылка подписки остаётся прежней — в приложении ничего настраивать заново не нужно.
  payment:
    button: 🧾 Оплатил, а подписка не продлилась
    answer: |-
      <b>🧾 Оплатил, а подписка не продлилась</b>

      Обычно подписка продлевается сама через несколько минут после оплаты, и бот присылает сообщение.

      Сообщения всё нет — напишите сюда, в этот чат, и приложите чек или скриншот оплаты. Разберёмся.
