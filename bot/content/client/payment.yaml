# Оплата тарифа
payment:
  # описание платежа: клиент видит его на странице оплаты и в чеке; {title} — название тарифа
  description: "Подписка TS Proxy: {title}"
  # {title} — тариф, {price} — цена в рублях, {expires_at} — до какого времени действует ссылка
  screen: |-
    <b>💳 Оплата: {title}</b>

    К оплате: <b>{price} ₽</b>

    Нажмите «Оплатить» — откроется страница платёжного сервиса. Ссылка действует до <b>{expires_at}</b>; если снова выбрать этот тариф, бот покажет ту же ссылку.

    После оплаты подписка продлится сама, и мы пришлём сообщение. Если подписка ещё идёт, новые дни добавятся к её окончанию.

    Оплатили, а сообщения нет 5 минут — нажмите «Проверить оплату».
  too_many: |-
    Вы попытались оплатить слишком много раз подряд, и мы сочли это подозрительным. Если это действительно вы — попробуйте снова через 10 минут.
  unavailable: |-
    Платёжный сервис сейчас не отвечает. Попробуйте через пару минут — мы уже знаем о проблеме.
  # спор через банк: деньги вернул банк, дни оплаты сняты; {expire_at} — новый срок
  disputed: |-
    <b>Срок подписки сокращён</b>

    Платёж за подписку оспорен через банк, и банк вернул деньги. Поэтому дни этой оплаты сняты: подписка теперь действует до {expire_at}.

    Если это ошибка или есть вопросы — напишите в поддержку, разберёмся.
  # …и после снятия дней подписки не осталось — доступ отключён
  disputed_ended: |-
    <b>Доступ отключён</b>

    Платёж за подписку оспорен через банк, и банк вернул деньги. Поэтому дни этой оплаты сняты, и оплаченного срока не осталось — доступ к прокси отключён.

    Если это ошибка или есть вопросы — напишите в поддержку, разберёмся.
  # …и снять дни сразу не вышло (сбой панели) — снимет администратор
  disputed_pending: |-
    <b>Платёж оспорен</b>

    Платёж за подписку оспорен через банк, и банк вернул деньги. Поэтому дни этой оплаты будут сняты со срока подписки.

    Если это ошибка или есть вопросы — напишите в поддержку, разберёмся.
  # оплата засчитана, доступ выдан; {expire_at} — срок по часам клиента, {device_limit} — устройства
  paid: |-
    <b>✅ Оплачено, подписка до {expire_at}</b>

    Спасибо! До {device_limit} устройств, трафик без ограничений.

    Если прокси уже настроен в приложении — ничего делать не нужно, всё работает.
    Если нет — нажмите «Открыть страницу подключения»: там кнопка, которая сама добавит подписку в приложение. Приложения ещё нет — загляните в «Инструкции».

    Ссылка подписки — ваш личный доступ. Не пересылайте её другим.
  # оплачено не на сумму тарифа, срок пересчитан; {amount} — оплачено, {price} — цена, ₽
  paid_prorated: |-
    <b>✅ Оплачено, подписка до {expire_at}</b>

    Из-за сбоя одного из сервисов оплата прошла не на сумму тарифа: {amount} ₽ вместо {price} ₽. Это произошло не умышленно — простите. Чтобы вы остались довольны, мы рассчитали срок лично для вас: ровно на оплаченную сумму и даже чуть больше.

    До {device_limit} устройств, трафик без ограничений.

    Если прокси уже настроен в приложении — ничего делать не нужно, всё работает.
    Если нет — нажмите «Открыть страницу подключения»: там кнопка, которая сама добавит подписку в приложение. Приложения ещё нет — загляните в «Инструкции».

    Ссылка подписки — ваш личный доступ. Не пересылайте её другим.
  # оплата засчитана, а сервис подключения не ответил; бот сам пришлёт «Оплачено, подписка до …»
  pending: |-
    <b>✅ Оплата получена</b>

    Доступ подключается, это займёт пару минут. Как только всё будет готово, пришлём сообщение сюда — нажимать ничего не нужно.
  # доступ не выдан за 30 минут — второе сообщение
  delayed: |-
    <b>⏳ Оплата получена, доступ задерживается</b>

    Сервис подключения отвечает с перебоями, мы уже разбираемся. Деньги у нас, подписка будет полной: срок считается с момента, когда доступ заработает. Как только всё будет готово, пришлём сообщение сюда.
  # две оплаты почти одновременно — дни сложены; вторую вернуть — через поддержку
  double: |-
    <b>Мы получили от вас две оплаты</b>

    Обе засчитаны, дни сложены в подписке. Если вторая оплата случайная — напишите в «Поддержку», разберёмся.
  # «Купить» нашёл оплату прошлого заказа — новая ссылка не нужна
  found: |-
    <b>✅ Мы нашли вашу оплату</b>

    Оплата по прошлой ссылке уже засчитана, новая ссылка не нужна. Подробности — в сообщении ниже.
  # ответы на «Проверить оплату»
  check_not_paid: |-
    <b>⏳ Оплата пока не поступила</b>

    Если вы уже оплатили, платёжному сервису может понадобиться пара минут. Нажмите «Проверить оплату» ещё раз чуть позже — или просто подождите: бот проверяет оплаты сам и пришлёт сообщение.
  check_canceled: |-
    Срок счёта на оплату истёк. Выберите тариф снова — бот создаст новый счёт.
  check_already: |-
    Эта оплата уже засчитана — мы прислали сообщение об этом. Подписка — в «Подключиться».
  check_not_found: |-
    Не нашли этот заказ. Выберите тариф снова — бот покажет ссылку на оплату.
  check_problem: |-
    Оплату видим, но с ней что-то не так — мы уже разбираемся и напишем вам. Если вопрос срочный — напишите в «Поддержку».
  check_unavailable: |-
    Не удалось связаться с платёжным сервисом. Попробуйте через пару минут — бот и сам проверит оплату и пришлёт сообщение.
  # оплата подтверждена, а база бота её не записала (очень редкий сбой) — доступ выдаст администратор
  not_recorded: |-
    ✅ <b>Оплата получена</b>

    Мы получили оплату, но не успели выдать доступ. Администратор уже знает и выдаст подписку — деньги не пропадут. Вопросы — /paysupport.
