# Возврат денег (решает администратор); {amount} — «150 ₽» или «100 ⭐», {expire_at} — по Москве
refund:
  # возврат закончен
  completed: |-
    ↩️ <b>Возврат {amount} оформлен</b>

    Деньги вернутся тем же способом, которым вы платили: звёзды — сразу на баланс Telegram, рубли — на счёт, срок зачисления зависит от банка. Подписка теперь действует до <b>{expire_at}</b>.
  completed_access_ended: |-
    ↩️ <b>Возврат {amount} оформлен</b>

    Деньги вернутся тем же способом, которым вы платили: звёзды — сразу на баланс Telegram, рубли — на счёт, срок зачисления зависит от банка. Доступ отключён. Захотите вернуться — оформите подписку в «💳 Тарифы».

# Перенос подписки на другой аккаунт (делает администратор); {expire_at} — срок по Москве
transfer:
  received: |-
    ✅ <b>Подписка перенесена на этот аккаунт</b>

    Действует до <b>{expire_at}</b>. Ссылка подписки у этого аккаунта своя: нажмите «🚀 Подключиться» и добавьте её на устройства.

# Администратор выдал дни вручную; {days} — «30 дней», {expire_at} — новый срок по Москве
manual_grant:
  added: |-
    🎁 <b>Вам добавили {days}</b>

    Подписка действует до <b>{expire_at}</b>. Ссылка подписки прежняя — если прокси уже настроен, ничего делать не нужно.

# Извинение после сбоя; {amount} — подарок, например «1 день 3 часа», {until} — новый срок
compensation:
  extended: |-
    <b>🙏 Простите за перебои</b>

    Недавно у нас был сбой, и прокси какое-то время работал с перебоями. В качестве извинения мы добавили к вашей подписке {amount} — теперь она действует до <b>{until}</b>.

    Сейчас всё работает, ничего делать не нужно.
  # клиент в льготном периоде: подарок продлевает льготные дни; {until} — их новый конец
  grace_extended: |-
    <b>🙏 Простите за перебои</b>

    Недавно у нас был сбой, и прокси какое-то время работал с перебоями. В качестве извинения мы продлили ваши льготные дни на {amount} — доступ сохранится до <b>{until}</b>.

    Чтобы прокси работал и дальше, продлите подписку — ссылка останется прежней.
