# Тревоги о панели Remnawave: alert.<ключ>: title, threat, where (действие); по желанию what и causes — если у тревоги нет вида сбоя. Виды сбоя — в remnawave_failures.yaml
alert:
  # клиент нажал «🚀 Подключиться», а панель не ответила или не приняла токен
  remnawave_unavailable:
    title: Remnawave не отвечает
    threat: клиенты не получают ссылку подписки, оплаты и пробные не выдают доступ.
    where: клиент нажал «🚀 Подключиться», бот запрашивал его прокси-аккаунт в панели
  # то же в профиле: открыть профиль, устройства, удалить устройство, перевыпустить ссылку
  remnawave_profile:
    title: Remnawave не отвечает
    threat: клиенты не видят профиль и устройства, не могут удалить устройство или перевыпустить ссылку.
    where: клиент открыл профиль или нажал кнопку в нём, бот обращался к панели
  # клиент нажал «🎁 Попробовать бесплатно», а панель не ответила: пробный за ним, выдаст фоновая задача
  remnawave_trial:
    title: Remnawave не отвечает
    threat: новые клиенты не получают пробный сразу — бот выдаст его сам и пришлёт ссылку, когда панель ответит.
    where: клиент нажал «🎁 Попробовать бесплатно», бот искал или создавал его прокси-аккаунт в панели
  # бот запустился, а панель не ответила на проверку версии: бот работает без панели
  remnawave_at_start:
    title: Remnawave не ответила при запуске бота
    threat: меню и инструкции работают, а ссылки подписки, пробные и выдача доступа после оплаты — нет, пока панель не ответит.
    where: бот запускался и проверял версию панели
  # панель не приняла токен или у неё другая основная версия: бот не запускается;
  # {minutes} — через сколько минут бот выйдет, systemd его перезапустит и тревога повторится
  remnawave_start_refused:
    title: Бот не запустился — панель Remnawave его не пустила
    threat: бот не работает совсем — клиенты не могут ни подключиться, ни заплатить. Через {minutes} мин бот выйдет, systemd перезапустит его, и при той же ошибке тревога придёт снова.
    where: бот запускался и проверял версию панели
  # фоновая сверка не получила данные из панели (не ответила или не приняла токен); {part} — аккаунты или ноды
  reconcile_unavailable:
    title: Remnawave не отвечает
    threat: бот не видит окончания сроков и сбои нод, пока панель не ответит; следующая сверка догонит пропущенное.
    where: фоновая сверка с Remnawave (раз в 5 минут) читала {part}
  # панель ответила, но сверка не прошла; что случилось — из ошибки; {part} — аккаунты или ноды
  reconcile_error:
    title: Сверка с Remnawave не прошла
    threat: бот не видит окончания сроков и сбои нод; следующая сверка через 5 минут попробует снова.
    where: фоновая сверка с Remnawave (раз в 5 минут) читала {part}
    causes:
      - cause: Панель обновили, и она отвечает на запрос списка не так, как ждёт бот
        check: версия панели (<code>docker inspect remnawave</code>, поле Image), журнал бота — <code>journalctl -u tsproxy --since "15 min ago" | grep Сверка</code>
      - cause: Ошибка в самом боте
        check: трассировка в журнале бота за это время — <code>journalctl -u tsproxy --since "15 min ago"</code>
  # при сверке упали обработчики аккаунтов; {count} — сколько раз
  reconcile_failed:
    title: Сверка с Remnawave — ошибки при обработке клиентов
    what: обработчики упали {count} раз(а)
    threat: у части клиентов не обработаны окончание срока, льготный период или напоминания; следующая сверка повторит.
    where: фоновая сверка с Remnawave передавала аккаунты клиентов обработчикам
    causes:
      - cause: Ошибка в коде обработчика бота
        check: <code>journalctl -u tsproxy --since "15 min ago" | grep "упал на клиенте"</code> — какой обработчик, какой клиент, трассировка ниже
      - cause: База бота занята или кончилось место
        check: в той же трассировке ошибки SQLite (database is locked, disk full), <code>df -h</code>
  # нода потеряла связь с панелью; {name} — имя ноды, {since} — с какого момента, {status} — что сообщает панель
  node_down:
    title: Нода «{name}» потеряла связь с панелью
    what: "панель не видит ноду с {since}; сообщение панели: {status}"
    # когда панель не сообщила причину — вместо {status}
    no_status: нет
    threat: клиенты на этой ноде могут быть без доступа.
    where: панель сообщила о ноде (вебхук или сверка раз в 5 минут)
    causes:
      - cause: Нода или её сервер перезапускается (обновление, перезагрузка, нехватка памяти); обычно ненадолго, дальше придёт «связь восстановлена»
        check: на сервере ноды <code>docker ps</code> (сколько работает контейнер ноды), <code>docker logs --tail 100</code> контейнера ноды, <code>uptime</code>
      - cause: Файрвол на сервере ноды не пускает панель (сменился адрес основного сервера или сбросили правила)
        check: на сервере ноды <code>ufw status</code> — открыт ли порт ноды для нынешнего адреса основного сервера
      - cause: Xray на ноде не стартует из-за конфига (правили профили, сертификаты, Reality)
        check: сообщение панели выше, <code>docker logs</code> ноды; что меняли в профилях перед сбоем
      - cause: Сеть между серверами у хостера
        check: с основного сервера <code>nc -zv</code> на адрес и порт ноды (из панели)
  # связь с нодой восстановилась; {minutes} — длительность простоя, {since}–{until} — когда
  node_restored:
    title: Нода «{name}» — связь восстановлена
    what: простой — {minutes} мин (с {since} по {until})
    threat: клиенты на ноде снова с доступом; долгий простой — повод для компенсации.
    where: панель сообщила о ноде (вебхук или сверка раз в 5 минут)
  # вебхук Remnawave с неверной подписью
  remnawave_webhook_forged:
    title: Отклонён вебхук Remnawave с неверной подписью
    what: подпись в заголовке X-Remnawave-Signature не совпала или её нет — бот ответил 403
    threat: если это настоящие вебхуки панели, бот узнаёт о событиях только из сверки раз в 5 минут — с опозданием.
    where: на адрес вебхуков Remnawave пришёл запрос
    causes:
      - cause: Адрес вебхука вызвал посторонний, например сканер (если тревога единичная, а настоящие вебхуки проходят)
        check: в журнале бота рядом есть успешные «Вебхук Remnawave …»; Cloudflare → Security → Events по пути /remnawave/webhook
      - cause: Секреты у панели и у бота разные — правили .env панели, переезжали или восстанавливали (если тревога на каждое событие)
        check: сравнить WEBHOOK_SECRET_HEADER в .env панели и REMNAWAVE_WEBHOOK_SECRET бота по хэшу (<code>sha256sum</code>), значения в чат не выводить; после правки перезапустить панель
      - cause: Панель после обновления подписывает тело иначе
        check: заметки к выпуску панели, если тревоги начались сразу после обновления

# что читала сверка — для {part} в reconcile_unavailable и reconcile_error
reconcile_parts:
  accounts: аккаунты клиентов
  nodes: ноды
