# Тревоги в теме «🚨 Тревоги»
alerts:
  # начало каждой тревоги в теме «🚨 Тревоги»
  prefix: "🚨 "
  # сводка повторов; {count} — повторов после первой, {minutes} — окно, {text} — первая тревога
  repeated: |-
    Повторов за {minutes} мин после первой тревоги: {count}
    {text}
  # клиент нажал «🚀 Подключиться», а панель Remnawave не ответила
  remnawave_unavailable: "Remnawave не отвечает: клиенты не могут открыть «Подключиться»."
  # бот запустился, но панель Remnawave не ответила на проверку версии
  remnawave_at_start: "Remnawave не ответила при запуске бота. Меню работает, подписки — нет."
  # клиент выбрал тариф, а платёжка не создала платёж
  payments_unavailable: "Платёжка не отвечает: клиенты не могут получить ссылку на оплату."
  # бот запущен с PAYMENTS_MODE=off — тестовый запуск без платёжки
  payments_off: "Оплата выключена (PAYMENTS_MODE=off): клиенты видят тарифы, но купить не могут — доступен только пробный. Перед открытием продаж подключите платёжку и перезапустите бота."
  # ошибка в обработчике бота; {error} — тип ошибки, подробности — в логе сервера
  bot_error: "Ошибка в боте: {error}. Подробности — в логе сервера."
  # бот не смог создать тему обращения; {error} — ответ Telegram
  support_topic_failed: |-
    Не получилось создать тему для обращения #{ticket_id}: {error}. Проверьте, что в группе включены темы, а у бота есть право «Управление темами». Клиенту ответили «попробуйте позже».
  # вебхук Remnawave с неверной подписью — подделка или разные секреты у панели и бота
  remnawave_webhook_forged: "Отклонён вебхук Remnawave с неверной подписью. Если повторяется — проверьте, что WEBHOOK_SECRET_HEADER панели совпадает с REMNAWAVE_WEBHOOK_SECRET бота."
  # сверка с Remnawave не смогла прочитать аккаунты или ноды, панель не отвечает
  reconcile_unavailable: "Сверка с Remnawave не прошла: панель не отвечает. Пропущенные окончания сроков и сбои нод догоним при следующей сверке."
  # панель ответила, но сверка не прошла; {error} — тип ошибки, подробности в логе
  reconcile_error: "Сверка с Remnawave не прошла: {error}. Подробности — в логе сервера."
  # при сверке упали обработчики; {count} — сколько раз, подробности в логе
  reconcile_failed: "Сверка с Remnawave: ошибок при обработке клиентов — {count}. Подробности — в логе сервера, следующая сверка повторит."
  # нода потеряла связь с панелью; {name} — имя ноды, {since} — с какого момента
  node_down: "Нода «{name}» потеряла связь с панелью (с {since}). Клиенты на ней могут быть без доступа."
  # связь с нодой восстановилась; {minutes} — длительность простоя в минутах
  node_restored: "Нода «{name}»: связь восстановлена. Простой — {minutes} мин (с {since} по {until})."
  # сумма оплаты не совпала с ценой тарифа; {amount} — оплачено, {price} — цена, ₽
  payment_amount_mismatch: "Заказ #{order_id}: оплачено {amount} ₽ вместо {price} ₽. Срок пересчитан пропорционально оплате (+2 часа), клиенту отправлено извинение. Проверьте платёжку."
  # оплата подтверждена, но не записалась в базу и после повторов; {payment_id} — платёж
  payment_not_recorded: "Оплата {payment_id} по заказу #{order_id} подтверждена платёжкой, но не записалась в базу ({error}). Проверка оплат попробует ещё раз; если заказ так и не станет оплаченным — засчитайте вручную."
  # уведомление об оплате без заказа или неразборчивое; повторы склеиваются
  payment_notification_forged: "Пришло уведомление об оплате, которому нет заказа (или его не разобрать). К платёжке не обращались, ничего не засчитано — скорее всего, подделка; повторы склеиваются в одну запись журнала. Если это была настоящая оплата, фоновая проверка найдёт её сама."
  # платёжка говорит «оплачено», но платёж не сходится с заказом; {reason} — что не сошлось
  payment_rejected: "Заказ #{order_id}: платёж {payment_id} не засчитан — {reason}. Проверьте платёж в кабинете платёжки и при необходимости выдайте доступ вручную."
  # фоновая проверка оплат не достучалась до платёжки
  payment_checks_unavailable: "Проверка оплат: платёжка не отвечает. Оплаты с потерянными уведомлениями засчитаем, когда она ответит."
  # ежедневная сверка с платёжкой нашла расхождения; ниже — строки payments.reconcile.*
  payments_reconcile: "Сверка оплат с платёжкой за сутки: расхождений — {count}."
  # ежедневная сверка не достучалась до платёжки
  payments_reconcile_unavailable: "Сверка оплат с платёжкой не прошла: платёжка не отвечает. Повторим завтра."
  # платёжка ответила на сверку отказом или не тем форматом; {error} — что ответила
  payments_reconcile_failed: "Сверка оплат с платёжкой не прошла: {error}. Повторим завтра; если повторяется — проверьте ключи Platega и сверьте оплаты в кабинете вручную."
  # платёжка отказала создать платёж; {error} — её ответ, клиенту — «сервис не отвечает»
  payment_create_rejected: "Платёжка отказала создать платёж: {error}. Клиенты не могут получить ссылку на оплату по СБП (звёзды работают)."
  # платёжка отказала в проверке оплаты (например, неверные ключи); {error} — её ответ
  payment_check_refused: "Платёжка отказала в проверке оплаты: {error}. Проверьте PLATEGA_MERCHANT_ID и PLATEGA_SECRET. Оплаты засчитаем, когда она снова ответит."
  # спор через банк (не наш возврат); {access} — chargeback_access.*, клиент и заказ — как в оплатах
  payment_chargeback: |-
    Спор через банк: деньги по заказу #{order_id} ({amount} ₽, платёж <code>{payment_id}</code>) возвращены плательщику — бот их не возвращал.
    Клиент: {name}, @username: {username}, Telegram ID: <code>{telegram_id}</code> — карточка: /client {telegram_id}
    {access} Клиенту отправлено сообщение. Доказательства оказания услуги — /proof {order_id}; за проигранный спор Platega штрафует.
  # со срока снимаются только дни этой оплаты; {expire_at} — новый срок
  chargeback_access:
    shortened: Со срока сняты дни этой оплаты — подписка теперь до {expire_at}, другие оплаченные дни остались.
    ended: Со срока сняты дни этой оплаты — осталось меньше суток, доступ отключён.
    no_account: Прокси-аккаунта у клиента нет — снимать нечего.
    # {error} — ответ панели
    failed: "⚠️ Снять дни не вышло ({error}) — снимите вручную в Remnawave дни этой оплаты (останется меньше суток — отключите доступ)."
  # возврат сделан не через бота (в кабинете платёжки): доступ не тронут
  payment_refunded_outside_bot: |-
    Деньги по заказу #{order_id} ({amount} ₽, платёж <code>{payment_id}</code>) возвращены через кабинет платёжки, а не через бота.
    Клиент: {name}, @username: {username}, Telegram ID: <code>{telegram_id}</code> — карточка: /client {telegram_id}
    Доступ не тронут: если возврат был за неиспользованные дни, укоротите подписку вручную.
  # любой другой неожиданный статус; {was}, {now} — payments.status.* (и имя статуса у платёжки)
  payment_status_changed: |-
    Статус оплаты неожиданно изменился: был «{was}», стал «{now}». Заказ #{order_id} ({amount} ₽, платёж <code>{payment_id}</code>).
    Клиент: {name}, @username: {username}, Telegram ID: <code>{telegram_id}</code> — карточка: /client {telegram_id}
    Бот ничего не менял — проверьте платёж в кабинете платёжки.
  # возврат больше суток на проверке у платёжки; {request_id} — возврат, {hours} — сколько ждём
  refund_review_overdue: "Возврат №{request_id} (заказ #{order_id}, {amount}) уже {hours} ч на проверке у платёжки, деньги клиенту не вернулись. Проверьте возврат в кабинете Platega: если отказан — верните вручную и укоротите подписку."
  # доступ по оплате не выдан за 30 минут повторов; {error} — ошибка панели
  grant_delayed: "Заказ #{order_id} (клиент {telegram_id}) оплачен, но доступ не выдан уже 30 минут: {error}. Бот повторяет раз в 10 минут до суток."
  # повторы выдачи кончились (сутки)
  grant_failed: "Заказ #{order_id} (клиент {telegram_id}) оплачен, но доступ не выдан за сутки: {error}. Повторы остановлены — выдайте доступ вручную."
  # панель отклонила выдачу, повтор не поможет
  grant_manual: "Заказ #{order_id} (клиент {telegram_id}) оплачен, но выдать доступ автоматически нельзя: {error}. Выдайте доступ вручную."
  # администратор выключил или включил пробные; {admin_id} — его Telegram ID
  trials_disabled: "⏸ Пробные выключены администратором {admin_id}. Новые клиенты не видят «🎁 Попробовать бесплатно»; уже выданные пробные работают. Включить — /trials."
  trials_enabled: "▶️ Пробные снова включены администратором {admin_id}."
  # бот выключил пробные сам; {count} — новых пробных за {minutes} мин
  trials_spam: "Похоже на спам: {count} пробных за {minutes} мин. Пробные выключены и сами не включатся. Проверьте новых клиентов; включить — /trials → «▶️ Включить пробные»."
  # плашка на сайте изменена; {banner} — из admin.site_banner.names
  site_banner_set: "🪧 Плашка на сайте ts-proxy.com: {banner}. Изменил администратор {admin_id}. Поменять — /banner."
  # возвраты; {request_id} — возврат, {amount} — «150 ₽» или «100 ⭐», {error} — ответ платёжки или панели
  refund_provider_unavailable: "Возврат №{request_id} (заказ #{order_id}, {amount}): платёжка не ответила ({error}). Бот повторяет раз в минуту, второй раз деньги не вернутся."
  refund_provider_rejected: "Возврат №{request_id} (заказ #{order_id}, {amount}): платёжка отказала — {error}. Деньги не возвращены, срок не укорочен. Оплату можно попробовать вернуть ещё раз или вручную в кабинете платёжки."
  refund_term_pending: "Возврат №{request_id} (заказ #{order_id}): {amount} возвращены, а срок не укорочен — панель: {error}. Бот повторяет раз в минуту; пока не укоротит, у клиента лишние дни."
  refund_term_changed: "Возврат №{request_id} (заказ #{order_id}): срок клиента изменился после расчёта (сейчас {error}). Укорачиваем от нынешнего срока — проверьте клиента."
  # оплата звёздами не засчитана; {payload} — заказ из счёта, {reason} — stars_reason.*, {error} — Telegram
  stars_returned: "Оплата звёздами: {stars} ⭐ от клиента <code>{telegram_id}</code> (счёт «{payload}») не засчитана — {reason}. Звёзды возвращены клиенту автоматически."
  stars_not_returned: "Оплата звёздами: {stars} ⭐ от клиента <code>{telegram_id}</code> (счёт «{payload}», платёж <code>{charge_id}</code>) не засчитана — {reason}. Вернуть звёзды автоматически не вышло: {error}. Разберитесь: выдайте доступ вручную или верните звёзды."
  # оплата звёздами пришла, а база бота не ответила: заказ не засчитан и звёзды не возвращены
  stars_unrecorded: "Оплата звёздами: {stars} ⭐ от клиента <code>{telegram_id}</code> (счёт «{payload}», платёж <code>{charge_id}</code>) не записана — база бота не ответила. Клиенту сказали, что доступ выдадут вручную: выдайте доступ или верните звёзды."
  stars_reason:
    unknown_order: такого заказа звёздами у этого клиента нет
    other_charge: заказ уже оплачен другим платежом
    not_credited: оплату не удалось засчитать
  # перенос подписки: новый аккаунт подписку получил, старый не отключился
  transfer_source_not_ended: "Перенос подписки с {from_id} на {to_id}: новый аккаунт получил подписку до {expire_at}, а старый не отключён — {error}. Отключите старый вручную."
  # компенсация прервалась целиком; {run_id} — номер, {error} — тип ошибки, подробности в логе
  compensation_failed: "Компенсация #{run_id} прервалась: {error}. Подробности — в логе сервера. Нажмите «Компенсировать» ещё раз — бот продолжит с того же места и никому не начислит дважды."
  # сторож фоновых задач; {since} — последний успех или запуск бота, {hint} — job_hint_*
  job_stale: "Фоновая задача «{name}» не отрабатывает: последний успешный запуск — {since}. {hint}"
  job_stale_never: "Фоновая задача «{name}» ни разу не отработала с запуска бота ({since}). {hint}"
  job_hint_running: "Выполняется с {since} — похоже, зависла."
  job_hint_failing: "Падает с ошибкой или не запускается — подробности в логе сервера."
  job_recovered: "Фоновая задача «{name}» снова работает."
  # бэкап панели Remnawave (ops/remnawave-backup); {since} — последняя копия или panel_backup_never
  panel_backup_stale: "Бэкап панели Remnawave: нет свежей копии больше 26 часов (последняя — {since}). Проверьте cron и журнал скрипта на сервере."
  panel_backup_never: "ни одной копии"
  # {copy} — путь к копии на сервере
  panel_backup_not_sent: "Бэкап панели Remnawave: копия на сервере есть ({copy}), но в Telegram не ушла."
  # журнал или папку копий не прочитать; {error} — ошибка
  panel_backup_unreadable: "Бэкап панели Remnawave: бот не может прочитать журнал или папку копий ({error}). Проверьте права доступа на сервере."
