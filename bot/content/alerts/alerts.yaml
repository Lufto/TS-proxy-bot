# Тревоги в теме «🚨 Тревоги»
alerts:
  # начало каждой тревоги в теме «🚨 Тревоги»
  prefix: "🚨 "
  # сводка повторов; {count} — повторов после первой, {minutes} — окно, {text} — первая тревога,
  # {causes} — строки repeated_cause (каждая с новой строки), если «что случилось» за окно было разным, иначе пусто
  repeated: |-
    Повторов за {minutes} мин после первой тревоги: {count}{causes}
    {text}
  # строка сводки: {count} — сколько повторов с этим «что случилось», {cause} — что случилось
  repeated_cause: "×{count} — {cause}"
  # остальные причины, не влезшие в предел Telegram; {count} — сколько повторов на них
  repeated_other: "×{count} — другие причины"
  # бот не смог создать тему обращения; {error} — ответ Telegram
  support_topic_failed: |-
    Не получилось создать тему для обращения #{ticket_id}: {error}. Проверьте, что в группе включены темы, а у бота есть право «Управление темами». Клиенту ответили «попробуйте позже».
  # со срока снимаются только дни этой оплаты; {expire_at} — новый срок
  chargeback_access:
    shortened: Со срока сняты дни этой оплаты — подписка теперь до {expire_at}, другие оплаченные дни остались.
    ended: Со срока сняты дни этой оплаты — осталось меньше суток, доступ отключён.
    no_account: Прокси-аккаунта у клиента нет — снимать нечего.
    # {error} — ответ панели
    failed: "⚠️ Снять дни не вышло ({error}) — снимите вручную в Remnawave дни этой оплаты (останется меньше суток — отключите доступ)."
  # администратор выключил или включил пробные; {admin_id} — его Telegram ID
  trials_disabled: "⏸ Пробные выключены администратором {admin_id}. Новые клиенты не видят «🎁 Попробовать бесплатно»; уже выданные пробные работают. Включить — /trials."
  trials_enabled: "▶️ Пробные снова включены администратором {admin_id}."
  # бот выключил пробные сам; {count} — новых пробных за {minutes} мин
  trials_spam: "Похоже на спам: {count} пробных за {minutes} мин. Пробные выключены и сами не включатся. Проверьте новых клиентов; включить — /trials → «▶️ Включить пробные»."
  # сторож фоновых задач; {since} — последний успех или запуск бота, {hint} — job_hint_*
  job_stale: "Фоновая задача «{name}» не отрабатывает: последний успешный запуск — {since}. {hint}"
  job_stale_never: "Фоновая задача «{name}» ни разу не отработала с запуска бота ({since}). {hint}"
  job_hint_running: "Выполняется с {since} — похоже, зависла."
  job_hint_failing: "Падает с ошибкой или не запускается — подробности в логе сервера."
  job_recovered: "Фоновая задача «{name}» снова работает."
  # бэкап панели Remnawave (ops/remnawave-backup); {since} — последняя копия или panel_backup_never
  panel_backup_stale: "Бэкап панели Remnawave: нет свежей копии больше 26 часов (последняя — {since}). Проверьте cron и журнал скрипта на сервере."
  panel_backup_never: "ни одной копии"
  # {copy} — путь к копии на сервере
  panel_backup_not_sent: "Бэкап панели Remnawave: копия на сервере есть ({copy}), но в Telegram не ушла."
  # журнал или папку копий не прочитать; {error} — ошибка
  panel_backup_unreadable: "Бэкап панели Remnawave: бот не может прочитать журнал или папку копий ({error}). Проверьте права доступа на сервере."
