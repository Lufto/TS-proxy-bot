# Тревоги об оплатах: alert.<ключ> — как в remnawave.yaml; виды сбоя платёжки — в payments_failures.yaml
alert:
  # клиент выбрал способ оплаты, а платёжка не ответила
  payments_unavailable:
    title: Платёжка не отвечает
    threat: "клиенты не могут получить ссылку на оплату по СБП (звёзды работают)."
    where: "клиент выбрал тариф и способ оплаты, бот готовил оплату"
  # клиент нажал «🔄 Проверить оплату», а платёжка не ответила
  payment_check_button_unavailable:
    title: Платёжка не отвечает
    threat: "клиент не узнал, прошла ли оплата; если прошла — фоновая проверка засчитает её сама."
    where: "клиент нажал «🔄 Проверить оплату» по заказу #{order_id}"
  # фоновая проверка оплат не достучалась до платёжки
  payment_checks_unavailable:
    title: Платёжка не отвечает
    threat: "оплаты с потерянными уведомлениями не засчитываются, пока платёжка не ответит; потом засчитаем сами."
    where: "фоновая проверка оплат (свежие заказы — раз в 2 минуты, старые — раз в 30)"
  # платёжка отказала создать платёж
  payment_create_rejected:
    title: Платёжка отказала создать платёж
    threat: "клиенты не могут получить ссылку на оплату по СБП (звёзды работают); повтор не поможет, пока не исправить причину."
    where: "клиент выбрал тариф и способ оплаты, бот создавал платёж"
  # платёжка отказала в проверке платежа заказа
  payment_check_refused:
    title: "Платёжка отказала в проверке оплаты заказа #{order_id}"
    threat: "оплату этого заказа бот не засчитает, пока платёжка не ответит; если причина в ключах — так же со всеми заказами."
    where: "бот перепроверял у платёжки платёж заказа #{order_id} (уведомление, кнопка или фоновая проверка)"
  # уведомление об оплате без заказа или неразборчивое; {reason} — forged_reason.*
  payment_notification_forged:
    title: Уведомление об оплате, которому не верим
    what: "{reason}; к платёжке не обращались, ничего не засчитано, повторы склеиваются в одну запись журнала"
    threat: "если это была настоящая оплата, фоновая проверка найдёт её сама; если подделка — вреда нет."
    where: "на адрес уведомлений платёжки пришёл запрос"
    causes:
      - cause: "Адрес уведомлений вызвал посторонний, например сканер (если тревога единичная)"
        check: "Cloudflare → Security → Events и Analytics по пути /payments/notification; IP в журнале бота — адрес туннеля, настоящий — в заголовке CF-Connecting-IP"
      - cause: "Ключи в кабинете Platega сменили, а в .env бота старые (если тревога при каждой оплате)"
        check: "«Настройки» в кабинете Platega против PLATEGA_MERCHANT_ID и PLATEGA_SECRET в .env, значения в чат не выводить"
      - cause: "Настоящий платёж мимо бота: ссылку создали вручную в кабинете или на том же магазине другой проект"
        check: "номер платежа из журнала бота — в кабинете Platega"
  # оплата подтверждена, но не записалась в базу и после повторов
  payment_not_recorded:
    title: "Оплата заказа #{order_id} не записалась в базу"
    threat: "платёж {payment_id} подтверждён платёжкой, а клиент без доступа; проверка оплат попробует ещё раз, если заказ так и не станет оплаченным — засчитайте вручную."
    where: "бот засчитывал оплату заказа #{order_id} (3 попытки записи)"
    causes:
      - cause: "База бота занята или кончилось место на диске"
        check: "<code>df -h</code>, в журнале бота — database is locked, disk full"
      - cause: "Ошибка в боте при записи"
        check: "трассировка в журнале бота — <code>journalctl -u tsproxy --since \"15 min ago\" | grep -A40 \"не записалась\"</code>"
  # платёжка говорит «оплачено», но платёж не сходится с заказом; {reason} — что не сошлось
  payment_rejected:
    title: "Заказ #{order_id}: платёж не засчитан"
    what: "платёж <code>{payment_id}</code> — {reason}"
    threat: "клиент мог заплатить и остаться без доступа."
    where: "бот перепроверял у платёжки платёж заказа #{order_id}"
    causes:
      - cause: "Тестовый платёж в бою или настоящий на тестовом стенде"
        check: "PLATEGA_TEST_ACCOUNT в .env, кабинет, где создан платёж"
      - cause: "Платёж из другого кабинета Platega (после смены ключей с тестовых на боевые)"
        check: "номер платежа в обоих кабинетах"
      - cause: "Сумма, валюта или заказ в платеже не сходятся с заказом"
        check: "платёж в кабинете Platega; если клиент действительно заплатил — выдайте доступ вручную (/client)"
  # сумма оплаты не совпала с ценой тарифа; {amount} — оплачено, {price} — цена, ₽
  payment_amount_mismatch:
    title: "Заказ #{order_id}: оплачено не столько, сколько стоит тариф"
    what: "оплачено {amount} ₽ вместо {price} ₽; срок пересчитан пропорционально оплате (+2 часа), клиенту отправлено извинение"
    threat: "клиент получил меньше дней, чем ждал, — может написать в поддержку."
    where: "бот засчитывал оплату заказа #{order_id}"
    causes:
      - cause: "Цену тарифа поменяли, пока ссылка на оплату была жива"
        check: "история config/tariffs.yaml, время создания заказа"
      - cause: "Платёжка списала другую сумму (комиссия, частичная оплата)"
        check: "платёж в кабинете Platega"
  # ежедневная сверка с платёжкой нашла расхождения; {issues} — строки payments.reconcile.*
  payments_reconcile:
    title: Сверка оплат с платёжкой нашла расхождения
    what: "расхождений — {count}:\n{issues}"
    threat: "возможно, кто-то заплатил и остался без доступа, или доступ выдан без оплаты."
    where: "ежедневная сверка оплат за сутки (09:00 МСК)"
    causes:
      - cause: "Уведомление потерялось, а фоновая проверка ещё не догнала"
        check: "карточку клиента /client — засчитался ли заказ к этому времени"
      - cause: "Платёж мимо бота: ссылку создали вручную в кабинете Platega"
        check: "платёж в кабинете Platega, журнал действий кабинета"
  # ежедневная сверка не прошла: платёжка не ответила или отказала
  payments_reconcile_failed:
    title: Сверка оплат с платёжкой не прошла
    threat: "расхождения за сутки не проверены; повторим завтра, а при повторах сверьте оплаты в кабинете вручную."
    where: "ежедневная сверка оплат за сутки (09:00 МСК) выгружала платежи"
  # спор через банк (не наш возврат); {access} — chargeback_access.*, клиент и заказ — как в оплатах
  payment_chargeback:
    title: "Спор через банк: заказ #{order_id}"
    what: |-
      деньги ({amount} ₽, платёж <code>{payment_id}</code>) возвращены плательщику — бот их не возвращал.
      Клиент: {name}, @username: {username}, Telegram ID: <code>{telegram_id}</code> — карточка: /client {telegram_id}
      {access} Клиенту отправлено сообщение.
    threat: "деньги ушли плательщику; за проигранный спор Platega штрафует."
    where: "платёжка сообщила новый статус платежа (уведомление, проверка или сверка)"
    causes:
      - cause: "Плательщик оспорил платёж через свой банк"
        check: "платёж в кабинете Platega (был ли перед этим DISPUTED), доказательства оказания услуги — /proof {order_id}"
      - cause: "Платили чужим счётом — банк вернул деньги владельцу"
        check: "историю клиента — /client {telegram_id}: новый ли, были ли ещё оплаты"
      - cause: "Деньги вернул кто-то из наших в кабинете Platega, а признаки похожи на спор"
        check: "журнал действий в кабинете Platega"
  # возврат сделан не через бота (в кабинете платёжки): доступ не тронут
  payment_refunded_outside_bot:
    title: "Заказ #{order_id}: деньги возвращены мимо бота"
    what: |-
      деньги ({amount} ₽, платёж <code>{payment_id}</code>) возвращены через кабинет платёжки, а не через бота.
      Клиент: {name}, @username: {username}, Telegram ID: <code>{telegram_id}</code> — карточка: /client {telegram_id}
    threat: "доступ не тронут: если возврат был за неиспользованные дни, у клиента лишние дни — укоротите подписку вручную."
    where: "платёжка сообщила новый статус платежа (уведомление, проверка или сверка)"
    causes:
      - cause: "Кто-то из наших вернул деньги в кабинете Platega"
        check: "журнал действий в кабинете Platega; возвраты надёжнее делать кнопкой «↩️ Вернуть» в боте"
  # любой другой неожиданный статус; {was}, {now} — payments.status.* (и имя статуса у платёжки)
  payment_status_changed:
    title: "Заказ #{order_id}: статус оплаты неожиданно изменился"
    what: |-
      был «{was}», стал «{now}»; {amount} ₽, платёж <code>{payment_id}</code>.
      Клиент: {name}, @username: {username}, Telegram ID: <code>{telegram_id}</code> — карточка: /client {telegram_id}
    threat: "бот ничего не менял — доступ и деньги могут не соответствовать статусу."
    where: "платёжка сообщила новый статус платежа (уведомление, проверка или сверка)"
    causes:
      - cause: "Платёж оспаривают (DISPUTED) — дальше может прийти спор через банк"
        check: "платёж в кабинете Platega"
      - cause: "Platega завела новый статус, которого бот не знает"
        check: "имя статуса в скобках выше, документация Platega о статусах"
  # бот запущен с PAYMENTS_MODE=off — тестовый запуск без платёжки
  payments_off:
    title: Оплата выключена
    what: "бот запущен с PAYMENTS_MODE=off"
    threat: "клиенты видят тарифы, но купить не могут — доступен только пробный."
    where: "бот запускался"
    causes:
      - cause: "Так задумано до открытия продаж"
        check: "перед открытием продаж — PAYMENTS_MODE=platega и боевые ключи в .env, затем <code>systemctl restart tsproxy</code>"
  # доступ по оплате не выдан за 30 минут повторов
  grant_delayed:
    title: "Заказ #{order_id} оплачен, а доступ не выдан уже 30 минут"
    threat: "клиент {telegram_id} заплатил и ждёт доступ; бот повторяет раз в 10 минут до суток, клиенту написали о задержке."
    where: "выдача доступа после оплаты заказа #{order_id}"
    # причины — по виду сбоя панели; эти — когда вида нет (аккаунта в панели нет)
    causes:
      - cause: "Аккаунт клиента удалили в панели вручную"
        check: "аккаунт клиента в панели Remnawave; выдайте доступ вручную (/client {telegram_id})"
  # повторы выдачи кончились (сутки)
  grant_failed:
    title: "Заказ #{order_id} оплачен, а доступ не выдан за сутки"
    threat: "клиент {telegram_id} заплатил и остался без доступа; повторы остановлены — выдайте доступ вручную (/client {telegram_id})."
    where: "выдача доступа после оплаты заказа #{order_id}"
    # причины — по виду сбоя панели; эти — когда вида нет (аккаунта в панели нет)
    causes:
      - cause: "Аккаунт клиента удалили в панели вручную"
        check: "аккаунт клиента в панели Remnawave; выдайте доступ вручную (/client {telegram_id})"
  # панель отклонила выдачу, повтор не поможет
  grant_manual:
    title: "Заказ #{order_id} оплачен, а выдать доступ автоматически нельзя"
    threat: "клиент {telegram_id} заплатил и без доступа, пока его не выдадут вручную (/client {telegram_id})."
    where: "выдача доступа после оплаты заказа #{order_id}"
    causes:
      - cause: "Панель отклонила запрос: аккаунт в неожиданном состоянии (удалён, выключен вручную, чужой)"
        check: "аккаунт клиента в панели Remnawave"
      - cause: "Ошибка в боте при выдаче"
        check: "журнал бота по заказу — <code>journalctl -u tsproxy | grep \"Заказ {order_id}\"</code>"

# почему уведомлению об оплате не верим (для payment_notification_forged)
forged_reason:
  unparsed: "уведомление не разобрано или в нём не наши ключи"
  unknown_payment: "заказа с таким платежом у бота нет"
