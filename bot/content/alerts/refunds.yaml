# Тревоги о возвратах и звёздах: alert.<ключ> — как в remnawave.yaml.
# Возврат: {request_id} — номер возврата, {order_id} — заказ, {amount} — «150 ₽» или «100 ⭐»
alert:
  # платёжка не ответила на возврат; бот повторяет раз в минуту
  refund_provider_unavailable:
    title: "Возврат №{request_id} (заказ #{order_id}, {amount}) — платёжка не отвечает"
    threat: "деньги клиенту ещё не вернулись; бот повторяет раз в минуту, второй раз деньги не уйдут."
    where: "бот отправлял возврат №{request_id} в платёжку"
  # платёжка отказала в возврате; что случилось — её ответ или {reason}
  refund_provider_rejected:
    title: "Возврат №{request_id} (заказ #{order_id}, {amount}) — платёжка отказала"
    what: "{reason}"
    threat: "деньги не возвращены, срок не укорочен; оплату можно попробовать вернуть ещё раз или вручную в кабинете платёжки."
    where: "бот отправлял возврат №{request_id} в платёжку или ждал её решения"
    causes:
      - cause: "На балансе Platega не хватило денег на возврат"
        check: "баланс в кабинете Platega"
      - cause: "Платёжка отклонила возврат после проверки"
        check: "возврат в кабинете Platega; спросить поддержку Platega"
  # деньги вернулись, а срок не укорочен — панель не ответила; бот повторяет
  refund_term_pending:
    title: "Возврат №{request_id} (заказ #{order_id}): {amount} возвращены, а срок не укорочен"
    threat: "пока срок не укорочен, у клиента лишние дни; бот повторяет раз в минуту."
    where: "бот укорачивал срок клиента после возврата №{request_id}"
  # срок клиента изменили после расчёта возврата; {expire_at} — нынешний срок
  refund_term_changed:
    title: "Возврат №{request_id} (заказ #{order_id}): срок клиента изменился после расчёта"
    what: "сейчас подписка до {expire_at}; укорачиваем от нынешнего срока"
    threat: "клиент мог получить или потерять дни — проверьте его."
    where: "бот укорачивал срок клиента после возврата №{request_id}"
    causes:
      - cause: "Клиент оплатил ещё раз или администратор выдал дни, пока шёл возврат"
        check: "карточку клиента /client — оплаты и ручные выдачи за последние сутки"
  # возврат больше суток на проверке у платёжки; {hours} — сколько ждём
  refund_review_overdue:
    title: "Возврат №{request_id} (заказ #{order_id}, {amount}) уже {hours} ч на проверке у платёжки"
    what: "платёжка не ответила, одобрен ли возврат; деньги клиенту не вернулись"
    threat: "клиент ждёт деньги; если платёжка отказала молча — верните вручную и укоротите подписку."
    where: "фоновая проверка возвратов (раз в минуту)"
    causes:
      - cause: "Возврат завис на ручной проверке у Platega"
        check: "возврат в кабинете Platega; спросить поддержку Platega"
  # оплата звёздами не засчитана, звёзды возвращены; {stars}, {telegram_id}, {payload} — счёт, {reason} — stars_reason.*
  stars_returned:
    title: "Оплата звёздами не засчитана — звёзды возвращены"
    what: "{stars} ⭐ от клиента <code>{telegram_id}</code> (счёт «{payload}») — {reason}"
    threat: "клиент без доступа, но и без потери денег — звёзды вернулись автоматически."
    where: "Telegram прислал оплату звёздами"
    causes:
      - cause: "Клиент оплатил старый счёт, когда заказ уже оплачен или отменён"
        check: "заказы клиента — /client {telegram_id}"
  # то же, но вернуть звёзды не вышло; {charge_id} — платёж, {answer} — ответ Telegram
  stars_not_returned:
    title: "Оплата звёздами не засчитана и не возвращена"
    what: "{stars} ⭐ от клиента <code>{telegram_id}</code> (счёт «{payload}», платёж <code>{charge_id}</code>) — {reason}; вернуть не вышло: {answer}"
    threat: "клиент заплатил и без доступа — выдайте доступ вручную или верните звёзды."
    where: "Telegram прислал оплату звёздами"
    causes:
      - cause: "Telegram отказал в возврате или не ответил"
        check: "ответ Telegram выше; повторить возврат позже"
  # оплата звёздами пришла, а база бота не ответила
  stars_unrecorded:
    title: "Оплата звёздами не записана — база бота не ответила"
    what: "{stars} ⭐ от клиента <code>{telegram_id}</code> (счёт «{payload}», платёж <code>{charge_id}</code>)"
    threat: "звёзды списаны, а заказ не засчитан; клиенту сказали, что доступ выдадут вручную — выдайте доступ или верните звёзды."
    where: "Telegram прислал оплату звёздами, бот записывал её в базу"
    causes:
      - cause: "База бота занята или кончилось место на диске"
        check: "<code>df -h</code>, в журнале бота — database is locked, disk full"

# почему оплата звёздами не засчитана (для stars_returned и stars_not_returned)
stars_reason:
  unknown_order: такого заказа звёздами у этого клиента нет
  other_charge: заказ уже оплачен другим платежом
  not_credited: оплату не удалось засчитать
