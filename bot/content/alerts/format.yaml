# Части тревоги в «🚨 Тревоги» (заголовок — alerts.prefix + alert.<ключ>.title); {text} — уже готовый текст части
alert_format:
  what: "Что случилось: {text}"
  # {action} — alert.<ключ>.where, {source} — модуль и функция бота
  where: "Где заметили: {action} — <code>{source}</code>"
  threat: "Чем грозит: {text}"
  causes: "Куда смотреть (сначала самое вероятное):"
  # {number} — номер причины, {cause} и {check} — из failure.<вид>.causes
  cause: "{number}. {cause} — {check}"
  # ошибка без вида сбоя; {name} — тип ошибки, {error} — её текст
  error: "{name}: {error}"

# Предупреждение — ответ ⚠️ на действие администратора: что не вышло (сам текст предупреждения),
# почему и что делать. {text} — настоящая причина; {cause} и {check} — первая причина вида сбоя
warning_format:
  why: "Почему: {text}"
  todo: "Что делать: {cause} — {check}"
