# Тревоги о действиях администраторов: alert.<ключ> — как в remnawave.yaml
alert:
  # перенос подписки: новый аккаунт получил подписку, старый не отключился; {expire_at} — срок нового
  transfer_source_not_ended:
    title: "Перенос подписки с {from_id} на {to_id}: старый аккаунт не отключён"
    threat: "новый аккаунт получил подписку до {expire_at}, а старый всё ещё работает — у клиента две подписки. Отключите старый вручную."
    where: "администратор перенёс подписку (/transfer), бот отключал старый аккаунт"
    causes:
      - cause: "Аккаунт в панели в неожиданном состоянии"
        check: "аккаунт {from_id} в панели Remnawave"
  # компенсация прервалась целиком; {run_id} — номер
  compensation_failed:
    title: "Компенсация #{run_id} прервалась"
    threat: "часть клиентов ещё не получила компенсацию. Нажмите «Компенсировать» ещё раз — бот продолжит с того же места и никому не начислит дважды."
    where: "администратор нажал «🎁 Компенсировать», бот начислял дни в фоне"
    # причины — по виду сбоя, если он есть; эти — для ошибки без вида
    causes:
      - cause: "Ошибка в боте"
        check: "трассировка в журнале бота — <code>journalctl -u tsproxy | grep -A40 \"Компенсация #{run_id}\"</code>"
  # плашка на сайте изменена; {banner} — admin.site_banner.names.*
  site_banner_set:
    title: "🪧 Плашка на сайте ts-proxy.com изменена"
    what: "теперь: {banner}; изменил администратор {admin_id}"
    threat: "посетители сайта видят эту плашку, пока её не снимут — /banner."
    where: "администратор выбрал плашку (/banner или кнопка под тревогой)"
