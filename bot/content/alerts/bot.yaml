# Тревоги о самом боте: alert.<ключ> — как в remnawave.yaml
alert:
  # упал обработчик апдейта или фоновая задача; {action} — bot_error_action.*
  bot_error:
    title: Ошибка в боте
    threat: это действие не сработало; если это клиент — ему ответили «что-то пошло не так, попробуйте позже».
    where: "{action}"
    # вместо места в коде, когда в трассировке только код библиотек
    no_place: нашего кода в трассировке нет — ошибка внутри библиотеки
    causes:
      - cause: Ошибка в коде бота в этом месте
        check: полная трассировка в журнале бота — <code>journalctl -u tsproxy --since "15 min ago" | grep -E -A40 "Ошибка при обработке|завершилась ошибкой"</code>
      - cause: Неожиданные данные от Telegram или внешнего сервиса (новая версия, редкий случай)
        check: в той же трассировке — на чьём ответе упало; если в коде библиотеки — не обновлялись ли aiogram или SDK панели

# что обрабатывалось, когда случилась «Ошибка в боте»; {chat} — chat.*
bot_error_action:
  # {button} — вид кнопки (начало её данных, например menu или adm)
  button: нажата кнопка «{button}» ({chat})
  # {command} — команда без аргументов, например /client
  command: команда {command} ({chat})
  # обычное сообщение — текст не показываем
  message: сообщение ({chat})
  # другие события Telegram; {kind} — их вид в aiogram
  other: событие Telegram «{kind}»
  # {name} — имя фоновой задачи
  job: фоновая задача «{name}»
  chat:
    private: личный чат
    group: группа
