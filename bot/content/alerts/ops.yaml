# Тревоги о работе бота: бэкапы, сторож фоновых задач, поддержка, пробные. alert.<ключ> — как в remnawave.yaml
alert:
  # бэкап базы бота не получился (копия, проверка, сжатие, шифрование); {day} — за какой день
  bot_backup_failed:
    title: "Бэкап базы бота за {day} не получился"
    threat: "свежей копии базы нет — при потере сервера пропадут клиенты, оплаты и обращения за сутки; старые копии не удалены."
    where: "ежедневный бэкап базы бота (04:30 МСК)"
    causes:
      - cause: "Кончилось место на диске"
        check: "<code>df -h</code>"
      - cause: "Нет программы age или файла с открытым ключом для шифрования"
        check: "<code>which age</code>, <code>ls -l /var/lib/tsproxy/backup-recipients.txt</code>"
      - cause: "Бот не может писать в папку бэкапов (права или папки нет в ReadWritePaths службы)"
        check: "<code>ls -ld /var/backups/tsproxy</code>, <code>systemctl cat tsproxy | grep ReadWritePaths</code>"
      - cause: "Проверка целостности SQLite не прошла — база повреждена (это серьёзно)"
        check: "<code>journalctl -u tsproxy | grep -i бэкап</code> — integrity_check в тексте ошибки"
  # не удалось удалить старые копии; копия за день при этом сделана
  bot_backup_cleanup_failed:
    title: "Не удалось удалить старые бэкапы базы бота"
    threat: "копия за {day} сделана, но старые копии копятся и занимают диск."
    where: "ежедневный бэкап базы бота (04:30 МСК) чистил старые копии"
    causes:
      - cause: "У бота нет прав на папки копий (их пересоздали от root)"
        check: "<code>ls -ld /var/backups/tsproxy /var/backups/tsproxy/daily /var/backups/tsproxy/monthly</code>"
  # копия базы бота сделана, но в «💾 Бэкапы» не ушла; {copy} — путь к копии на сервере
  bot_backup_not_sent:
    title: "Бэкап базы бота за {day} не ушёл в Telegram"
    threat: "копия есть только на сервере ({copy}): при потере сервера пропадёт и она."
    where: "ежедневный бэкап базы бота (04:30 МСК) отправлял копию в «💾 Бэкапы»"
    causes:
      - cause: "Тему «💾 Бэкапы» удалили или пересоздали, или у группы сменился ID"
        check: "есть ли тема в группе; BACKUPS_THREAD_ID и ADMIN_CHAT_ID в .env бота"
      - cause: "Ночью не было связи с Telegram (временно — завтра копия уйдёт)"
        check: "другие ночные ошибки сети в журнале бота"
  # копия больше лимита Telegram на файлы; {size} — её размер
  bot_backup_too_big:
    title: "Бэкап базы бота за {day} не ушёл в Telegram"
    what: "файл {size} больше лимита Telegram на файлы (50 МБ)"
    threat: "копия есть только на сервере ({copy}): при потере сервера пропадёт и она."
    where: "ежедневный бэкап базы бота (04:30 МСК) отправлял копию в «💾 Бэкапы»"
    causes:
      - cause: "База выросла — чистка старых данных не запускается или данных правда много"
        check: "<code>ls -lh /var/lib/tsproxy/data/</code>; копию забрать с сервера вручную"
  # бэкап панели: нет копии моложе 26 часов; {since} — последняя копия или never
  panel_backup_stale:
    title: "Бэкап панели Remnawave: нет свежей копии"
    what: "нет копии моложе 26 часов; последняя — {since}"
    # вместо {since}, когда копий нет совсем
    never: "ни одной копии"
    threat: "при потере сервера панели пропадут аккаунты клиентов и настройки за время без копий."
    where: "присмотр за бэкапом панели (раз в час) смотрел папку копий"
    causes:
      - cause: "Скрипт упал до ловушки ошибок — молча (пропала группа tsproxy или изменился путь)"
        check: "<code>tail -20 /var/lib/remnawave-backup/backup.log</code>, <code>getent group tsproxy</code>, <code>grep -n chgrp /usr/local/bin/remnawave-backup.sh</code>"
      - cause: "Ошибка на шаге дампа или шифрования (тогда скрипт сам присылал «не получился»)"
        check: "строка FAIL в backup.log против /usr/local/bin/remnawave-backup.sh; <code>docker ps</code>, <code>df -h</code>, <code>ls -l /etc/remnawave-backup/</code>"
      - cause: "cron не запустил скрипт (сервер перезагружался ночью, удалён файл cron, переезд)"
        check: "<code>ls -l /etc/cron.d/remnawave-backup</code>, <code>grep CRON /var/log/syslog | grep remnawave-backup | tail</code>, <code>uptime</code>"
      - cause: "Копия есть, но бот смотрит не в ту папку"
        check: "<code>ls -lt /var/backups/remnawave/daily | head</code>, PANEL_BACKUP_DIR в .env бота"
  # бэкап панели: копия на сервере есть, а в Telegram не ушла; {copy} — путь к копии
  panel_backup_not_sent:
    title: "Бэкап панели Remnawave не ушёл в Telegram"
    what: "копия на сервере есть ({copy}), но в Telegram не ушла"
    threat: "копия есть только на сервере: при потере сервера пропадёт и она."
    where: "присмотр за бэкапом панели (раз в час) читал журнал скрипта"
    causes:
      - cause: "В /etc/remnawave-backup/telegram.env старый токен бота (перевыпустили только в .env бота)"
        check: "дата изменения telegram.env против даты перевыпуска токена, токен в чат не выводить; строка «telegram: файл не отправлен» в backup.log"
      - cause: "Тему «💾 Бэкапы» удалили или пересоздали, или у группы сменился ID"
        check: "есть ли тема в группе; BACKUPS_THREAD_ID в telegram.env и в .env бота"
      - cause: "Ночью не было связи с Telegram или загрузка не уложилась в 2 минуты"
        check: "другие ночные ошибки сети в журнале бота"
      - cause: "Файл больше 50 МБ — скрипт размер не проверяет"
        check: "размер копии в backup.log (строка OK)"
  # бот не может прочитать журнал скрипта или папку копий панели
  panel_backup_unreadable:
    title: "Присмотр за бэкапом панели не работает"
    threat: "бот не узнает, если бэкапы панели перестанут делаться."
    where: "присмотр за бэкапом панели (раз в час) читал журнал и папку копий"
    causes:
      - cause: "Права на папки сброшены на 700 (скрипт бэкапа поставили заново из репозитория)"
        check: "<code>ls -ld /var/backups/remnawave /var/backups/remnawave/daily /var/lib/remnawave-backup</code> (ждём drwxr-x--- root tsproxy), <code>grep -c 'chgrp tsproxy' /usr/local/bin/remnawave-backup.sh</code>"
      - cause: "Неверный путь в .env или папки ещё нет"
        check: "PANEL_BACKUP_DIR и PANEL_BACKUP_LOG в .env бота, <code>ls</code> этих путей"
  # сторож: задача не отработала успешно дольше своего срока; {since} — последний успех, {hint} — hint_*
  job_stale:
    title: "Фоновая задача «{name}» не отрабатывает"
    what: "последний успешный запуск — {since}; {hint}"
    # {since} — с какого момента выполняется
    hint_running: "выполняется с {since} — похоже, зависла"
    hint_failing: "падает с ошибкой или не запускается"
    threat: "то, что делает эта задача (проверка оплат, выдача, сверка, отчёт…), сейчас не делается."
    where: "сторож фоновых задач (раз в минуту)"
    causes:
      - cause: "Задача падает с ошибкой"
        check: "рядом тревоги «Ошибка в боте» с её именем; <code>journalctl -u tsproxy --since \"1 hour ago\" | grep \"Фоновая задача {name}\"</code>"
      - cause: "Задача зависла — ждёт ответа сети или базы"
        check: "не висят ли в то же время Remnawave и платёжка (тревоги выше); <code>systemctl restart tsproxy</code> снимет зависание"
  # то же, но задача ни разу не отработала с запуска бота; {since} — запуск бота
  job_stale_never:
    title: "Фоновая задача «{name}» не отрабатывает"
    what: "ни разу не отработала с запуска бота ({since}); {hint}"
    threat: "то, что делает эта задача (проверка оплат, выдача, сверка, отчёт…), сейчас не делается."
    where: "сторож фоновых задач (раз в минуту)"
    causes:
      - cause: "Задача падает с ошибкой"
        check: "рядом тревоги «Ошибка в боте» с её именем; <code>journalctl -u tsproxy --since \"1 hour ago\" | grep \"Фоновая задача {name}\"</code>"
      - cause: "Задача зависла — ждёт ответа сети или базы"
        check: "не висят ли в то же время Remnawave и платёжка (тревоги выше); <code>systemctl restart tsproxy</code> снимет зависание"
  # задача снова отработала после тревоги
  job_recovered:
    title: "Фоновая задача «{name}» снова работает"
    threat: "больше не грозит; то, что задача пропустила, она догоняет сама."
    where: "сторож фоновых задач (раз в минуту)"
  # бот не смог создать тему обращения; ошибка — ответ Telegram
  support_topic_failed:
    title: "Не создалась тема для обращения #{ticket_id}"
    threat: "обращение клиента не дошло до администраторов; клиенту ответили «попробуйте позже»."
    where: "клиент написал в поддержку, бот создавал тему обращения в группе администраторов"
    causes:
      - cause: "У бота забрали право «Управление темами» или права администратора (ответ «not enough rights»)"
        check: "группа → Администраторы → бот → «Управление темами»"
      - cause: "В группе выключили темы, или группу пересоздали и ADMIN_CHAT_ID указывает не туда"
        check: "включены ли «Темы» в настройках группы; ADMIN_CHAT_ID в .env против ID группы"
      - cause: "Бота удалили из группы (TelegramForbiddenError) — тогда тревоги не дойдут вообще"
        check: "список участников группы"
      - cause: "Слишком много действий в группе (429, 20 сообщений в минуту)"
        check: "журнал бота — retry after"
  # администратор выключил пробные
  trials_disabled:
    title: "⏸ Пробные выключены"
    what: "выключил администратор {admin_id}"
    threat: "новые клиенты не видят «🎁 Попробовать бесплатно»; уже выданные пробные работают. Включить — /trials."
    where: "администратор нажал кнопку в /trials"
  # администратор включил пробные
  trials_enabled:
    title: "▶️ Пробные снова включены"
    what: "включил администратор {admin_id}"
    threat: "новые клиенты снова могут взять пробный."
    where: "администратор нажал кнопку в /trials"
  # бот выключил пробные сам; {count} — новых пробных за {minutes} мин
  trials_spam:
    title: "Похоже на спам пробными — пробные выключены"
    what: "{count} новых пробных за {minutes} мин"
    threat: "новые клиенты не видят «🎁 Попробовать бесплатно», пока администратор не включит пробные — сами не включатся."
    where: "клиент взял пробный, бот считал новые пробные за последние {minutes} мин"
    causes:
      - cause: "Наплыв ботов или одноразовых аккаунтов Telegram"
        check: "новых клиентов — /stats; не похожи ли имена и время прихода"
      - cause: "Настоящий наплыв людей (реклама, упоминание)"
        check: "откуда пришли клиенты; если всё в порядке — /trials → «▶️ Включить пробные»"
