admin:
  # /broadcast — рассылка клиентам бота (кроме заблокировавших; заведённым в панели вручную не уходит)
  broadcast:
    usage: |-
      Два способа:
      • /broadcast и текст рассылки в том же сообщении. Жирный, курсив и ссылки сохранятся.
      • Пришлите сюда сообщение как есть — фото, видео, файл, голосовое, текст с подписью и разметкой — и ответьте на него командой /broadcast (без текста).
      Бот покажет предпросмотр — отправка только после «✅ Отправить».
    # над предпросмотром; сам предпросмотр — следующим сообщением, ровно как увидят клиенты
    preview_header: |-
      <b>📣 Предпросмотр рассылки</b>
      Получат: {recipients} клиентов бота. Заблокировали бота — {blocked}, им не уйдёт.
      Ниже — сообщение ровно так, как его увидят клиенты (кнопок под ним у клиентов не будет).
    preview_failed: "⚠️ Telegram не принял сообщение для рассылки: {error}"
    # под копией-предпросмотром (ответ /broadcast на сообщение); клиентам уйдёт копия
    copy_header: |-
      <b>📣 Предпросмотр рассылки</b>
      Получат: {recipients} клиентов бота. Заблокировали бота — {blocked}, им не уйдёт.
      Выше — сообщение ровно так, как его увидят клиенты: без «переслано от» и без этих кнопок.
    reply_or_text: |-
      ⚠️ Либо текст после /broadcast, либо ответ командой на готовое сообщение — не всё сразу.
      Чтобы разослать сообщение, на которое вы ответили, отправьте /broadcast без текста.
    album: |-
      ⚠️ Альбом (несколько фото или видео одним сообщением) разослать нельзя: Telegram копирует его только по одному файлу, и клиенты получили бы часть альбома.
      Пришлите одно фото или видео с подписью либо файлы по одному — каждый отдельной рассылкой.
    unsupported: |-
      ⚠️ Такое сообщение разослать нельзя. Можно: текст, фото, видео, GIF, файл, аудио, голосовое и видеосообщение — с подписью и разметкой.
      Опросы, стикеры, геопозиции, контакты и прочее не рассылаем.
    has_buttons: |-
      ⚠️ У этого сообщения есть кнопки — такое не рассылаем, чтобы клиенты не получили чужие кнопки.
      Пришлите сообщение заново, без кнопок, и ответьте на него /broadcast.
    # всплывающий ответ на «✅ Отправить» (до 200 символов)
    preview_missing: "Не нашёл предпросмотр — возможно, его удалили. Отправьте /broadcast заново."
    send_button: "✅ Отправить"
    cancel_button: "✖️ Отмена"
    stop_button: "⏹ Остановить"
    # всплывающие ответы на кнопки (до 200 символов)
    already_handled: "Эта рассылка уже отправлена или отменена."
    busy: "Сейчас идёт другая рассылка. Дождитесь её конца или остановите её."
    no_recipients: "Отправлять некому: нет клиентов, которые не заблокировали бота."
    preview_expired: "Предпросмотр устарел. Отправьте /broadcast заново."
    cancelled: "Рассылка отменена."
    stopping: "Останавливаю рассылку."
    not_running: "Рассылка уже не идёт."
    # в тему, где нажали «✅ Отправить»
    started: "📣 Рассылка началась: {total} клиентов. Около {minutes} мин."
    progress: "📣 Рассылка идёт: обработано {processed} из {total}."
    counts: "Доставлено: {delivered} из {total}. Заблокировали бота: {blocked}. Не доставлено: {failed}."
    completed: "✅ Рассылка закончена за {duration}."
    stopped: "⏹ Рассылка остановлена (администратором или перезапуском бота). Остальным клиентам не отправлено."
    aborted: "⚠️ Рассылка прервана: много неудач подряд — Telegram или сеть не отвечают. Остальным клиентам не отправлено, подробности — в логе сервера."
    crashed: "⚠️ Рассылка прервана ошибкой в боте. Остальным клиентам не отправлено, подробности — в логе сервера."
