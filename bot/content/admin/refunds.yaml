# Возврат по кнопке «↩️ Вернуть» в карточке; {amount} — «150 ₽» или «100 ⭐», даты по Москве
refunds:
  # кнопка в карточке клиента
  button: "↩️ Вернуть"
  list:
    title: |-
      <b>↩️ Вернуть оплату — {name}, <code>{telegram_id}</code></b>
      Оплаты за последние 14 дней. Возвращается вся сумма, со срока снимается всё, что дала оплата. Решаете вы — правил в боте нет.
    empty: "У клиента <code>{telegram_id}</code> нет оплат за последние 14 дней — через бота вернуть нечего. Оплату старше — только вручную в кабинете платёжки."
    # {state} — refunds.state.*
    item: "• #{order_id} — {paid_at}, тариф {tariff_id} ({days} дн.), {amount} — {state}"
  # что с оплатой в списке
  state:
    available: можно вернуть
    approved: возврат начат, платёжка ещё не вернула деньги
    in_review: возврат на проверке у платёжки
    refunded: деньги возвращены, срок укорачивается
    completed: возвращена
    not_granted: доступ по ней ещё не выдан — вернуть нельзя
    transferred: подписку перенесли на другой аккаунт — только вручную
    payments_off: оплата в боте выключена — только вручную
    disputed: оспорена через банк — деньги клиенту вернул банк, дни сняты
  buttons:
    order: "↩️ #{order_id} — {amount}"
    confirm: "✅ Да, вернуть {amount}"
  # {duration} — refunds.duration или refunds.duration_hours
  ask: |-
    Вернуть клиенту <code>{telegram_id}</code> <b>{amount}</b> за оплату #{order_id} от {paid_at} (тариф {tariff_id})?
    Со срока подписки снимется {duration}. Деньги вернёт платёжка — отменить это нельзя.
  duration: "{days} дн."
  duration_hours: "{days} дн. {hours} ч."
  # итог после «✅ Да, вернуть» — заменяет вопрос в той же теме
  result:
    completed: "✅ Возврат №{request_id}: {amount} возвращены клиенту <code>{telegram_id}</code>, подписка теперь до {expire_at}. Клиенту отправлено сообщение."
    completed_access_ended: "✅ Возврат №{request_id}: {amount} возвращены клиенту <code>{telegram_id}</code>, доступ отключён. Клиенту отправлено сообщение."
    term_pending: "⚠️ Возврат №{request_id}: {amount} возвращены, но панель не ответила — срок укоротится сам, бот повторяет раз в минуту (тревога в «🚨 Тревоги»)."
    in_review: "⏳ Возврат №{request_id} ({amount}) на проверке у платёжки. Дни снимем и клиенту напишем, когда платёжка вернёт деньги; итог придёт в «💰 Оплаты»."
    provider_pending: "⚠️ Возврат №{request_id} ({amount}) начат, но платёжка не ответила. Бот повторит сам раз в минуту; второй раз деньги не вернутся."
    failed: "❌ Платёжка отказала в возврате №{request_id} — подробности в «🚨 Тревоги». Деньги не возвращены, срок не укорочен."
  # почему вернуть нельзя — ответ на нажатие
  refused:
    payments_off: "Оплата в боте выключена (PAYMENTS_MODE=off) — вернуть деньги через бота нельзя. Только вручную в кабинете платёжки."
    client_not_found: "Клиента <code>{telegram_id}</code> нет среди клиентов бота."
    order_not_found: "У клиента <code>{telegram_id}</code> нет оплаты #{order_id}."
    not_granted: "Доступ по оплате #{order_id} ещё не выдан — сначала разберитесь с выдачей (тревога в «🚨 Тревоги»)."
    window_passed: "Оплате #{order_id} больше 14 дней — через бота её не вернуть, только вручную в кабинете платёжки."
    already_refunded: "Оплата #{order_id} уже возвращена или возвращается — второй раз её не вернуть."
    transferred: "После оплаты #{order_id} подписку перенесли на другой аккаунт: её дни уже не здесь. Вернуть — только вручную (деньги в кабинете платёжки, дни — у нового аккаунта)."
    disputed: "Оплату #{order_id} клиент оспорил через банк: деньги ему уже вернул банк, дни этой оплаты сняты. Второй раз её не вернуть."
  # тема «💰 Оплаты»: каждый возврат и «оставил вторую оплату»
  topic:
    header: |-
      ↩️ <b>Возврат №{request_id}: заказ #{order_id}, {amount}</b>
      Клиент: {name}, @username: {username}, Telegram ID: <code>{telegram_id}</code>
    # {admin} — имя администратора
    by_admin: "Вернул(а) по обращению: {admin}"
    completed: "✅ Деньги возвращены, срок укорочен, клиенту отправлено сообщение."
    term_pending: "⚠️ Деньги возвращены, срок укоротится повтором — панель не ответила."
    in_review: "⏳ Возврат на проверке у платёжки — итог придёт позже."
    provider_pending: "⚠️ Платёжка не ответила — бот повторяет раз в минуту."
    failed: "❌ Платёжка отказала — деньги не возвращены, подробности в «🚨 Тревоги»."
