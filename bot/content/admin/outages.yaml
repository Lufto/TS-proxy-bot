admin:
  # компенсация за сбой ноды в «🚨 Тревоги»; {since}–{until} — простой, {amount} — сколько начислить
  compensation:
    offer: |-
      🎁 <b>Компенсация за сбой</b>
      Простой: с {since} по {until} — {minutes} мин (соседние падения нод склеены в один сбой).
      Начислить {amount} всем клиентам бота с оплаченной подпиской? Тем, кто в льготном периоде, на столько же продлятся льготные дни. Пробные и клиенты, заведённые в панели вручную, не затрагиваются.
    button: "🎁 Компенсировать {amount}"
    confirm: "Точно начислить {amount} всем клиентам бота с оплаченной подпиской и продлить льготные дни тем, кто в льготном периоде? Клиенты получат извинение. Отменить начисление нельзя."
    confirm_button: "✅ Да, компенсировать"
    resume_button: "🔁 Продолжить"
    # предложение после нажатия: {run_id} — номер начисления, {amount} — сколько начисляется
    in_progress: |-
      🎁 <b>Компенсация за сбой</b>
      Простой: с {since} по {until} — {minutes} мин.
      Начисление #{run_id}: {amount}. Ход и итог — сообщениями ниже. Если итог не пришёл (например, бот перезапускался), нажмите «🔁 Продолжить» — бот доделает и никому не начислит дважды.
    started: "🎁 Компенсация #{run_id}: начисляю {amount}, клиентов к проверке — {total}."
    progress: "🎁 Компенсация #{run_id}: проверено {done} из {total}…"
    finished: |-
      ✅ <b>Компенсация #{run_id} закончена</b> ({amount})
      Продлено: {extended}
      Продлён льготный период: {grace_extended}
      Уже было начислено раньше: {already}
      Без оплаченной подписки: {not_eligible}
      Пропущено (аккаунт без клиента в базе): {skipped}
    # что следующее нажатие доделает
    unfinished: "⚠️ Не доделано: {deferred} — идёт выдача доступа по оплате, {failed} — панель не ответила. Нажмите «🔁 Продолжить» позже: бот доделает и никому не начислит дважды."
    # начисление записано, но срок в панели изменился посреди — бот не знает, поставлен ли он
    manual: "⚠️ Проверьте вручную (срок изменился посреди начисления): {telegram_ids}"
    nothing: "Компенсация #{run_id}: этот простой уже покрыт прошлой компенсацией — начислять нечего."
    # всплывающие ответы на кнопку (до 200 символов)
    launched: "Начинаю. Ход — сообщениями в этой теме."
    resumed: "Продолжаю ту же компенсацию — дважды никому не начислю."
    running: "Эта компенсация уже идёт — дождитесь итога."
    not_found: "Сбой не найден."
    still_open: "Нода ещё не восстановилась — компенсировать можно после восстановления."
  # /outages — последние сбои нод; {node} — имя ноды или uuid, {at}, {admin_id} — кто компенсировал
  outages:
    empty: "Сбоев нод пока не было."
    title: "<b>⚡️ Последние сбои нод</b> (до {limit}, новые сверху)"
    open: "#{outage_id} «{node}»: с {since} — нода ещё не восстановилась."
    waiting: "#{outage_id} «{node}»: с {since} по {until} — {minutes} мин. Не компенсировано, можно начислить {amount}."
    # сбой попал в уже компенсированный простой (соседнее падение) — начислять нечего
    covered: "#{outage_id} «{node}»: с {since} по {until} — {minutes} мин. Уже покрыт компенсацией соседнего сбоя."
    compensated: "#{outage_id} «{node}»: с {since} по {until} — {minutes} мин. ✅ Компенсировано {at} (администратор <code>{admin_id}</code>)."
    footer: "«🎁» — компенсировать (с подтверждением). «🔁» — доделать начатую компенсацию, если итог не пришёл: никому не начислит дважды."
    # на кнопках {number} — номер сбоя
    ask_button: "🎁 #{number}: компенсировать {amount}"
    resume_button: "🔁 #{number}: продолжить"
