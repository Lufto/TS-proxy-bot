# Админка: команды только от администраторов в их группе; каждое действие — в журнал
admin:
  # /client без запроса или с непонятным запросом; {max_days} — предел ручной выдачи
  usage: |-
    <b>Админка</b>
    /client 123456789 или /client @username — карточка клиента: подписка, оплаты, пробный, устройства.
    /give 123456789 30 — выдать или продлить подписку на 30 дней (не больше {max_days} за раз).
    /trials — пробные: включены или выключены, кнопка переключения.
    /banner — плашка о неполадках на сайте: поставить «технические работы» или «перебои у прокси», снять.
    /stats — статистика: оплаты, подписки, пробный → оплата, обращения, заблокировавшие бота.
    /broadcast текст — рассылка всем клиентам бота: сначала предпросмотр, потом «✅ Отправить». Фото, видео, файл — пришлите сюда и ответьте на него /broadcast.
    /proof 123 — доказательство оказания услуги по заказу 123 (файл для спора с платёжкой).
    /transfer ID_откуда ID_куда номер_платежа — перенести подписку на другой аккаунт по подтверждённому платежу.
    /outages — последние сбои нод: компенсированы ли, кнопки «🎁 Компенсировать» и «🔁 Продолжить».
    /announce текст — объявление клиентам прямо в приложении (Happ, v2RayTun), до 200 символов; /announce off — снять; /announce — что стоит сейчас.
    Остальное — кнопками под карточкой. Действия всегда по Telegram ID: @username мог смениться.
  # /give без нужных чисел
  give_usage: "Формат: /give 123456789 30 — Telegram ID клиента и число дней (от 1 до {max_days})."
  days_out_of_range: "Дней должно быть от 1 до {max_days} за раз."
  # {query} — что искали
  not_found: "Среди клиентов бота нет: {query}"
  client_not_found: "Клиента с Telegram ID <code>{telegram_id}</code> нет среди клиентов бота."
  # несколько клиентов с одним @username (старый @username сменил владельца)
  many_found: "С таким @username несколько клиентов — выберите по Telegram ID:"
  many_found_item: "• {name} — /client {telegram_id}"
  panel_unavailable: "⚠️ Панель Remnawave не ответила. Попробуйте ещё раз через минуту."
  cancelled: "Отменено."
  # всплывающий ответ на кнопку админки не от администратора или не в группе (до 200 символов)
  not_admin: "Это могут только администраторы в группе администраторов."
  # подставляется, если у клиента нет имени или @username
  no_value: нет
  card:
    title: |-
      <b>Клиент {name}</b>
      Telegram ID: <code>{telegram_id}</code>, @username: {username}
      В боте с {first_seen_at}
    blocked: "⛔ Заблокировал бота {at}"
    status_trial: "Подписка: пробный до {expire_at}"
    status_trial_traffic_used_up: "Подписка: пробный до {expire_at}, трафик исчерпан"
    status_active: "Подписка: активна до {expire_at}"
    status_grace: "Подписка: льготный период до {expire_at}"
    status_expired: "Подписка: закончилась {expire_at}"
    status_suspended: "Подписка: доступ выключен, срок до {expire_at}"
    no_account: "Подписка: прокси-аккаунта нет"
    panel_unavailable: "Подписка: панель Remnawave не ответила — срок и устройства сейчас неизвестны"
    traffic: "Трафик пробного: {used} из {limit} ГБ"
    devices: "Устройства: {used} из {limit}"
    devices_no_limit: "Устройства: {used}"
    grace: "Льготный период начался {at}"
    trial_none: "Пробный: не брал"
    trial_delivered: "Пробный: выдан {at}, продлений: {extensions}"
    trial_pending: "Пробный: отмечен {at}, ещё не доставлен (панель не ответила)"
    payments_none: "Оплат нет"
    payments: "Оплат: {count} на {total} ₽. Последние:"
    payment_item: "• {paid_at} — {tariff}, {days} дн., {amount} ₽ ({status})"
  # состояние заказа в строке оплаты
  order_status:
    created: создан
    paid: оплачен, доступ выдаётся
    access_granted: доступ выдан
    access_failed: доступ не выдан
    manual_review: ручная проверка
    canceled: отменён
    refunded: возвращён
  buttons:
    extend: "➕ {days} дн."
    devices: "📱 Устройства"
    reset_trial: "🎁 Сбросить пробный"
    revoke: "🔄 Перевыпустить ссылку"
    confirm_extend: "✅ Да, выдать {days} дн."
    confirm_reset: "✅ Да, сбросить"
    confirm_revoke: "✅ Да, перевыпустить"
    cancel: "✖️ Отмена"
    delete_device: "🗑 {number}"
  extend:
    # {current} — нынешний срок или extend.no_account, {new} — новый срок
    preview: |-
      Выдать клиенту {name} (Telegram ID <code>{telegram_id}</code>) {days} дн.?
      Сейчас: {current}
      Станет: до {new}
    no_account: "прокси-аккаунта нет — будет создан"
    done: "✅ Клиенту <code>{telegram_id}</code> выдано {days} дн. Подписка до {expire_at}. Клиенту отправлено сообщение."
    changed: |-
      ⚠️ Срок клиента <code>{telegram_id}</code> уже изменился (сейчас: {current}) — ничего не сделано. Откройте карточку заново: /client {telegram_id}
  reset:
    ask: |-
      Сбросить пробный клиенту <code>{telegram_id}</code>? Он снова увидит «🎁 Попробовать бесплатно», и нажатие даст 7 дней с нуля на прежнем аккаунте.
    done: "✅ Пробный клиента <code>{telegram_id}</code> сброшен."
    not_used: "Клиент <code>{telegram_id}</code> пробный не брал — сбрасывать нечего."
    has_paid: "Клиент <code>{telegram_id}</code> уже платил — пробный ему не положен, сброс не нужен."
  revoke:
    ask: |-
      Перевыпустить ссылку подписки клиенту <code>{telegram_id}</code>? Старая перестанет работать: на всех устройствах подписку нужно будет добавить заново.
    done: "✅ Ссылка клиента <code>{telegram_id}</code> перевыпущена. Новая — у клиента в «🚀 Подключиться»."
    no_account: "У клиента <code>{telegram_id}</code> нет прокси-аккаунта — перевыпускать нечего."
  devices:
    title: "Устройства клиента <code>{telegram_id}</code>: {used} из {limit}"
    title_no_limit: "Устройства клиента <code>{telegram_id}</code>: {used}"
    item: "{number}. {name} — {system}, подключено {connected_at}"
    unknown: "?"
    empty: "У клиента <code>{telegram_id}</code> нет подключённых устройств."
    no_account: "У клиента <code>{telegram_id}</code> нет прокси-аккаунта."
    deleted: "✅ Устройство удалено."
    not_found: "Этого устройства у клиента уже нет."
  # /trials — выключатель пробных; {limit} и {minutes} — порог автовыключения
  trials:
    enabled: |-
      <b>🎁 Пробные включены.</b>
      Новые клиенты видят «🎁 Попробовать бесплатно». Больше {limit} новых пробных за {minutes} мин — бот выключит их сам и пришлёт тревогу.
    disabled: |-
      <b>⏸ Пробные выключены.</b>
      Новые клиенты не видят «🎁 Попробовать бесплатно», старая кнопка отвечает «временно недоступен». Уже выданные пробные работают, зависшие выдачи бот доделывает. Сами пробные не включатся — только кнопкой ниже.
    # итог нажатия: переключено или уже было так (другой администратор успел раньше)
    switched: "✅ Готово."
    unchanged: "Ничего не изменилось: пробные уже были в этом состоянии."
    disable_button: "⏸ Выключить пробные"
    enable_button: "▶️ Включить пробные"
  # /banner — плашка на сайте; тексты самой плашки — web/src/data/<язык>/common.json
  site_banner:
    # {banner} — из names ниже
    state: |-
      <b>🪧 Плашка на сайте ts-proxy.com:</b> {banner}.
      Поставленная кнопкой плашка висит, пока её не снимут. «Бот не отвечает» сайт показывает сам, когда бот молчит.
    names:
      none: "нет"
      maintenance: "«Идут технические работы»"
      proxy_issues: "«Перебои в работе прокси»"
    # кнопка — поставить эту плашку (none — снять)
    buttons:
      none: "✅ Снять плашку"
      maintenance: "🛠 Технические работы"
      proxy_issues: "⚠️ Перебои у прокси"
    # под тревогой «Remnawave не отвечает»
    alert_button: "🪧 Поставить на сайт плашку «перебои у прокси»"
    # итог нажатия: поставлено или уже было так (другой администратор успел раньше)
    switched: "✅ Готово."
    unchanged: "Ничего не изменилось: эта плашка уже стоит."
  # компенсация за сбой ноды в «🚨 Тревоги»; {since}–{until} — простой, {amount} — сколько начислить
  compensation:
    offer: |-
      🎁 <b>Компенсация за сбой</b>
      Простой: с {since} по {until} — {minutes} мин (соседние падения нод склеены в один сбой).
      Начислить {amount} всем клиентам бота с оплаченной подпиской? Тем, кто в льготном периоде, на столько же продлятся льготные дни. Пробные и клиенты, заведённые в панели вручную, не затрагиваются.
    button: "🎁 Компенсировать {amount}"
    confirm: "Точно начислить {amount} всем клиентам бота с оплаченной подпиской и продлить льготные дни тем, кто в льготном периоде? Клиенты получат извинение. Отменить начисление нельзя."
    confirm_button: "✅ Да, компенсировать"
    resume_button: "🔁 Продолжить"
    # предложение после нажатия: {run_id} — номер начисления, {amount} — сколько начисляется
    in_progress: |-
      🎁 <b>Компенсация за сбой</b>
      Простой: с {since} по {until} — {minutes} мин.
      Начисление #{run_id}: {amount}. Ход и итог — сообщениями ниже. Если итог не пришёл (например, бот перезапускался), нажмите «🔁 Продолжить» — бот доделает и никому не начислит дважды.
    started: "🎁 Компенсация #{run_id}: начисляю {amount}, клиентов к проверке — {total}."
    progress: "🎁 Компенсация #{run_id}: проверено {done} из {total}…"
    finished: |-
      ✅ <b>Компенсация #{run_id} закончена</b> ({amount})
      Продлено: {extended}
      Продлён льготный период: {grace_extended}
      Уже было начислено раньше: {already}
      Без оплаченной подписки: {not_eligible}
      Пропущено (аккаунт без клиента в базе): {skipped}
    # что следующее нажатие доделает
    unfinished: "⚠️ Не доделано: {deferred} — идёт выдача доступа по оплате, {failed} — панель не ответила. Нажмите «🔁 Продолжить» позже: бот доделает и никому не начислит дважды."
    # начисление записано, но срок в панели изменился посреди — бот не знает, поставлен ли он
    manual: "⚠️ Проверьте вручную (срок изменился посреди начисления): {telegram_ids}"
    nothing: "Компенсация #{run_id}: этот простой уже покрыт прошлой компенсацией — начислять нечего."
    # всплывающие ответы на кнопку (до 200 символов)
    launched: "Начинаю. Ход — сообщениями в этой теме."
    resumed: "Продолжаю ту же компенсацию — дважды никому не начислю."
    running: "Эта компенсация уже идёт — дождитесь итога."
    not_found: "Сбой не найден."
    still_open: "Нода ещё не восстановилась — компенсировать можно после восстановления."
  # /outages — последние сбои нод; {node} — имя ноды или uuid, {at}, {admin_id} — кто компенсировал
  outages:
    empty: "Сбоев нод пока не было."
    title: "<b>⚡️ Последние сбои нод</b> (до {limit}, новые сверху)"
    open: "#{outage_id} «{node}»: с {since} — нода ещё не восстановилась."
    waiting: "#{outage_id} «{node}»: с {since} по {until} — {minutes} мин. Не компенсировано, можно начислить {amount}."
    # сбой попал в уже компенсированный простой (соседнее падение) — начислять нечего
    covered: "#{outage_id} «{node}»: с {since} по {until} — {minutes} мин. Уже покрыт компенсацией соседнего сбоя."
    compensated: "#{outage_id} «{node}»: с {since} по {until} — {minutes} мин. ✅ Компенсировано {at} (администратор <code>{admin_id}</code>)."
    footer: "«🎁» — компенсировать (с подтверждением). «🔁» — доделать начатую компенсацию, если итог не пришёл: никому не начислит дважды."
    # на кнопках {number} — номер сбоя
    ask_button: "🎁 #{number}: компенсировать {amount}"
    resume_button: "🔁 #{number}: продолжить"
  # /proof 123 — файл .txt для спора с платёжкой, строки без разметки
  proof:
    usage: "Формат: /proof 123 — номер заказа. Бот пришлёт файл с историей заказа: оплата, выдача доступа, подключения, журнал событий."
    not_found: "Заказа #{order_id} нет."
    caption: "📄 Доказательство оказания услуги по заказу #{order_id}"
    header: |-
      Доказательство оказания услуги — заказ #{order_id}
      Сформировано: {at}
    service: "Услуга: доступ к прокси-сервису TS Proxy, тариф {tariff_id} ({days} дн.)"
    client: "Клиент: Telegram ID {telegram_id}, имя: {name}, @username: {username}, в боте с {first_seen_at}"
    order: "Заказ создан: {created_at}, цена {price} ₽, состояние: {status}"
    payment: "Оплата: {paid_at}, {amount} ₽, платёжка: {provider}, номер платежа: {payment_id}"
    payment_none: "Оплата: не поступала"
    grant_target: "Срок подписки по заказу: до {expire_at}"
    # {status} — статус аккаунта в панели, {traffic} — израсходовано, ГБ
    account: "Прокси-аккаунт сейчас: {status}, подписка до {expire_at}, первое подключение: {first_connected}, израсходовано трафика: {traffic} ГБ"
    never_connected: "ни разу не подключался"
    account_none: "Прокси-аккаунта в панели нет"
    panel_unavailable: "Панель Remnawave не ответила — данные о подключениях сейчас недоступны"
    devices_title: "Подключённые устройства: {count}"
    device: "  • {model}, {platform}, подключено {connected_at}"
    events_title: "Журнал событий (события заказа и клиента с момента создания заказа):"
    event: "  • {at} — {kind}: {details}"
    event_admin: "  • {at} — {kind} (администратор {admin_id}): {details}"
    repeated: "    повторялось {count} раз"
    truncated: "  … показаны первые {limit} событий"
    kinds:
      order_created: заказ создан
      payment_created: платёж создан, клиенту выдана ссылка на оплату
      payment_received: оплата получена и засчитана
      access_granted: доступ выдан (подписка продлена)
      access_failed: доступ не выдан
      trial_granted: выдан пробный период
      trial_extended: пробный период продлён
      grace_started: начался льготный период
      grace_ended: льготный период закончился
      refund_approved: решено вернуть оплату (администратором по обращению)
      refund_in_review: платёжка отправила возврат на проверку
      refund_completed: деньги возвращены
      refund_failed: платёжка отказала в возврате
      refund_term_planned: посчитан срок после возврата
      refund_term_shortened: срок укорочен после возврата
      compensation_granted: начислена компенсация за сбой
      admin_action: действие администратора
      fake_payment_notification: отклонено поддельное уведомление об оплате
      subscription_revoked: клиент перевыпустил ссылку подписки
      connect_waiting: клиент открыл «Подключиться», а панель не ответила — ждёт ссылку
      connect_delivered: клиент получил ссылку после сбоя панели
      trials_disabled: пробные выключены
      trials_enabled: пробные включены
      site_banner_set: плашка на сайте изменена
      stars_payment_returned: оплата звёздами не подошла к заказу — возврат звёзд
      payment_chargeback: спор через банк — деньги возвращены плательщику, дни оплаты сняты
      payment_refunded_outside_bot: деньги возвращены через кабинет платёжки, не через бота
      payment_status_changed: статус оплаты у платёжки изменился после оплаты
      refund_review_overdue: возврат долго на проверке у платёжки
  # /stats — статистика; даты, «сегодня» и «с 1-го числа» — по Москве
  stats:
    title: "<b>📊 Статистика</b> на {at}"
    # продажи — поступившие оплаты по времени зачёта за вычетом возвратов (строка refunds)
    sales_today: "💰 Оплаты сегодня: {count} на {amount} ₽"
    sales_month: "💰 Оплаты с 1-го числа: {count} на {amount} ₽"
    # суммы оплат выше — уже за вычетом этих возвратов
    refunds: "↩️ Возвраты: сегодня {today_count} на {today_amount} ₽, с 1-го числа {month_count} на {month_amount} ₽ (вычтены из оплат)"
    # оплаты звёздами, в рублёвые суммы не входят; {rubles} — примерно по курсу, {refunds} — возвратов
    stars_today: "⭐ Звёздами сегодня: {count} на {stars} ⭐ ≈ {rubles} ₽ (возвратов {refunds})"
    stars_month: "⭐ Звёздами с 1-го числа: {count} на {stars} ⭐ ≈ {rubles} ₽ (возвратов {refunds})"
    subscriptions: "🔑 Подписки сейчас: оплаченных — {paid}, в льготном периоде — {grace}, пробных — {trial}"
    subscriptions_unknown: "🔑 Подписки сейчас: панель Remnawave не ответила — неизвестно"
    trials: "🎁 Пробный → оплата: {converted} из {trials} ({percent}%) за всё время"
    trials_none: "🎁 Пробный → оплата: пробных ещё не было"
    support: "💬 Обращения: открыто — {open_now}, ждут первого ответа — {waiting}; с 1-го числа — {opened}"
    response: "⏱ Первый ответ (обращения с 1-го числа): в среднем {average}, дольше всего {longest}"
    response_none: "⏱ Первый ответ (обращения с 1-го числа): ответов ещё не было"
    clients: "👥 Клиентов бота: {total}, заблокировали бота: {blocked}"
    duration_minutes: "{minutes} мин"
    duration_hours: "{hours} ч {minutes} мин"
    duration_under_minute: "меньше минуты"
  # /broadcast — рассылка клиентам бота (кроме заблокировавших; заведённым в панели вручную не уходит)
  broadcast:
    usage: |-
      Два способа:
      • /broadcast и текст рассылки в том же сообщении. Жирный, курсив и ссылки сохранятся.
      • Пришлите сюда сообщение как есть — фото, видео, файл, голосовое, текст с подписью и разметкой — и ответьте на него командой /broadcast (без текста).
      Бот покажет предпросмотр — отправка только после «✅ Отправить».
    # над предпросмотром; сам предпросмотр — следующим сообщением, ровно как увидят клиенты
    preview_header: |-
      <b>📣 Предпросмотр рассылки</b>
      Получат: {recipients} клиентов бота. Заблокировали бота — {blocked}, им не уйдёт.
      Ниже — сообщение ровно так, как его увидят клиенты (кнопок под ним у клиентов не будет).
    preview_failed: "⚠️ Telegram не принял сообщение для рассылки: {error}"
    # под копией-предпросмотром (ответ /broadcast на сообщение); клиентам уйдёт копия
    copy_header: |-
      <b>📣 Предпросмотр рассылки</b>
      Получат: {recipients} клиентов бота. Заблокировали бота — {blocked}, им не уйдёт.
      Выше — сообщение ровно так, как его увидят клиенты: без «переслано от» и без этих кнопок.
    reply_or_text: |-
      ⚠️ Либо текст после /broadcast, либо ответ командой на готовое сообщение — не всё сразу.
      Чтобы разослать сообщение, на которое вы ответили, отправьте /broadcast без текста.
    album: |-
      ⚠️ Альбом (несколько фото или видео одним сообщением) разослать нельзя: Telegram копирует его только по одному файлу, и клиенты получили бы часть альбома.
      Пришлите одно фото или видео с подписью либо файлы по одному — каждый отдельной рассылкой.
    unsupported: |-
      ⚠️ Такое сообщение разослать нельзя. Можно: текст, фото, видео, GIF, файл, аудио, голосовое и видеосообщение — с подписью и разметкой.
      Опросы, стикеры, геопозиции, контакты и прочее не рассылаем.
    has_buttons: |-
      ⚠️ У этого сообщения есть кнопки — такое не рассылаем, чтобы клиенты не получили чужие кнопки.
      Пришлите сообщение заново, без кнопок, и ответьте на него /broadcast.
    # всплывающий ответ на «✅ Отправить» (до 200 символов)
    preview_missing: "Не нашёл предпросмотр — возможно, его удалили. Отправьте /broadcast заново."
    send_button: "✅ Отправить"
    cancel_button: "✖️ Отмена"
    stop_button: "⏹ Остановить"
    # всплывающие ответы на кнопки (до 200 символов)
    already_handled: "Эта рассылка уже отправлена или отменена."
    busy: "Сейчас идёт другая рассылка. Дождитесь её конца или остановите её."
    no_recipients: "Отправлять некому: нет клиентов, которые не заблокировали бота."
    preview_expired: "Предпросмотр устарел. Отправьте /broadcast заново."
    cancelled: "Рассылка отменена."
    stopping: "Останавливаю рассылку."
    not_running: "Рассылка уже не идёт."
    # в тему, где нажали «✅ Отправить»
    started: "📣 Рассылка началась: {total} клиентов. Около {minutes} мин."
    progress: "📣 Рассылка идёт: обработано {processed} из {total}."
    counts: "Доставлено: {delivered} из {total}. Заблокировали бота: {blocked}. Не доставлено: {failed}."
    completed: "✅ Рассылка закончена за {duration}."
    stopped: "⏹ Рассылка остановлена (администратором или перезапуском бота). Остальным клиентам не отправлено."
    aborted: "⚠️ Рассылка прервана: много неудач подряд — Telegram или сеть не отвечают. Остальным клиентам не отправлено, подробности — в логе сервера."
    crashed: "⚠️ Рассылка прервана ошибкой в боте. Остальным клиентам не отправлено, подробности — в логе сервера."
  # /transfer — перенос подписки по номеру платежа из чека; сроки по Москве
  transfer:
    usage: |-
      Формат: /transfer 111 222 номер_платежа
      111 — Telegram ID нынешнего аккаунта, 222 — нового, номер платежа — из чека клиента. Новый аккаунт должен хоть раз написать боту.
    # {from_expire}, {to_expire} — сроки сейчас (или no_subscription), {left} — сколько переносится
    preview: |-
      <b>Перенос подписки</b>
      С <code>{from_id}</code> (до {from_expire}) на <code>{to_id}</code> ({to_expire}).
      Платёж {payment_id} — заказ #{order_id} этого клиента, оплата подтверждена.
      Переносится {left}. У нового аккаунта подписка станет до <b>{new_expire}</b>, у старого доступ отключится.
    no_subscription: нет подписки
    left: "{days} дн. {hours} ч."
    confirm: "✅ Да, перенести"
    same_client: "Откуда и куда — один и тот же аккаунт."
    source_not_found: "Клиента <code>{from_id}</code> нет среди клиентов бота."
    target_not_found: "Клиента <code>{to_id}</code> нет среди клиентов бота: пусть новый аккаунт сначала напишет боту /start."
    payment_not_found: "У клиента <code>{from_id}</code> нет оплаченного заказа с платежом {payment_id} — перенос только по подтверждённому платежу."
    nothing_to_transfer: "У клиента <code>{from_id}</code> нет идущей оплаченной подписки — переносить нечего."
    refund_open: "У клиента <code>{from_id}</code> идёт возврат оплаты — дождитесь, пока он закончится."
    changed: "Сроки уже изменились — перенос не сделан. Отправьте /transfer заново."
    # {expire_at} — новый срок нового аккаунта
    done: "✅ Подписка перенесена: <code>{to_id}</code> до {expire_at}, у <code>{from_id}</code> доступ отключён. Новому аккаунту отправлено сообщение."
  # /announce — объявление в приложении (заголовок announce Remnawave), видят все клиенты панели
  announce:
    usage: |-
      <b>📢 Объявление в приложении</b>
      /announce текст — поставить или заменить. Обычный текст до 200 символов (эмодзи — за 2), без жирного и ссылок.
      /announce off — снять.
      /announce — что стоит сейчас.
    none: |-
      <b>📢 Объявление в приложении</b>
      Сейчас объявления нет.
      Поставить — /announce и текст (до 200 символов), например: /announce Плановые работы сегодня с 3:00 до 4:00 МСК
    current: |-
      <b>📢 Объявление в приложении</b>
      Сейчас стоит:
      <blockquote>{text}</blockquote>
      Заменить — /announce и новый текст, снять — /announce off.
    published: |-
      ✅ Объявление поставлено:
      <blockquote>{text}</blockquote>
      Клиенты увидят его в Happ и v2RayTun, когда приложение обновит подписку (само по расписанию или кнопкой обновления). Видят все клиенты панели, в том числе заведённые вручную. Снять — /announce off.
    cleared: |-
      ✅ Объявление снято:
      <blockquote>{text}</blockquote>
      Из приложений оно пропадёт, когда они обновят подписку.
    already_off: "Объявления и так нет."
    # {length} — длина текста, {max_length} — сколько показывает Happ
    too_long: "⚠️ Не поставлено: в тексте {length} символов, а Happ показывает не больше {max_length} (эмодзи считаются за 2). Сократите и отправьте /announce заново."
    # панель ответила 401/403: у токена бота нет прав на настройки подписки
    no_rights: |-
      ⚠️ Панель Remnawave не дала поменять настройки подписки: у API-токена бота нет на это прав (или токен устарел).
      Выдайте токену права на настройки подписки (subscription-settings) или поставьте объявление в панели руками: Settings → Subscription Settings → Custom Response Headers, заголовок announce.
