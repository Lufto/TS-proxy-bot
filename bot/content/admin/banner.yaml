admin:
  # /banner — плашка на сайте; тексты самой плашки — web/src/data/<язык>/common.json
  site_banner:
    # {banner} — из names ниже
    state: |-
      <b>🪧 Плашка на сайте ts-proxy.com:</b> {banner}.
      Поставленная кнопкой плашка висит, пока её не снимут. «Бот не отвечает» сайт показывает сам, когда бот молчит.
    names:
      none: "нет"
      maintenance: "«Идут технические работы»"
      proxy_issues: "«Перебои в работе прокси»"
    # кнопка — поставить эту плашку (none — снять)
    buttons:
      none: "✅ Снять плашку"
      maintenance: "🛠 Технические работы"
      proxy_issues: "⚠️ Перебои у прокси"
    # под тревогой «Remnawave не отвечает»
    alert_button: "🪧 Поставить на сайт плашку «перебои у прокси»"
    # итог нажатия: поставлено или уже было так (другой администратор успел раньше)
    switched: "✅ Готово."
    unchanged: "Ничего не изменилось: эта плашка уже стоит."
