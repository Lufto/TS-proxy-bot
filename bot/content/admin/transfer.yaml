admin:
  # /transfer — перенос подписки по номеру платежа из чека; сроки по Москве
  transfer:
    usage: |-
      Формат: /transfer 111 222 номер_платежа
      111 — Telegram ID нынешнего аккаунта, 222 — нового, номер платежа — из чека клиента. Новый аккаунт должен хоть раз написать боту.
    # {from_expire}, {to_expire} — сроки сейчас (или no_subscription), {left} — сколько переносится
    preview: |-
      <b>Перенос подписки</b>
      С <code>{from_id}</code> (до {from_expire}) на <code>{to_id}</code> ({to_expire}).
      Платёж {payment_id} — заказ #{order_id} этого клиента, оплата подтверждена.
      Переносится {left}. У нового аккаунта подписка станет до <b>{new_expire}</b>, у старого доступ отключится.
    no_subscription: нет подписки
    left: "{days} дн. {hours} ч."
    confirm: "✅ Да, перенести"
    same_client: "Откуда и куда — один и тот же аккаунт."
    source_not_found: "Клиента <code>{from_id}</code> нет среди клиентов бота."
    target_not_found: "Клиента <code>{to_id}</code> нет среди клиентов бота: пусть новый аккаунт сначала напишет боту /start."
    payment_not_found: "У клиента <code>{from_id}</code> нет оплаченного заказа с платежом {payment_id} — перенос только по подтверждённому платежу."
    nothing_to_transfer: "У клиента <code>{from_id}</code> нет идущей оплаченной подписки — переносить нечего."
    refund_open: "У клиента <code>{from_id}</code> идёт возврат оплаты — дождитесь, пока он закончится."
    changed: "Сроки уже изменились — перенос не сделан. Отправьте /transfer заново."
    # {expire_at} — новый срок нового аккаунта
    done: "✅ Подписка перенесена: <code>{to_id}</code> до {expire_at}, у <code>{from_id}</code> доступ отключён. Новому аккаунту отправлено сообщение."
