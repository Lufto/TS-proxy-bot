# Ежедневный отчёт в 10:00 МСК: строка — текст; {at} — время копии по Москве, {size} — размер
report:
  title: "📊 <b>Отчёт за {day}</b>"
  new_clients: "👤 Новых клиентов: {count}"
  trials: "🎁 Пробных выдано: {count}"
  # {amount} — сумма оплат, ₽
  payments: "💰 Оплат: {count} на {amount} ₽"
  # оплаты звёздами за вчера, если были; {stars} — без возвратов, {rubles} — примерно в рублях
  payments_stars: "⭐ Звёздами: {count} на {stars} ⭐ ≈ {rubles} ₽"
  # только если такие есть: оплачены, а доступ не выдан (ждут повтора или администратора)
  unfinished_orders: "⚠️ Оплачено, но доступ не выдан: {count} — проверьте «💰 Оплаты» и «🚨 Тревоги»"
  alerts: "🚨 Тревог: {count}"
  # бот перезапускался вчера или сегодня: счёт тревог в памяти, идёт с запуска
  alerts_since_start: "🚨 Тревог: {count} (считаем с запуска бота {since})"
  bot_backup_sent: "💾 База бота: копия {at}, {size}, в Telegram отправлена"
  bot_backup_not_sent: "💾 База бота: ⚠️ копия {at}, {size}, в Telegram не ушла"
  # копию сделал бот до перезапуска — ушла ли она в Telegram, бот не помнит
  bot_backup_sent_unknown: "💾 База бота: копия {at}, {size}"
  bot_backup_stale: "💾 База бота: ⚠️ нет копии моложе 26 часов (последняя — {at})"
  bot_backup_none: "💾 База бота: ⚠️ ни одной копии"
  bot_backup_unreadable: "💾 База бота: ⚠️ бот не может прочитать папку копий — подробности в логе сервера"
  # RUN_MODE=dev: на Mac бэкап базы бота не запускается
  bot_backup_off: "💾 База бота: бэкап не запускается (режим dev)"
  panel_backup_ok: "💾 Панель: копия {at}, {size}, ошибок отправки в Telegram нет"
  panel_backup_not_sent: "💾 Панель: ⚠️ копия {at}, {size}, в Telegram не ушла"
  panel_backup_stale: "💾 Панель: ⚠️ нет копии моложе 26 часов (последняя — {at})"
  panel_backup_none: "💾 Панель: ⚠️ ни одной копии"
  panel_backup_unreadable: "💾 Панель: ⚠️ бот не может прочитать журнал или папку копий — подробности в логе сервера"
  # PANEL_BACKUP_LOG или PANEL_BACKUP_DIR пусты (на Mac)
  panel_backup_off: "💾 Панель: присмотр выключен (PANEL_BACKUP_DIR и PANEL_BACKUP_LOG не заданы)"
  jobs_ok: "⏱ Фоновые задачи: все работают"
  # {names} — имена задач через запятую
  jobs_stale: "⏱ Фоновые задачи: ⚠️ не отрабатывают — {names}"
